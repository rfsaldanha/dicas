codigos_reservados:
  EXP-VUL-02: Retirado do catálogo operacional brasileiro. O SVI/CDC permanece como comparação metodológica
    no capítulo de contexto; seus percentis norte-americanos não serão recalculados para municípios brasileiros.
  EXP-HAB-01: Substituído por EXP-HAB-02, adensamento domiciliar do Censo 2022. A nova medida não equivale
    ao ODS 11.1.1 completo.
  EFE-EXC-01: 'Retirado do catálogo operacional: estimar óbitos esperados requer especificação de modelo e
    referência. A distinção entre observado e excesso permanece no capítulo de contexto.'
  EFE-EXC-02: Retirado do catálogo operacional junto ao excesso absoluto; P-score depende da mesma estimativa
    de esperado.
  EFE-ATR-01: 'Retirado do catálogo operacional: atribuição à temperatura exige modelo de exposição–resposta,
    defasagens e contrafactual próprios do estudo.'
  EFE-CAR-01: 'Retirado do catálogo operacional: DALYs atribuíveis dependem de modelos, tábuas de vida, pesos
    de incapacidade e contrafactuais não fixados neste catálogo.'
  RES-INF-01: Substituído por RES-WAS-01, com os cinco critérios explícitos do indicador 30 da OMS. A medida
    anterior dependia de um padrão de infraestrutura não especificado.
