  codigo: EFE-MOR-02
  titulo_completo: Taxa de mortalidade cardiovascular e respiratória crônica padronizada por idade
  titulo_resumido: Mortalidade padronizada por idade
  referencia_metodologica: 'RIPSA, edição 2026, MRT.5.04 e MRT.5.05 (grupos de causas); padronização direta:
    OMS, Ahmad et al., 2001, população padrão 2000–2025, tabela 1.'
  conceito: Para cada um dos dois grupos fixos de causas, média ponderada das taxas de mortalidade em 18 faixas
