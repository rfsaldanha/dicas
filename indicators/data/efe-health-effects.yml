  - O resultado depende da população padrão e das faixas etárias.
  - Exige números e denominadores por idade confiáveis.
  - Taxas etárias instáveis contaminam a soma.
  - Não substitui a apresentação de contagens e taxas específicas por idade.
  fontes_dados:
  - id: sim
    papel: 'Dados: óbitos não fetais de residentes por causa básica e ano de ocorrência.'
  - id: ms-pop-2024
    papel: 'Dados: população municipal total ou etária, revisão 2024.'
  metodo_calculo: 'SIM, arquivos DO de todas as UFs, uma única edição por ano, abrangendo óbitos não fetais
    (TIPOBITO=2). Selecionar residentes pelo CODMUNRES, ano de ocorrência em DTOBITO (DDMMAAAA), e causa básica
