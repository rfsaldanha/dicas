indicators:
- tema: Efeitos do clima e do ambiente sobre a saúde
  capitulo: chapters/part-3/14-efeitos-saude.qmd
  capitulo_fichas: chapters/part-4/23-fichas-efeitos-saude.qmd
  dimensoes:
  - efeito
  responsabilidade_gerencial: Área de vigilância epidemiológica e informação em saúde, com apoio de epidemiologia
    e estatística para modelagem e interpretação.
  disponibilidade:
  - Calculável com dados abertos
  qualidade_incerteza: Publicar exclusões por falta de residência, data ou causa; idade ignorada separadamente.
    Ausência de arquivo/competência não é zero óbito. Pequenos números são instáveis; preservar contagens e
    sinalizar cobertura.
  comparabilidade: Manter desfecho, definição, códigos, população, fonte, território, calendário, padronização
    e versão; mudanças assistenciais e de registro podem alterar o indicador sem mudança igual na ocorrência.
  relacao_saude: Mede ocorrência observada ou carga estimada de desfechos; a relação com clima ou ambiente
    exige exposição definida e desenho analítico compatível.
  defasagens_temporais: Ano de ocorrência do óbito; não há modelagem de defasagem entre exposição e efeito.
  aplicacao_gestao: Monitorar impacto, desigualdades e pressão sobre serviços, avaliar alertas e intervenções
    e apoiar priorização, sem atribuir causalidade além do desenho.
  notas: São taxas de ocorrência registrada; não estimam excesso ou atribuição ao clima. Ausência de denominador
    ou denominador zero implica resultado ausente, com motivo. Zero óbito só é válido quando a cobertura dos
    arquivos está completa.
  codigo: EFE-MOR-01
  titulo_completo: Taxa bruta de mortalidade cardiovascular e por doenças respiratórias crônicas
  titulo_resumido: Mortalidade cardiovascular e respiratória crônica
  referencia_metodologica: RIPSA, edição 2026, MRT.5.04 e MRT.5.05; taxa bruta anual de todas as idades pelos
    grupos de causas publicados.
  conceito: Óbitos não fetais de residentes por cada um dos dois grupos de causas, por ano de ocorrência e
    100 mil residentes, todas as idades.
  objetivo: Medir a intensidade da mortalidade por causa ou grupo de causas em uma população.
  interpretacao: Cada taxa expressa a mortalidade registrada por seu grupo de causas. Inclui óbitos com idade
    ignorada que tenham residência, causa e data válidas; estruturas etárias diferentes afetam a comparação.
  usos:
  - Descrever mortalidade por causas sensíveis ao clima e ambiente.
  - Comparar períodos dentro de população estável.
  - Monitorar desigualdades com estratificação.
  - Compor análises epidemiológicas de eventos.
  limitacoes:
  - Depende da qualidade da causa básica e da cobertura do SIM.
  - Códigos diretos de calor ou desastre podem subestimar efeitos indiretos.
  - Pequenas populações produzem taxas instáveis.
  - Comparações territoriais exigem padronização por idade quando as estruturas diferem.
  fontes_dados:
  - id: sim
    papel: 'Dados: óbitos não fetais de residentes por causa básica e ano de ocorrência.'
  - id: ms-pop-2024
    papel: 'Dados: população municipal total ou etária, revisão 2024.'
  metodo_calculo: 'SIM, arquivos DO de todas as UFs, uma única edição por ano, abrangendo óbitos não fetais
    (TIPOBITO=2). Selecionar residentes pelo CODMUNRES, ano de ocorrência em DTOBITO (DDMMAAAA), e causa básica
    CAUSABAS. Não selecionar por município de ocorrência. CODMUNRES é o código DATASUS de seis dígitos: vincular
    à tabela oficial de municípios IBGE de sete dígitos pela correspondência validada, sem preencher códigos
    desconhecidos. Registrar separadamente residência, data e causa ausentes/inválidas. Não misturar versões
    preliminares e finais, nem carregar duas vezes o mesmo arquivo; não deduplicar por atributos pessoais.
    Duas séries independentes, por causa básica CID-10: cardiovasculares I00–I99; respiratórias crônicas J30–J35
    e J37–J98. Remover ponto e espaços do código, converter para maiúsculas e comparar os três primeiros caracteres
    válidos. J36, J99 e causas fora desses intervalos ficam excluídos; não somar as duas séries. Estudo de
    Estimativas Populacionais por Município, Idade e Sexo, revisão 2024, Ministério da Saúde/DATASUS (popsvs2024br.def).
    Usar ambos os sexos, município e mesmo ano do numerador. Para totais, usar o Total publicado; para padronização,
    idade simples ou grupos que componham exatamente as 18 faixas. Fixar a edição e arquivar a tabela extraída;
    não misturar a série antiga 2000–2021, projeções apenas estaduais ou estimativas para o TCU. Se o município/ano
    ou a divisão 80–84/85+ não estiver disponível, não calcular a taxa correspondente. Dividir cada contagem
    anual pela população total e multiplicar por 100.000. Não ajustar sub-registro nem causas mal definidas.'
  formula_calculo: TM_c=100\,000\times\frac{D_{c,res}}{Pop_{res}}
  numerador: Óbitos não fetais de residentes no município, ano de ocorrência e grupo CID-10 fixado; inclui
    idade ignorada.
  denominador: Estudo de Estimativas Populacionais por Município, Idade e Sexo, revisão 2024, Ministério da
    Saúde/DATASUS (popsvs2024br.def). Usar ambos os sexos, município e mesmo ano do numerador. Para totais,
    usar o Total publicado; para padronização, idade simples ou grupos que componham exatamente as 18 faixas.
    Fixar a edição e arquivar a tabela extraída; não misturar a série antiga 2000–2021, projeções apenas estaduais
    ou estimativas para o TCU. Se o município/ano ou a divisão 80–84/85+ não estiver disponível, não calcular
    a taxa correspondente.
  unidade_medida: Óbitos por 100 mil habitantes.
  variaveis_categorias_analise: TIPOBITO, CODMUNRES, DTOBITO, CAUSABAS, IDADE; ano, município, causa e população.
    Ambos os sexos e todas as idades.
  granularidade: Óbito individual na origem e taxa agregada.
  unidade_territorial: Município de residência; agregações somando óbitos e populações antes de calcular taxas.
  resolucao_espacial_original: Município de residência.
  resolucao_temporal: Anual, pelo ano de ocorrência do óbito.
  periodo_referencia: Ano civil do óbito e população do mesmo ano.
  limiar_referencia: Não há limiar universal; comparar com série histórica, território adequado e intervalo
    de incerteza.
  cobertura_geografica: Brasil; municípios com população correspondente disponível.
  periodo_disponivel: Interseção entre os anos do SIM em CID-10 e os da população municipal revisão 2024; nesta
    versão, recorte de 2000 a 2024, limitado às faixas disponíveis.
  periodicidade_atualizacao: Anual, com identificação da versão preliminar ou definitiva do SIM e edição populacional.
  forma_acesso: 'DATASUS: transferência de arquivos SIM DO e TABNET da população municipal por sexo e idade,
    revisão 2024.'
  url_persistente: https://datasus.saude.gov.br/mortalidade-desde-1996-pela-cid-10
  formatos: DBC/DBF do SIM e tabela populacional exportada.
  necessidade_processamento: Aplicar os filtros fixos, validar município e ano e juntar a população; não redistribuir
    causas mal definidas, imputar população ou suavizar taxas.
  analise_descritiva: Publicar contagens, população, taxa por causa, município e ano, versão das bases, exclusões
    e idade ignorada. Apresentar taxa bruta junto da padronizada.
  referencias:
  - '[@ripsa2026]'
  - '[@brasil2026sim]'
  - '[@ms2026populacao]'
  protocolo_versao: '2026-10-06'
  situacao_calculo: abertos
  dependencia_dados_locais: Não depende de coleta local.
  automacao: Condicionada
  condicoes_automacao: Validar a edição, as entradas e os códigos; arquivar a extração com URL, data e SHA-256.
    Implementação em repositório de cálculo separado.
  evidencia_verificacao: Documentação verificada
  detalhe_verificacao: Definição conferida nas referências citadas; nenhuma série deste indicador foi calculada
    nesta revisão.
