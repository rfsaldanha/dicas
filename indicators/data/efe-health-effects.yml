- tema: Efeitos do clima e do ambiente sobre a saúde
  capitulo: chapters/part-3/14-efeitos-saude.qmd
  capitulo_fichas: chapters/part-4/23-fichas-efeitos-saude.qmd
  dimensoes:
  - efeito
  responsabilidade_gerencial: Área de vigilância epidemiológica e informação em saúde, com apoio de epidemiologia
    e estatística para modelagem e interpretação.
  disponibilidade:
  - Calculável com dados abertos
  qualidade_incerteza: Avaliar cobertura, completude, oportunidade, duplicidade, definição de caso, codificação
    CID, causa básica e associadas, revisões, estabilidade do denominador, pequenas contagens e intervalos
    de incerteza.
  comparabilidade: Manter desfecho, definição, códigos, população, fonte, território, calendário, padronização
    e versão; mudanças assistenciais e de registro podem alterar o indicador sem mudança igual na ocorrência.
  relacao_saude: Mede ocorrência observada ou carga estimada de desfechos; a relação com clima ou ambiente
    exige exposição definida e desenho analítico compatível.
  defasagens_temporais: Atrasos de apresentação e processamento podem deslocar o registro em relação à internação
    clínica. Não usar esta série para atribuição diária a um evento ambiental.
  aplicacao_gestao: Monitorar impacto, desigualdades e pressão sobre serviços, avaliar alertas e intervenções
    e apoiar priorização, sem atribuir causalidade além do desenho.
  notas: 'Sem suavização ou correção da cobertura. Ausência de arquivo, diagnóstico, residência ou população
    deve ser sinalizada. Denominador zero/ausente: taxa ausente, nunca zero ou infinita.'
  codigo: EFE-MOB-01
  titulo_completo: Taxas de internações SUS pelos seis grupos de causas da RIPSA D.29
  titulo_resumido: Internações SUS por causa — D.29
  referencia_metodologica: RIPSA, IDB 2010, ficha D.29, tabela de causas CID-10. Seis taxas separadas por 10
    mil residentes; a enumeração da tabela prevalece sobre o resumo abreviado do cabeçalho.
  conceito: Número de AIHs normais aprovadas de residentes, por diagnóstico principal em cada grupo D.29 e
    ano de processamento, por 10 mil habitantes.
  objetivo: Medir a frequência de utilização hospitalar do SUS associada a causas selecionadas em relação à
    população.
  interpretacao: Mede episódios administrativos financiados pelo SUS, não pessoas únicas nem incidência da
    doença. Ano de processamento difere da data clínica de internação.
  usos:
  - Monitorar a utilização hospitalar anual pelos seis grupos de causas.
  - Comparar anos de processamento e municípios com cobertura verificada.
  - Planejar capacidade assistencial.
  limitacoes:
  - Cobre internações financiadas pelo SUS, não toda assistência hospitalar.
  - Uma pessoa pode gerar mais de uma AIH ou internação.
  - Oferta, acesso e regras de faturamento modificam a taxa.
  - Diagnóstico principal não identifica a exposição ambiental.
  - Ano de processamento difere do ano clínico de internação.
  fontes_dados:
  - id: sih-sus
    papel: 'Dados: arquivos reduzidos RD, AIHs aprovadas, diagnóstico principal e residência.'
  - id: ms-pop-2024
    papel: 'Dados: população municipal total, revisão 2024.'
  metodo_calculo: 'Usar arquivos SIH/SUS RD (layout desde 2008) de todas as UFs e das 12 competências do ano,
    pois residentes podem ser atendidos em outra UF. Selecionar ANO_CMPT (ano de processamento), MES_CMPT de
    01 a 12, IDENT=1 (AIH normal); excluir IDENT=5 (continuidade), registrar tipos ausentes/inválidos separadamente.
    Contar uma linha de AIH aprovada por registro do arquivo, sem deduplicar pessoas ou reunir reinternações.
    Não carregar o mesmo arquivo duas vezes; duplicata técnica de ingestão é erro, não internação adicional.
    MUNIC_RES determina residência; vincular código DATASUS de seis dígitos à correspondência IBGE. DIAG_PRINC
    determina o grupo, usando os três primeiros caracteres CID-10 válidos após retirar ponto e espaços. Seis
    grupos independentes: neoplasias C00–C97 e D46; diabetes E10–E14; doenças hipertensivas I10–I15; isquêmicas
    do coração I20–I25; cerebrovasculares I60–I69; pneumonia J12–J18. Dividir cada contagem pela população
    total e multiplicar por 10.000. Estudo de Estimativas Populacionais por Município, Idade e Sexo, revisão
    2024, Ministério da Saúde/DATASUS (popsvs2024br.def). Usar ambos os sexos, município e mesmo ano do numerador.
    Para totais, usar o Total publicado; para padronização, idade simples ou grupos que componham exatamente
    as 18 faixas. Fixar a edição e arquivar a tabela extraída; não misturar a série antiga 2000–2021, projeções
    apenas estaduais ou estimativas para o TCU. Se o município/ano ou a divisão 80–84/85+ não estiver disponível,
    não calcular a taxa correspondente.'
  formula_calculo: TI_g=10\,000\times AIH_{g,res,processamento}/Pop_{res}
  numerador: AIHs normais aprovadas, IDENT=1, por grupo DIAG_PRINC, município MUNIC_RES e ano ANO_CMPT; exclui
    continuidade tipo 5.
  denominador: Estudo de Estimativas Populacionais por Município, Idade e Sexo, revisão 2024, Ministério da
    Saúde/DATASUS (popsvs2024br.def). Usar ambos os sexos, município e mesmo ano do numerador. Para totais,
    usar o Total publicado; para padronização, idade simples ou grupos que componham exatamente as 18 faixas.
    Fixar a edição e arquivar a tabela extraída; não misturar a série antiga 2000–2021, projeções apenas estaduais
    ou estimativas para o TCU. Se o município/ano ou a divisão 80–84/85+ não estiver disponível, não calcular
