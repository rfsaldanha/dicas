    Duas séries independentes, por causa básica CID-10: cardiovasculares I00–I99; respiratórias crônicas J30–J35
    e J37–J98. Remover ponto e espaços do código, converter para maiúsculas e comparar os três primeiros caracteres
    válidos. J36, J99 e causas fora desses intervalos ficam excluídos; não somar as duas séries. Estudo de
    Estimativas Populacionais por Município, Idade e Sexo, revisão 2024, Ministério da Saúde/DATASUS (popsvs2024br.def).
    Usar ambos os sexos, município e mesmo ano do numerador. Para totais, usar o Total publicado; para padronização,
    idade simples ou grupos que componham exatamente as 18 faixas. Fixar a edição e arquivar a tabela extraída;
    não misturar a série antiga 2000–2021, projeções apenas estaduais ou estimativas para o TCU. Se o município/ano
    ou a divisão 80–84/85+ não estiver disponível, não calcular a taxa correspondente. Decodificar IDADE: unidade
    0 (01–59 minutos), 1 (01–23 horas), 2 (01–29 dias) e 3 (01–11 meses) pertencem a 0–4; unidade 4 informa
    anos completos nos dois últimos dígitos; unidade 5 informa 100 mais esses dígitos. Unidade 9, vazio, 000
    ou valor inválido: idade ignorada, fora da soma e publicada separadamente. Agrupar 0–4, 5–9, …, 80–84 e
    85+; 5 anos pertence a 5–9 e 85 anos a 85+. Para cada faixa dividir óbitos por população, multiplicar pelo
    peso e somar; multiplicar a soma por 100.000. Exigir todas as 18 populações positivas e presentes; não
    repartir um grupo 80+ nem renormalizar pesos sobre faixas disponíveis. Sem imputação ou suavização. Pesos
    percentuais da tabela 1, na ordem das faixas: 8.86, 8.69, 8.60, 8.47, 8.22, 7.93, 7.61, 7.15, 6.59, 6.04,
    5.37, 4.55, 3.72, 2.96, 2.21, 1.52, 0.91, 0.63. Cada peso normalizado é o valor publicado dividido por
    100.03; a soma é um. Quadro completo e CSV dos pesos neste capítulo.'
  formula_calculo: TMP_c=100\,000\times\sum_a\left(\frac{D_{c,a}}{Pop_a}\right)w_a,\qquad \sum_a w_a=1
  numerador: Soma ponderada das taxas específicas por idade; não há numerador observado único.
  denominador: Estudo de Estimativas Populacionais por Município, Idade e Sexo, revisão 2024, Ministério da
