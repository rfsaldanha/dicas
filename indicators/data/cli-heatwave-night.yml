  - <<: *night_common
    codigo: CLI-CAL-13
    titulo_completo: "Intensidade excedente diária e acumulada de ondas de calor (CEHWI)"
    titulo_resumido: Excesso acumulado — CEHWI
    referencia_metodologica: Cumulative Excess Heatwave Index aplicado por Liu et al. às relações não lineares entre ondas diurnas, noturnas e compostas e mortalidade.
    conceito: Média do excesso positivo da temperatura horária sobre o limiar térmico diário durante as horas pertinentes de cada dia de onda, acumulável ao longo do episódio.
    objetivo: Representar simultaneamente excesso térmico e persistência durante ondas diurnas, noturnas ou compostas, sem reduzi-las a uma exposição binária.
    interpretacao: Valor diário maior indica excesso médio mais elevado entre as horas acima do limiar. A soma ao longo da onda representa acumulação; seu gradiente de risco depende do tipo de onda, cidade e desfecho.
    usos: [Modelar relações exposição–resposta com mortalidade., Comparar intensidade de ondas diurnas, noturnas e compostas., Estimar carga atribuível em estudos epidemiológicos.]
    limitacoes: [Requer dados horários e horários locais de nascer e pôr do sol., A definição publicada foi avaliada em cidades do leste da Ásia., O limiar varia por calendário e local., Não é índice fisiológico nem protocolo de alerta universal.]
    metodo_calculo: "Reconstituir dias em hora solar local (UTC+longitude/15), por interpolação linear horária, e o nascer/pôr do sol pela geometria solar da latitude e data. Para onda diurna usar horas entre nascer e pôr do sol e limiar P90(TX); noturna, horas fora desse intervalo e P90(TN); composta, 24 horas e P90(Tmédia). Em cada dia de onda, somar apenas excessos horários positivos e dividir pelo número de horas com excesso: esta é a intensidade diária em °C. Somar as intensidades diárias de um evento para a intensidade acumulada em °C·dia; publicar o máximo anual desta última por tipo e por ano de início do evento. Se não houver hora excedente em um dia de onda, registrar não aplicável, sem dividir por zero; sem evento anual, zero."
    formula_calculo: "\\begin{aligned}CEHWI_{d,k}&=\\frac{\\sum_{h\\in H_{d,k}}\\max(0,T_h-L_{d,k})}{\\sum_{h\\in H_{d,k}}I(T_h>L_{d,k})}\\\\CEHWI_{e,k}&=\\sum_{d\\in e}CEHWI_{d,k}\\end{aligned}"
    numerador: Soma dos excessos horários positivos sobre o limiar pertinente no dia e tipo de onda.
    denominador: Número de horas do período da onda em que a temperatura excede o limiar.
    unidade_medida: "°C na intensidade diária; °C·dia na intensidade acumulada do evento."
    variaveis_categorias_analise: Temperatura horária; TX, TN e temperatura média; nascer e pôr do sol; tipo de onda; episódio; cidade.
    granularidade: "Calcular o indicador em cada célula antes da média municipal ponderada pela área; manter produto, célula, ano e código IBGE de sete dígitos."
    resolucao_temporal: "Horária em hora solar local; saída diária, por evento e máximo anual por tipo."
    periodo_referencia: "1981–2010; P90 de TX, TN e temperatura média diária em janelas centradas de 15 dias, quantil tipo 8."
    limiar_referencia: "Pelo menos dois dias de TX≥P90 para ondas diurnas, TN≥P90 para noturnas, ou ambas para compostas; tipos devem ser publicados separadamente."
    url_persistente: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land"
    periodo_disponivel: "1950–presente; publicar anos completos até 2025 e identificar 2026 como parcial. A janela inicial utilizável depende dos antecedentes exigidos pela medida."
    periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
    forma_acesso: "API do Climate Data Store, dataset reanalysis-era5-land, product_type=reanalysis, todas as 24 horas UTC; download NetCDF ou GRIB por mês e recorte espacial."
    formatos: "NetCDF ou GRIB de entrada; CSV/Parquet para séries municipais."
    necessidade_processamento: "Converter kelvin para °C; obter TX e TN como máximo e mínimo das 24 temperaturas horárias válidas de cada dia UTC. Calcular a medida por célula e, depois, sua média municipal por área. Esta TX não é a máxima instantânea de termômetro."
    analise_descritiva: Mostrar distribuição do CEHWI por tipo de onda, trajetória diária, total por episódio, percentis locais e curvas exposição–resposta com intervalos de incerteza.
    referencias: ["[@liu2025cehwi]"]
    fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly, variável 2m_temperature; extrair TX/TN conforme o método da ficha"}, {"id": "inmet", "papel": "Validação local e séries observadas separadas da reanálise"}]
    resolucao_espacial_original: "ERA5-Land: grade de 0,1°; malha municipal IBGE 2022 como recorte fixo."
    unidade_territorial: "Célula de grade; município como síntese ponderada pela área de interseção."
    cobertura_geografica: "Todos os municípios brasileiros no domínio da grade. Não representa diretamente a exposição individual ou o microclima de cada bairro."
    qualidade_incerteza: "Dia com menos de 24 horas válidas na grade é ausente. Nas sínteses anuais, mais de 15 dias ausentes, ou mais de três em qualquer mês, invalidam o ano; falhas não recebem zero e não unem sequências. Exigir 90% dos dados do período-base e registrar a cobertura. Sínteses municipais exigem ao menos 90% de área válida; informar essa fração. Critérios de cobertura são escolhas editoriais deste protocolo."
    comparabilidade: "Fixar versão, calendário UTC, período-base e limites municipais de 2022. Não emendar estação e reanálise. Médias municipais de contagens podem ser fracionárias e não contam episódios sincrônicos do município."
    notas: "A discretização horária e o resumo municipal são especificações operacionais do livro baseadas em Liu et al.; não confundir média de excesso com soma de graus-hora. Não combinar esta variante solar com séries calculadas em dias UTC."
