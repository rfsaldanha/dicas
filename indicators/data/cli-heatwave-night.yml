  - <<: *night_common
    codigo: CLI-CAL-12
    titulo_completo: Frequência de dias em ondas de calor compostas diurnas e noturnas (CHW)
    titulo_resumido: Dias em ondas compostas — CHW
    referencia_metodologica: Definição epidemiológica multicêntrica de Liu et al. para ondas diurnas, noturnas e compostas no leste da Ásia.
    conceito: Número de dias pertencentes a sequências de pelo menos dois dias consecutivos em que tanto a temperatura máxima quanto a mínima atingem ou excedem seus respectivos percentis 90 específicos do calendário.
    objetivo: Quantificar dias sem alívio térmico entre o período diurno e o noturno segundo uma definição aplicada à mortalidade.
    interpretacao: Valor maior indica mais dias em episódios compostos. Deve ser lido junto com número, duração e intensidade das ondas, pois a mesma frequência pode resultar de poucos episódios longos ou vários curtos.
    usos: [Caracterizar exposição composta dia–noite., Avaliar mortalidade e utilização de serviços durante episódios., Apoiar sistemas de alerta que considerem recuperação noturna.]
    limitacoes: [A duração de dois dias e o percentil 90 refletem a especificação publicada, não um limiar universal., Depende da qualidade conjunta de TX e TN., Não mede condições internas, proteção individual ou acesso a resfriamento., Classificações de onda diurna, noturna e composta são mutuamente condicionadas.]
    metodo_calculo: "Estimar separadamente P90 de TX e TN em janelas de 15 dias na base 1981–2010. Marcar dias com ambas as condições ≥, identificar sequências ≥2 dias e contar seus dias por ano civil. Detectar sequências continuamente, incluindo os dias de fronteira; contar apenas os dias do ano de saída. Sem onda, zero. A síntese municipal é a média por área dessas contagens."
    formula_calculo: "CHWF_y=\\sum_{d\\in y}I(d\\in C_{DN})"
    numerador: "Dias do ano pertencentes a C_DN, conjunto de dias em sequências de pelo menos dois dias com TX≥P90(TX) e TN≥P90(TN)."
    denominador: Não se aplica.
    unidade_medida: "Dias por ano; média de dias por área na síntese municipal."
    variaveis_categorias_analise: Temperatura máxima e mínima diárias; percentis do calendário; episódio; local; temporada.
    granularidade: "Calcular o indicador em cada célula antes da média municipal ponderada pela área; manter produto, célula, ano e código IBGE de sete dígitos."
    resolucao_temporal: "Entradas horárias; extremos diários em 00–23 UTC; saída anual, salvo estação quente ou produto explicitados."
    periodo_referencia: "1981–2010."
    limiar_referencia: "TX ≥ P90(TX) e TN ≥ P90(TN), simultaneamente, por pelo menos dois dias; janela calendário centrada de 15 dias, quantil tipo 8."
    url_persistente: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land"
    periodo_disponivel: "1950–presente; publicar anos completos até 2025 e identificar 2026 como parcial. A janela inicial utilizável depende dos antecedentes exigidos pela medida."
    periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
    forma_acesso: "API do Climate Data Store, dataset reanalysis-era5-land, product_type=reanalysis, todas as 24 horas UTC; download NetCDF ou GRIB por mês e recorte espacial."
    formatos: "NetCDF ou GRIB de entrada; CSV/Parquet para séries municipais."
    necessidade_processamento: "Converter kelvin para °C; obter TX e TN como máximo e mínimo das 24 temperaturas horárias válidas de cada dia UTC. Calcular a medida por célula e, depois, sua média municipal por área. Esta TX não é a máxima instantânea de termômetro."
    analise_descritiva: Apresentar dias CHW, número e duração dos episódios, datas, TX e TN excedentes e comparação com ondas somente diurnas e somente noturnas.
    referencias: ["[@liu2025cehwi]", "[@yang2024compound]"]
    fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly, variável 2m_temperature; extrair TX/TN conforme o método da ficha"}, {"id": "inmet", "papel": "Validação local e séries observadas separadas da reanálise"}]
    resolucao_espacial_original: "ERA5-Land: grade de 0,1°; malha municipal IBGE 2022 como recorte fixo."
    unidade_territorial: "Célula de grade; município como síntese ponderada pela área de interseção."
    cobertura_geografica: "Todos os municípios brasileiros no domínio da grade. Não representa diretamente a exposição individual ou o microclima de cada bairro."
    qualidade_incerteza: "Dia com menos de 24 horas válidas na grade é ausente. Nas sínteses anuais, mais de 15 dias ausentes, ou mais de três em qualquer mês, invalidam o ano; falhas não recebem zero e não unem sequências. Exigir 90% dos dados do período-base e registrar a cobertura. Sínteses municipais exigem ao menos 90% de área válida; informar essa fração. Critérios de cobertura são escolhas editoriais deste protocolo."
    comparabilidade: "Fixar versão, calendário UTC, período-base e limites municipais de 2022. Não emendar estação e reanálise. Médias municipais de contagens podem ser fracionárias e não contam episódios sincrônicos do município."
    notas: "Protocolo municipal do livro. Reproduzir o método internacional na célula; a agregação municipal por área é uma adaptação explícita. A série nacional ainda não foi produzida."
