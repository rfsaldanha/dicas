common: &heat_exposure_common
  tema: Temperatura e condições térmicas
  capitulo: chapters/part-2/07-temperatura-condicoes-termicas.qmd
  capitulo_fichas: chapters/part-4/16-fichas-temperatura-condicoes-termicas.qmd
  dimensoes: [perigo, exposição]
  cobertura_geografica: Território de análise coberto simultaneamente pelas superfícies de calor e pelos dados populacionais, quando aplicável.
  responsabilidade_gerencial: Serviço meteorológico ou climático responsável pelo perigo, instituição estatística responsável pela população e autoridade de saúde responsável pelo uso.
  disponibilidade: [requer processamento geoespacial]
  qualidade_incerteza: Documentar definição da onda, período-base, grade, conectividade, área real das células, máscara de terra, fonte e ano da população, imputações, mobilidade não observada e propagação de incerteza.
  comparabilidade: Manter definição térmica, período-base, resolução, projeção, vizinhança espacial, população de referência e agregação temporal; mudanças metodológicas interrompem comparabilidade direta.
  defasagens_temporais: Preservar a data de cada dia de onda e do desfecho para análises agudas; pessoas-dia acumuladas não informam sozinhas a sequência nem as defasagens.
  notas: Extensão e exposição populacional não medem vulnerabilidade nem dano. O mesmo valor pode envolver populações, duração, intensidade e capacidades de proteção muito diferentes.
  aplicacao_gestao: Dimensionar coordenação regional, comunicação, insumos, capacidade assistencial e avaliação de alcance, sempre combinado com intensidade, duração e vulnerabilidade.

indicators:
  - <<: *heat_exposure_common
    codigo: CLI-EXP-01
    titulo_completo: "Extensão regional máxima de ondas de calor que interceptam o município"
    titulo_resumido: "Extensão regional das ondas de calor"
    referencia_metodologica: Método de componentes conexos de Skinner et al. para identificar e medir ondas de calor espacialmente contíguas.
    conceito: Área total das células de grade espacialmente conectadas que, em um mesmo dia, pertencem a uma onda de calor definida por limiar e duração explícitos.
    objetivo: Medir o tamanho territorial de episódios de calor espacialmente coerentes.
    interpretacao: "Quanto maior o valor, mais extenso foi o evento regional que interceptou o município; não é a área afetada dentro dele."
    usos: [Caracterizar alcance regional de ondas de calor., Planejar coordenação entre jurisdições e redes assistenciais., Contextualizar população e serviços potencialmente expostos.]
    limitacoes: [Depende fortemente da resolução e da regra de vizinhança., A definição publicada conecta células por aresta ou canto e admite separações especificadas; adaptações devem ser declaradas., A área não informa intensidade nem população., Continuidade física pode ser afetada por máscaras de costa, ilhas e lacunas.]
    fontes_dados: [{"id": "berkeley-earth-daily", "papel": "Temperatura diária interpolada em grade de 1°; protocolo e código de Skinner et al."}]
    metodo_calculo: "Reproduzir a máscara diária e o agrupamento global do código arquivado em Zenodo 16595017. Unir grupos próximos conforme o algoritmo publicado, sem somar à área as células intermediárias que não atendem ao limiar. A área diária de cada componente é a soma das áreas das suas células efetivamente em onda. Para cada município e dia, selecionar a maior área regional dos componentes que o interceptam; no ano, selecionar o máximo diário. Sem interseção em ano válido, zero. Esta atribuição municipal é uma adaptação explícita do livro."
    formula_calculo: "\\begin{aligned}A_{c,d}&=\\sum_{g\\in c,\\,HW_{g,d}=1}a_g\\\\A_{m,y}&=\\max_{d\\in y,\\,c:\\,c\\cap m\\ne\\varnothing}A_{c,d}\\end{aligned}"
    numerador: Soma da área das células pertencentes ao componente contíguo no dia.
    denominador: "Não se aplica; área absoluta do evento regional."
    unidade_medida: "km² de extensão regional."
    variaveis_categorias_analise: Célula em onda ou não; componente; data; episódio; área da célula; território.
    granularidade: "Componente espacial regional por dia; município como localização interceptada."
    unidade_territorial: "Componente regional e município interceptado; a extensão não é limitada à área municipal."
    resolucao_espacial_original: "1° na reprodução de Skinner et al.; área esférica da célula."
    resolucao_temporal: "Diária e máximo anual."
    periodo_referencia: "1980–2019; P90 por dia do calendário em janela centrada de 15 dias, conforme código publicado."
    limiar_referencia: "TX>P90 por pelo menos três dias; conectividade de oito vizinhos e união de componentes separados por até quatro células sem calor conforme código publicado."
    url_persistente: "https://zenodo.org/records/16595017"
    periodo_disponivel: "1980–2019 na reprodução do estudo; não prolongar sem verificar versão, cobertura e compatibilidade."
    periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
    forma_acesso: "Downloads públicos Berkeley Earth e código arquivado em Zenodo 16595017; conservar a versão e os arquivos utilizados."
    formatos: "NetCDF da temperatura e saídas tabulares do agrupamento."
    necessidade_processamento: "Executar o agrupamento em domínio global, não apenas no recorte municipal ou brasileiro; calcular a área das células e cruzar as máscaras com municípios."
    analise_descritiva: "Apresentar área regional máxima em km², data e componente que intercepta o município, com sensibilidade à conectividade; não chamar essa extensão de proporção da área municipal."
    relacao_saude: Episódios extensos podem expor simultaneamente múltiplas populações e pressionar redes de energia, água, emergência e saúde, mas a extensão não estima sozinha a carga sanitária.
    referencias: ["[@skinner2025extent]", "[@skinner2025code]"]
    cobertura_geografica: "Municípios brasileiros interceptados por componentes do domínio global válido."
    qualidade_incerteza: "Aplicar calendário, máscara de terra e controle de qualidade do código arquivado em Zenodo 16595017 à temperatura diária Berkeley Earth. Oceano fora do domínio não é falha observacional. Lacunas em terra que alterem a conectividade não recebem zero nem são pontes de calor; sinalizar dias/componentes não calculáveis. Não aplicar a exigência de 24 observações horárias a esse produto diário."
    comparabilidade: "Fixar Berkeley Earth, grade de 1°, base e código do depósito 16595017. Outra grade, base ou regra de união exige uma série distinta."
    notas: "A extensão pode exceder a área municipal, pois descreve o evento regional. Não é área municipal afetada nem medida de população exposta."
    protocolo_versao: "2026-10-03"
    situacao_calculo: "abertos"
    disponibilidade: ["Calculável com dados abertos"]
    dependencia_dados_locais: "Opcional para validação"
    automacao: "Condicionada"
    condicoes_automacao: "Download do produto diário Berkeley Earth e reprodução do código arquivado; processamento global da conectividade."
    evidencia_verificacao: "Documentação verificada"
    detalhe_verificacao: "Produto e método documentados; série municipal completa ainda não produzida."



  - <<: *heat_exposure_common
    codigo: CLI-EXP-02
    titulo_completo: "Pessoas-dia de menores de um ano e de pessoas com 65 anos ou mais expostas a ondas de calor"
    titulo_resumido: Pessoas-dia expostas a ondas de calor
    referencia_metodologica: Indicador 1.1.1 do Lancet Countdown para exposição de menores de um ano e pessoas com 65 anos ou mais a dias de onda de calor.
    conceito: Soma, em todas as células e dias, do número de pessoas do grupo etário residente em célula classificada como exposta a uma onda de calor.
    objetivo: Integrar alcance populacional e duração da exposição de grupos etários com maior suscetibilidade ao calor.
    interpretacao: Uma pessoa-dia equivale a uma pessoa exposta durante um dia. Cem pessoas expostas por dez dias produzem mil pessoas-dia, assim como mil pessoas expostas por um dia; por isso, o total deve ser acompanhado de pessoas expostas, dias por pessoa e distribuição temporal.
    usos: [Monitorar exposição de lactentes e pessoas idosas., Comparar períodos e territórios com metodologia harmonizada., Dimensionar comunicação, busca ativa e capacidade assistencial.]
    limitacoes: [População residencial em grade não representa mobilidade, ocupação ou tempo em ambientes internos., A definição do Lancet Countdown considera pelo menos dois dias com TX e TN acima do percentil 95 local., Mudanças demográficas e mudanças no perigo contribuem conjuntamente para o total., Fontes populacionais distintas antes e depois de 2000 podem introduzir inconsistência.]
    fontes_dados: [{"id": "era5-land", "papel": "TX e TN diárias na grade"}, {"id": "worldpop-age", "papel": "Global1 Age/Sex Structures, Brasil, 2000–2020, grades anuais de população por idade e sexo"}]
    metodo_calculo: "Construir a máscara de ondas na grade ERA5-Land com TX e TN, limiares de toda a base 1986–2005, quantil tipo 8, e sequências ≥2 dias. Somar a população WorldPop de idade 0 e, separadamente, todas as faixas de 65 anos ou mais, ambos os sexos. Intersectar as células populacionais de 100 m com município e célula climática, repartindo a contagem pela fração de área de interseção, sem interpolação bilinear de contagens. Para cada ano de 2000–2020, manter sua população anual constante nos dias e somar população×dias em onda. Publicar as duas faixas separadamente."
    formula_calculo: 'PD_{a,t}=\sum_d\sum_g I(HW_{g,d}=1)\times Pop_{a,g,t}'
    numerador: Não se aplica; soma de produtos célula-dia.
    denominador: "Não se aplica à contagem de pessoas-dia; taxas por pessoa são indicadores adicionais e devem ser identificadas separadamente."
    unidade_medida: "Pessoas-dia por ano, por faixa etária."
    variaveis_categorias_analise: TX; TN; percentis locais; dia; célula; idade menor de um ano; idade de 65 anos ou mais; sexo e território quando disponíveis.
    granularidade: "Fragmento de interseção população–clima–município, por dia e faixa etária; somar pessoas-dia, sem média territorial por área."
    unidade_territorial: "Município IBGE 2022; população coberta pelas interseções de grades."
    resolucao_espacial_original: "Clima 0,1°; população WorldPop Global1 nominalmente 100 m."
    resolucao_temporal: "Entradas horárias; extremos diários em 00–23 UTC; saída anual, salvo estação quente ou produto explicitados."
    periodo_referencia: "1986–2005; P95 de todas as TX e todas as TN da base, separadamente, sem janela calendário."
    limiar_referencia: "TX>P95(TX) e TN>P95(TN) simultaneamente por pelo menos dois dias consecutivos."
    url_persistente: "https://hub.worldpop.org/Global1_2000-2020_AgeSexStructures"
    periodo_disponivel: "2000–2020 com WorldPop Global1; versão Global2 R2025A é uma série distinta, não uma continuação automática."
    periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
    forma_acesso: "API CDS para clima e downloads GeoTIFF de idade/sexo no WorldPop Global1, Brasil, unconstrained, 2000–2020."
    formatos: "NetCDF/GRIB climático; GeoTIFF de contagens populacionais."
    necessidade_processamento: "Sobreposição conservativa de população, clima e municípios; máscara diária de ondas; soma anual de pessoas-dia. Não usar população municipal total como se fosse população por faixa etária na grade."
    analise_descritiva: Apresentar total de pessoas-dia, dias por pessoa, número de pessoas residentes em áreas expostas, grupos etários, tendência, decomposição entre demografia e frequência térmica e distribuição territorial.
    relacao_saude: Lactentes e pessoas idosas apresentam maior suscetibilidade a agravos e mortalidade pelo calor; o indicador mede exposição populacional, não casos nem risco individual.
    referencias: ["[@romanello2024lancet]", "[@lancetcountdown2026data]"]
    cobertura_geografica: "Todos os municípios brasileiros no domínio da grade. Não representa diretamente a exposição individual ou o microclima de cada bairro."
    qualidade_incerteza: "Requer população anual por idade e todos os dias climáticos válidos nas células incluídas na soma. Exigir ≥90% da população da faixa etária no município com série climática completa; publicar a contagem de pessoas-dia somente para a população coberta, junto à cobertura, sem extrapolar para os não cobertos. Abaixo disso, resultado ausente. Não confundir população zero com ausência da grade etária."
    comparabilidade: "Fixar versão, calendário UTC, período-base e limites municipais de 2022. Não emendar estação e reanálise. Médias municipais de contagens podem ser fracionárias e não contam episódios sincrônicos do município."
    notas: "Não extrapolar automaticamente as faixas etárias do Censo para todos os anos. Versões Global1 e Global2, e grades constrained/unconstrained, precisam de identificadores de série distintos."
    protocolo_versao: "2026-10-03"
    situacao_calculo: "abertos"
    disponibilidade: ["Calculável com dados abertos"]
    dependencia_dados_locais: "Opcional para validação"
    automacao: "Condicionada"
    condicoes_automacao: "API CDS para 2m_temperature e download de todos os arquivos de idade/sexo WorldPop Global1 necessários às faixas <1 e ≥65 anos, de 2000–2020; conservar versão e contagens."
    evidencia_verificacao: "Documentação verificada"
    detalhe_verificacao: "Produto e método documentados; série municipal completa ainda não produzida."
