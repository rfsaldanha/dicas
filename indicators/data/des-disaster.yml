common: &disaster_common
  tema: Eventos meteorológicos severos e desastres
  capitulo: chapters/part-2/10-eventos-severos-desastres.qmd
  dimensoes: [efeito, resposta, exposição]
  responsabilidade_gerencial: Proteção e defesa civil consolida perdas e danos; saúde verifica óbitos, agravos e serviços; estatística fornece denominadores.
  qualidade_incerteza: Relatar definição, desastre, local, período, fonte, verificação, revisões, duplicidades, sub-registro e denominador.
  comparabilidade: Manter taxonomia, componente, regra de atribuição, período, população e versão do registro; totais preliminares e consolidados devem ser distinguidos.
  relacao_saude: Mortes, pessoas afetadas e interrupção de serviços expressam efeitos diretos e condições que ampliam riscos sanitários durante e após desastres.
  defasagens_temporais: Registrar data do evento e do efeito; mortes, doenças e interrupções podem ocorrer durante ou depois e exigir janela de atribuição.
  aplicacao_gestao: Quantificar impactos, organizar resposta, direcionar recursos, monitorar redução de risco e avaliar recuperação.
  notas: As fichas seguem indicadores Sendai/ODS. Contagens nacionais devem observar os procedimentos oficiais de validação e evitar dupla contagem.

indicators:
  - <<: *disaster_common
    codigo: DES-HUM-01
    titulo_completo: Número de mortes e pessoas desaparecidas atribuídas a desastres por 100 mil habitantes (ODS 1.5.1/11.5.1/13.1.1)
    titulo_resumido: Mortes e desaparecidos por desastres
    referencia_metodologica: Série harmonizada dos indicadores ODS 1.5.1, 11.5.1 e 13.1.1, sob custódia do UNDRR.
    conceito: Soma de pessoas mortas e desaparecidas cuja ocorrência é atribuída a desastres, dividida pela população e multiplicada por 100 mil.
    objetivo: Monitorar a mortalidade e desaparecimento associados a desastres em escala comparável.
    interpretacao: Valor maior indica maior impacto humano relativo à população. Mortes e desaparecimentos devem também ser apresentados separadamente e por tipo de perigo.
    usos: [Monitorar ODS e Marco de Sendai., Comparar períodos e territórios., Avaliar políticas de redução de risco.]
    limitacoes: [Atribuição e janela temporal variam., Desaparecido não é óbito confirmado., Eventos raros produzem taxas instáveis em populações pequenas., Sub-registro e revisão pós-evento alteram totais.]
    metodo_calculo: Consolidar mortes e desaparecidos atribuídos a eventos conforme definições Sendai, deduplicar pessoas e eventos, somar no período e dividir pela população média ou de referência.
    formula_calculo: 'T_{MM}=100000\times\frac{N_{mortos}+N_{desaparecidos}}{Pop_{referência}}'
    numerador: Número de mortes mais pessoas desaparecidas atribuídas a desastres, sem duplicidade.
    denominador: População do território no período.
    unidade_medida: Pessoas por 100 mil habitantes.
    variaveis_categorias_analise: Morto; desaparecido; perigo; desastre; sexo; idade; deficiência; município; data.
    granularidade: Pessoa/evento no registro e território/período na taxa.
    unidade_territorial: Município, estado, país ou agregação.
    resolucao_espacial_original: Local do evento e residência quando disponíveis.
    resolucao_temporal: Evento; resumo anual ou plurianual.
    periodo_referencia: Ano ou período, com população compatível.
    limiar_referencia: Não se aplica; objetivo é redução.
    fontes_dados:
      - id: s2id
        papel: registros brasileiros de desastre e danos humanos
      - id: datasus
        papel: verificação complementar de óbitos e causas, sem substituição automática
      - id: ibge
        papel: população denominadora
    cobertura_geografica: Brasil no S2ID; comparabilidade internacional conforme UNDRR.
    periodo_disponivel: Conforme registros e consolidação nacional.
    periodicidade_atualizacao: Por evento e consolidação anual, com revisões.
    forma_acesso: S2ID, relatórios nacionais e sistema ODS.
    url_persistente: https://unstats.un.org/sdgs/metadata/files/Metadata-01-05-01.pdf
    formatos: Registros administrativos e tabelas.
    disponibilidade: [disponível em registros de desastre, sujeito a revisão]
    necessidade_processamento: Vincular evento, deduplicar, verificar status, harmonizar população e calcular taxa.
    analise_descritiva: Mostrar contagens e taxas, perigo, território, perfil das vítimas, incerteza e evolução de registros.
    referencias: ["[@un2024disasters]", "[@who2021edrmresearch]"]

  - <<: *disaster_common
    codigo: DES-HUM-02
    titulo_completo: Número de pessoas diretamente afetadas por desastres por 100 mil habitantes (ODS 1.5.1/11.5.1/13.1.1)
    titulo_resumido: Pessoas diretamente afetadas por desastres
    referencia_metodologica: Componente de pessoas diretamente afetadas dos indicadores ODS 1.5.1, 11.5.1 e 13.1.1 e do Marco de Sendai.
    conceito: Número de pessoas feridas ou enfermas, com moradia danificada ou destruída ou meios de vida interrompidos ou destruídos, atribuídos a desastres, por 100 mil habitantes.
    objetivo: Medir a extensão populacional direta dos impactos além de mortes e desaparecimentos.
    interpretacao: Valor maior indica maior alcance direto relativo. Os componentes devem ser preservados porque representam necessidades diferentes.
    usos: [Dimensionar resposta e assistência., Monitorar ODS/Sendai., Avaliar desigualdades e recuperação.]
    limitacoes: [Categorias podem se sobrepor., “Afetado” deve seguir definição de diretamente afetado., Danos a moradia podem ser convertidos em pessoas por coeficientes., Registros administrativos dependem da capacidade local.]
    metodo_calculo: Consolidar componentes definidos no metadado, aplicar regras nacionais para evitar dupla contagem e estimativas de ocupantes, somar pessoas únicas ou estimadas e dividir pela população.
    formula_calculo: 'T_{afetados}=100000\times\frac{N_{diretamente\ afetados}}{Pop_{referência}}'
    numerador: Pessoas diretamente afetadas segundo os componentes Sendai, com tratamento de sobreposição.
    denominador: População do território.
    unidade_medida: Pessoas por 100 mil habitantes.
    variaveis_categorias_analise: Ferido/enfermo; moradia danificada/destruída; meios de vida; deslocamento; perigo; território; grupo.
    granularidade: Componente por evento e território.
    unidade_territorial: Município, estado, país ou agregação.
    resolucao_espacial_original: Local do impacto.
    resolucao_temporal: Evento e resumo anual/plurianual.
    periodo_referencia: Período e população compatível.
    limiar_referencia: Não se aplica; objetivo é redução.
    fontes_dados:
      - id: s2id
        papel: danos humanos e materiais vinculados ao evento
      - id: ibge
        papel: população e características territoriais
    cobertura_geografica: Brasil, condicionada ao registro municipal e validação.
    periodo_disponivel: Conforme S2ID.
    periodicidade_atualizacao: Por evento e consolidação anual.
    forma_acesso: S2ID e relatórios.
    url_persistente: https://unstats.un.org/sdgs/metadata/files/Metadata-01-05-01.pdf
    formatos: Registros e tabelas.
    disponibilidade: [disponível em registros de desastre, sujeito a revisão]
    necessidade_processamento: Harmonizar componentes, estimar ocupantes quando autorizado, deduplicar e calcular taxa.
    analise_descritiva: Apresentar total e componentes, taxas, perigo, duração, grupos e incerteza de estimativas.
    referencias: ["[@un2024disasters]"]

  - <<: *disaster_common
    codigo: DES-SAU-01
    titulo_completo: Número de estabelecimentos de saúde danificados ou destruídos por desastres (componente ODS 11.5.3a)
    titulo_resumido: Estabelecimentos de saúde danificados
    referencia_metodologica: Componente de infraestrutura de saúde do indicador ODS 11.5.3a e meta D do Marco de Sendai.
    conceito: Contagem de estabelecimentos de saúde cuja estrutura, equipamentos ou ativos foram danificados ou destruídos em consequência atribuída a desastres.
    objetivo: Monitorar dano físico à infraestrutura crítica de saúde.
    interpretacao: Valor maior indica maior número de unidades atingidas. Danificado e destruído devem ser separados, e a contagem não mede duração da indisponibilidade.
    usos: [Planejar resposta e reconstrução., Monitorar resiliência da infraestrutura., Priorizar mitigação e continuidade.]
    limitacoes: [Critérios de dano podem variar., Um estabelecimento pode ser registrado em mais de um evento., Contagem não pondera porte ou serviços., Danos não estruturais podem interromper operação sem destruição.]
    metodo_calculo: Vincular evento e estabelecimento por identificador, verificar atribuição, classificar dano conforme protocolo e contar unidades únicas no período, separando danificadas e destruídas.
    formula_calculo: 'N_{ES,dano}=\sum_f I(f\ danificado\ ou\ destruído\ por\ desastre)'
    numerador: Não se aplica; contagem de estabelecimentos únicos.
    denominador: Não se aplica; pode-se apresentar proporção do cadastro como medida complementar.
    unidade_medida: Estabelecimentos.
    variaveis_categorias_analise: CNES; tipo; gestão; dano/destroçado; evento; perigo; município; capacidade.
    granularidade: Estabelecimento por evento.
    unidade_territorial: Estabelecimento, município, estado ou país.
    resolucao_espacial_original: Coordenada/endereço do estabelecimento.
    resolucao_temporal: Evento e consolidação anual.
    periodo_referencia: Evento ou período, com cadastro contemporâneo.
    limiar_referencia: Dano ou destruição segundo o protocolo ODS/Sendai adotado.
    fontes_dados:
      - id: s2id
        papel: registro de dano de infraestrutura atribuído ao desastre
      - id: datasus
        papel: cadastro de estabelecimentos para identificação e denominador complementar
    cobertura_geografica: Brasil, condicionada ao preenchimento e vinculação.
    periodo_disponivel: Conforme S2ID e CNES.
    periodicidade_atualizacao: Por evento e consolidação.
    forma_acesso: S2ID e dados de estabelecimentos.
    url_persistente: https://unstats.un.org/sdgs/metadata/files/Metadata-11-05-03.pdf
    formatos: Registros administrativos e tabela vinculada.
    disponibilidade: [requer vinculação e verificação]
    necessidade_processamento: Normalizar estabelecimentos, deduplicar, classificar dano e reconciliar com CNES.
    analise_descritiva: Mostrar danificados/destruídos, tipo, capacidade, serviços, território, custo e prazo de restauração.
    referencias: ["[@un2024infrastructure]", "[@who2024resilienceindicators]"]

  - <<: *disaster_common
    codigo: DES-SAU-02
    titulo_completo: Número de interrupções de serviços de saúde atribuídas a desastres (componente ODS 11.5.3b)
    titulo_resumido: Interrupções de serviços de saúde
    referencia_metodologica: Componente de interrupção de serviços de saúde do indicador ODS 11.5.3b e meta D do Marco de Sendai.
    conceito: Contagem de ocorrências em que serviço de saúde foi interrompido, reduzido ou teve qualidade comprometida por desastre, conforme protocolo de registro.
    objetivo: Monitorar continuidade assistencial e efeitos funcionais, inclusive quando não há dano estrutural.
    interpretacao: Valor maior indica mais ocorrências de disrupção. Deve ser acompanhado por duração, população, serviço e gravidade.
    usos: [Gestão de continuidade., Avaliação de resiliência., Priorização de redundância e recuperação.]
    limitacoes: [Uma unidade pode ter múltiplos serviços interrompidos., Definições de ocorrência variam., Contagem não expressa duração ou população., Quedas de qualidade são difíceis de documentar.]
    metodo_calculo: Definir unidade de ocorrência — estabelecimento-serviço-evento —, registrar início, término, nível de funcionamento e causa, verificar atribuição e contar ocorrências únicas.
    formula_calculo: 'N_{interrupções}=\sum_{f,s,e}I(serviço\ s\ de\ f\ interrompido\ pelo\ evento\ e)'
    numerador: Não se aplica; contagem de ocorrências únicas.
    denominador: Não se aplica; horas-serviço e proporção de estabelecimentos são complementares.
    unidade_medida: Ocorrências de interrupção.
    variaveis_categorias_analise: Estabelecimento; serviço; interrupção total/parcial; início; duração; barreira; evento; população.
    granularidade: Estabelecimento-serviço-evento.
    unidade_territorial: Estabelecimento e território.
    resolucao_espacial_original: Local do serviço.
    resolucao_temporal: Horas/dias por evento e consolidação anual.
    periodo_referencia: Evento e período de recuperação.
    limiar_referencia: Interrupção, redução ou perda de qualidade conforme definição ODS/Sendai adotada.
    fontes_dados:
      - id: s2id
        papel: evento e registro de interrupções básicas
      - id: datasus
        papel: cadastro e produção assistencial para verificação complementar
    cobertura_geografica: Brasil, condicionada a registro específico e integração setorial.
    periodo_disponivel: Conforme sistemas envolvidos.
    periodicidade_atualizacao: Durante resposta e até restauração.
    forma_acesso: Formulários de desastre, sistemas de situação e informação assistencial.
    url_persistente: https://unstats.un.org/sdgs/metadata/files/Metadata-11-05-03.pdf
    formatos: Registro de incidente, tabela e série assistencial.
    disponibilidade: [requer integração intersetorial]
    necessidade_processamento: Definir ocorrência, vincular serviços, deduplicar, calcular duração e verificar retorno.
    analise_descritiva: Mostrar número, duração, serviços essenciais, população sem acesso, causas operacionais, substituição e tempo de recuperação.
    referencias: ["[@un2024infrastructure]", "[@who2024resilienceindicators]"]
