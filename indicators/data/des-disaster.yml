common: &disaster_common
  tema: Eventos meteorológicos severos e desastres
  capitulo: chapters/part-2/12-eventos-severos-desastres.qmd
  capitulo_fichas: chapters/part-4/22-fichas-eventos-severos-desastres.qmd
  dimensoes: [efeito, resposta, exposição]
  responsabilidade_gerencial: Proteção e defesa civil consolida perdas e danos; saúde verifica óbitos, agravos e serviços; estatística fornece denominadores.
  qualidade_incerteza: Relatar definição, desastre, local, período, fonte, verificação, revisões, duplicidades, sub-registro e denominador.
  comparabilidade: Manter taxonomia, componente, regra de atribuição, período, população e versão do registro; totais preliminares e consolidados devem ser distinguidos.
  relacao_saude: Mortes, pessoas afetadas e interrupção de serviços expressam efeitos diretos e condições que ampliam riscos sanitários durante e após desastres.
  defasagens_temporais: Registrar data do evento e do efeito; mortes, doenças e interrupções podem ocorrer durante ou depois e exigir janela de atribuição.
  aplicacao_gestao: Quantificar impactos, organizar resposta, direcionar recursos, monitorar redução de risco e avaliar recuperação.
  notas: As fichas seguem indicadores Sendai/ODS. Contagens nacionais devem observar os procedimentos oficiais de validação e evitar dupla contagem.

indicators:
  - <<: *disaster_common
    codigo: DES-HUM-01
    titulo_completo: "Mortes e desaparecimentos registrados em desastres por 100 mil habitantes"
    titulo_resumido: "Mortes e desaparecidos registrados — Atlas"
    referencia_metodologica: "Conceito de mortalidade/desaparecimento do Marco de Sendai e ODS 1.5.1/11.5.1/13.1.1; implementação com registros agregados do Atlas, explicitamente distinta de contagem individual deduplicada."
    conceito: "Soma municipal anual dos campos de mortos e desaparecidos registrados no Atlas, dividida pela população de referência e multiplicada por 100 mil."
    objetivo: Monitorar a mortalidade e desaparecimento associados a desastres em escala comparável.
    interpretacao: "Expressa a magnitude dos registros em relação à população de referência. Não garante ausência de duplicidade individual, não mede risco causal e não deve ser apresentada como série oficial Sendai validada."
    usos: [Monitorar ODS e Marco de Sendai., Comparar períodos e territórios., Avaliar políticas de redução de risco.]
    limitacoes: [Atribuição e janela temporal variam., Desaparecido não é óbito confirmado., Eventos raros produzem taxas instáveis em populações pequenas., Sub-registro e revisão pós-evento alteram totais.]
    metodo_calculo: "Após os controles de chaves e completude, somar DH_MORTOS e DH_DESAPARECIDOS por município e ano de Data_Evento. Dividir pela população municipal oficial correspondente e multiplicar por 100.000. Usar Censos em 1991, 2000, 2010 e 2022; nos demais anos, a população publicada pelo IBGE para o respectivo ano no arquivo de estimativas/TCU. Para 2023, usar a relação publicada em 2023 baseada no Censo 2022 com atualização territorial e registrar ano_populacao=2022, sem chamá-la de estimativa demográfica de 2023. Se faltar denominador compatível, publicar a contagem e deixar a taxa ausente. Não somar registros de município com código/território incompatível com o denominador. Morto e desaparecido são estados finais mutuamente exclusivos na interpretação desejada, mas os campos agregados não permitem auditar individualmente essa exclusividade: publicar a limitação."
    formula_calculo: 'T_{MM}=100000\times\frac{N_{mortos}+N_{desaparecidos}}{Pop_{referência}}'
    numerador: "Soma de DH_MORTOS+DH_DESAPARECIDOS em registros elegíveis completos, no município e ano."
    denominador: "População municipal oficial na referência explicitada; população zero ou ausente invalida a taxa."
    unidade_medida: Pessoas por 100 mil habitantes.
    variaveis_categorias_analise: "Protocolo_S2iD, Cod_IBGE_Mun, Data_Evento, COBRADE, DH_MORTOS, DH_DESAPARECIDOS, população, ano demográfico e edição."
    granularidade: "Protocolo_S2iD–Cod_IBGE_Mun–Data_Evento; síntese municipal por ano do evento."
    unidade_territorial: "Município identificado por Cod_IBGE_Mun no Atlas; conservar sua territorialização e verificar compatibilidade com qualquer denominador."
    resolucao_espacial_original: "Registro administrativo municipal; não contém identificação individual ou de cada estabelecimento."
    resolucao_temporal: "Evento datado; saída anual pelo ano de Data_Evento, não Data_Registro."
    periodo_referencia: "Ano civil do evento; versão consolidada v1.1 de 06/08/2026."
    limiar_referencia: "Taxa por 100 mil habitantes; não fixa limiar universal de alerta."
    fontes_dados: [{"id": "atlas-2026-v11", "papel": "DH_MORTOS, DH_DESAPARECIDOS, Data_Evento e Cod_IBGE_Mun"}, {"id": "ibge-pop-municipal", "papel": "Censos e população municipal publicada por ano; a relação 2023 tem referência demográfica no Censo 2022"}]
    cobertura_geografica: "Municípios com registros administrativos no Atlas; diferenças de notificação e cobertura não significam diferenças equivalentes no risco."
    periodo_disponivel: "1991–2025 na edição fixada do Atlas; a disponibilidade da taxa também depende do denominador compatível."
    periodicidade_atualizacao: "Por edição consolidada; congelar versão e data da extração."
    forma_acesso: "Atlas: download do CSV consolidado v1.1 de 06/08/2026. População: API SIDRA tabela 202, variável 93, anos 1991/2000/2010, categorias Total; tabela 4714, variável 93, ano 2022; tabela 6579, variável 9324, demais períodos nela disponíveis. Endpoint-base https://apisidra.ibge.gov.br/values/t/TABELA/n6/CODIGO/v/VARIAVEL/p/ANO; dividir consultas municipais para respeitar o limite da API. Demais anos usam arquivos oficiais de estimativas/TCU; 2023 usa a relação baseada no Censo 2022."
    url_persistente: "https://atlasdigital.mdr.gov.br/arquivos/2026/BD_Atlas_1991_2025_v1.1_2026.08.06_Consolidado.csv"
    formatos: "CSV consolidado; saída CSV/Parquet municipal com flags e versão."
    disponibilidade: ["Calculável com dados abertos"]
    necessidade_processamento: "Preservar protocolo e município como chave composta; remover duplicatas exatas. Em versões diferentes, usar exclusivamente o arquivo consolidado fixado, sem somar versões. Conflitos não resolvidos dentro da mesma chave são sinalizados e excluídos da soma, com total incompleto. Não fundir eventos só porque data, município ou COBRADE coincidem."
    analise_descritiva: Mostrar contagens e taxas, perigo, território, perfil das vítimas, incerteza e evolução de registros.
    referencias: ["[@un2024disasters]", "[@atlas2026manual]", "[@ibge2023relacao]"]
    qualidade_incerteza: "Campos vazios, inválidos ou negativos são ausentes. Município-ano sem registro recebe sem_registro e valor ausente; zero só é publicado quando há registros elegíveis completos com zero informado. Se algum registro elegível tem componente ausente, a soma anual é incompleta e não deve ser divulgada como total conhecido. O Atlas é sujeito a sub-registro, revisões e mudanças administrativas."
    comparabilidade: "Manter versão, data do evento, COBRADE e territorialização. Para tendências através de alterações municipais, usar áreas mínimas comparáveis com correspondência oficial, sem transferir contagens automaticamente para a malha 2022."
    notas: "Total principal inclui todos os desastres do Atlas, com desagregação por COBRADE; não atribuir todos à mudança climática. O resultado é um registro administrativo, não uma contagem individual auditada."
    protocolo_versao: "2026-10-03"
    situacao_calculo: "abertos"
    dependencia_dados_locais: "Dispensável para extrair o Atlas; registros originados na defesa civil local"
    automacao: "Condicionada"
    condicoes_automacao: "CSV Atlas e denominador oficial territorialmente compatível. SIDRA fornece consultas programáticas; edições históricas fora da API exigem extrair e conferir as tabelas publicadas pelo IBGE."
    evidencia_verificacao: "Acesso e cálculo testados"
    detalhe_verificacao: "Campos do Atlas e cálculo amostral no registro de Teresópolis de 12/01/2011 testados. Consultas SIDRA de São Paulo para Censos 1991, 2000, 2010 e 2022 e população de referência 2011 foram acessadas. A base nacional e a extração dos PDFs históricos não foram produzidas."

  - <<: *disaster_common
    codigo: DES-HUM-02
    titulo_completo: Número de pessoas diretamente afetadas por desastres por 100 mil habitantes (ODS 1.5.1/11.5.1/13.1.1)
    titulo_resumido: Pessoas diretamente afetadas por desastres
    referencia_metodologica: "Marco de Sendai, indicador composto B-1=B-2+B-3+B-4+B-5; taxa por 100 mil habitantes."
    conceito: "Soma dos componentes de pessoas diretamente afetadas do Sendai, por município e ano, relativa à população de referência."
    objetivo: Medir a extensão populacional direta dos impactos além de mortes e desaparecimentos.
    interpretacao: "Magnitude agregada dos quatro componentes de impacto direto em relação à população. Pode haver sobreposição entre componentes; não interpretar como probabilidade individual."
    usos: [Dimensionar resposta e assistência., Monitorar ODS/Sendai., Avaliar desigualdades e recuperação.]
    limitacoes: [Categorias podem se sobrepor., “Afetado” deve seguir definição de diretamente afetado., Danos a moradia podem ser convertidos em pessoas por coeficientes., Registros administrativos dependem da capacidade local.]
    metodo_calculo: "Apurar localmente, por evento, B2=pessoas feridas ou enfermas diretamente em razão do desastre; B3=residentes das moradias danificadas; B4=residentes das moradias destruídas; B5=pessoas cujos meios de vida foram diretamente interrompidos ou destruídos. Campos mínimos: evento_id, data, município, pessoa pseudonimizada, domicílio, lesão/enfermidade atribuída, classe de dano da moradia, residentes e impacto no meio de vida. Deduplicar dentro de cada componente; para moradias, dano e destruição são categorias mutuamente exclusivas na situação final. Somar B2+B3+B4+B5 conforme Sendai e dividir pela população oficial de referência, segundo o protocolo DES-HUM-01. A soma composta pode contar a mesma pessoa em componentes diferentes; informar as quatro parcelas e não chamá-la de pessoas únicas. Se qualquer componente não puder ser apurado, o total é ausente. Não usar DH_total_danos_humanos_diretos do Atlas: esse campo inclui mortos e desaparecidos e não reproduz a definição B-1."
    formula_calculo: "T_{B1,m,y}=100\\,000\\frac{B2_{m,y}+B3_{m,y}+B4_{m,y}+B5_{m,y}}{Pop_{m,y}}"
    numerador: "Soma dos quatro componentes Sendai B2–B5; contagem composta, não necessariamente pessoas únicas."
    denominador: "População oficial de referência, com ano e territorialização compatíveis."
    unidade_medida: Pessoas por 100 mil habitantes.
    variaveis_categorias_analise: "Evento, município, data, pessoa/domicílio, residentes, lesão/enfermidade, dano de moradia e interrupção de meios de vida."
    granularidade: Componente por evento e território.
    unidade_territorial: "Município da ocorrência; conservar limite territorial e ano do registro."
    resolucao_espacial_original: "Pessoa/domicílio ou estabelecimento/serviço vinculado ao evento."
    resolucao_temporal: "Ocorrência datada; resumo anual após consolidação e revisão."
    periodo_referencia: "Ano do evento ou início da interrupção, conforme método; registrar data de corte das revisões."
    limiar_referencia: "Impacto direto documentado em um dos quatro componentes; não inclui morte/desaparecimento no numerador B-1."
    fontes_dados: [{"id": "registros-locais-desastres", "papel": "Registro local datado de impactos e sua atribuição ao evento; o esquema mínimo consta do método"}, {"id": "ibge-pop-municipal", "papel": "Denominador populacional quando requerido"}]
    cobertura_geografica: "Municípios com registros locais suficientes e rotina explícita de apuração."
    periodo_disponivel: "Desde a implantação de registro local com os campos exigidos; série municipal nacional completa não demonstrada."
    periodicidade_atualizacao: "Após cada evento, com consolidação anual e revisão dos desfechos."
    forma_acesso: "Exportação CSV/Parquet do sistema local no esquema desta ficha; a existência de S2iD, CNES ou SIA/SUS não garante os campos necessários."
    url_persistente: "https://unstats.un.org/sdgs/metadata/files/Metadata-01-05-01.pdf"
    formatos: "Tabelas locais de eventos e impactos vinculáveis; publicação municipal agregada, sem identificação pessoal."
    disponibilidade: ["Depende de dados locais"]
    necessidade_processamento: "Vincular ao desastre, classificar impacto, validar datas e identificadores, resolver revisões/duplicidades e somar apenas casos elegíveis."
    analise_descritiva: Apresentar total e componentes, taxas, perigo, duração, grupos e incerteza de estimativas.
    referencias: ["[@un2024disasters]"]
    qualidade_incerteza: "Sem apuração, resultado ausente, nunca zero automático. Zero requer cobertura documentada e confirmação de ausência de ocorrências no período. Preservar desconhecido, não aplicável e incompleto."
    comparabilidade: "Mesma definição de evento, componente, estabelecimento, serviço e cobertura de registro; mudanças no cadastro local precisam de quebra de série."
    notas: "Manter a ficha e sua dependência local. Não inferir os componentes ausentes a partir de totais administrativos de significado diferente."
    protocolo_versao: "2026-10-03"
    situacao_calculo: "locais"
    dependencia_dados_locais: "Necessária"
    automacao: "Não demonstrada"
    condicoes_automacao: "Disponibilização de registro local com os componentes e identificadores especificados; não foi demonstrada uma base aberta nacional com esse conteúdo."
    evidencia_verificacao: "Documentação verificada"
    detalhe_verificacao: "Produto e método documentados; série municipal completa ainda não produzida."


  - <<: *disaster_common
    codigo: DES-SAU-01
    titulo_completo: "Registros de instalações públicas de saúde danificadas ou destruídas por desastres"
    titulo_resumido: "Danos registrados em instalações públicas de saúde"
    referencia_metodologica: "Campos de danos materiais do Atlas Digital, relacionados ao tema Sendai D-2/ODS 11.5.3a, com escopo restrito a registros de instalações públicas e sem identificação individual."
    conceito: "Soma anual dos números registrados de instalações públicas de saúde danificadas e destruídas em eventos do Atlas."
    objetivo: Monitorar dano físico à infraestrutura crítica de saúde.
    interpretacao: "Maior valor indica mais ocorrências registradas de dano em instalações públicas. Não representa necessariamente mais estabelecimentos únicos nem todas as unidades públicas e privadas."
    usos: [Planejar resposta e reconstrução., Monitorar resiliência da infraestrutura., Priorizar mitigação e continuidade.]
    limitacoes: [Critérios de dano podem variar., Um estabelecimento pode ser registrado em mais de um evento., Contagem não pondera porte ou serviços., Danos não estruturais podem interromper operação sem destruição.]
    metodo_calculo: "Após controle de protocolos e valores ausentes, somar os campos exatos DM_Inst Saúde Danificadas e DM_Inst Saúde Destruidas por município e ano de Data_Evento. Preservar as duas parcelas e sua soma. Não adicionar DM_Inst Saúde Valor, que é monetário. Uma mesma instalação pode aparecer em mais de um desastre: a soma mede registros de dano por evento, não estabelecimentos únicos. Sem os dois componentes completos, não publicar total completo; apresentar a lacuna."
    formula_calculo: "D_{m,y}=\\sum_{e\\in(m,y)}\\left(DM_{saude,danificadas,e}+DM_{saude,destruidas,e}\\right)"
    numerador: "Soma das duas contagens de danos por evento."
    denominador: "Não se aplica."
    unidade_medida: "Registros de instalações públicas afetadas por evento, acumulados no ano."
    variaveis_categorias_analise: "Protocolo, município, data do evento, COBRADE, DM_Inst Saúde Danificadas e DM_Inst Saúde Destruidas."
    granularidade: "Protocolo_S2iD–Cod_IBGE_Mun–Data_Evento; síntese municipal por ano do evento."
    unidade_territorial: "Município identificado por Cod_IBGE_Mun no Atlas; conservar sua territorialização e verificar compatibilidade com qualquer denominador."
    resolucao_espacial_original: "Registro administrativo municipal; não contém identificação individual ou de cada estabelecimento."
    resolucao_temporal: "Evento datado; saída anual pelo ano de Data_Evento, não Data_Registro."
    periodo_referencia: "Ano civil do evento; versão consolidada v1.1 de 06/08/2026."
    limiar_referencia: "Dano ou destruição registrado; não exige interrupção comprovada do serviço."
    fontes_dados: [{"id": "atlas-2026-v11", "papel": "CSV consolidado Atlas Digital 1991–2025, v1.1 de 06/08/2026"}]
    cobertura_geografica: "Municípios com registros administrativos no Atlas; diferenças de notificação e cobertura não significam diferenças equivalentes no risco."
    periodo_disponivel: "1991–2025 na edição fixada do Atlas; a disponibilidade da taxa também depende do denominador compatível."
    periodicidade_atualizacao: "Por edição consolidada; congelar versão e data da extração."
    forma_acesso: "Download HTTP: https://atlasdigital.mdr.gov.br/arquivos/2026/BD_Atlas_1991_2025_v1.1_2026.08.06_Consolidado.csv. Ler Latin-1, separador ponto e vírgula, datas dia/mês/ano e código municipal como texto de sete dígitos."
    url_persistente: "https://atlasdigital.mdr.gov.br/arquivos/2026/BD_Atlas_1991_2025_v1.1_2026.08.06_Consolidado.csv"
    formatos: "CSV consolidado; saída CSV/Parquet municipal com flags e versão."
    disponibilidade: ["Calculável com dados abertos"]
    necessidade_processamento: "Preservar protocolo e município como chave composta; remover duplicatas exatas. Em versões diferentes, usar exclusivamente o arquivo consolidado fixado, sem somar versões. Conflitos não resolvidos dentro da mesma chave são sinalizados e excluídos da soma, com total incompleto. Não fundir eventos só porque data, município ou COBRADE coincidem."
    analise_descritiva: Mostrar danificados/destruídos, tipo, capacidade, serviços, território, custo e prazo de restauração.
    referencias: ["[@un2024infrastructure]", "[@atlas2026manual]"]
    qualidade_incerteza: "Campos vazios, inválidos ou negativos são ausentes. Município-ano sem registro recebe sem_registro e valor ausente; zero só é publicado quando há registros elegíveis completos com zero informado. Se algum registro elegível tem componente ausente, a soma anual é incompleta e não deve ser divulgada como total conhecido. O Atlas é sujeito a sub-registro, revisões e mudanças administrativas."
    comparabilidade: "Manter versão, data do evento, COBRADE e territorialização. Para tendências através de alterações municipais, usar áreas mínimas comparáveis com correspondência oficial, sem transferir contagens automaticamente para a malha 2022."
    notas: "A alteração de título e unidade restringe explicitamente o significado ao que os campos permitem calcular. Para o componente Sendai completo, com estabelecimentos únicos e inclusão de privados, são necessários identificação CNES e registros locais adicionais."
    protocolo_versao: "2026-10-03"
    situacao_calculo: "abertos"
    dependencia_dados_locais: "Dispensável para extrair o Atlas; registros originados na defesa civil local"
    automacao: "Viável"
    condicoes_automacao: "Download do CSV consolidado fixado, controle de chaves, campos ausentes e compatibilidade territorial."
    evidencia_verificacao: "Acesso e cálculo testados"
    detalhe_verificacao: "Cabeçalho e amostra do CSV acessados. Registro de Teresópolis, evento de 12/01/2011, inspecionado para mortos, desaparecidos e danos em instalações de saúde. A amostra não valida a cobertura da base nacional inteira."


  - <<: *disaster_common
    codigo: DES-SAU-02
    titulo_completo: Número de interrupções de serviços de saúde atribuídas a desastres (componente ODS 11.5.3b)
    titulo_resumido: Interrupções de serviços de saúde
    referencia_metodologica: "Sendai D-7/ODS 11.5.3b; operacionalização local por estabelecimento–serviço–evento e intervalo de interrupção."
    conceito: "Número de episódios documentados de interrupção de serviço de saúde atribuídos a desastres, com unidade de contagem explícita."
    objetivo: Monitorar continuidade assistencial e efeitos funcionais, inclusive quando não há dano estrutural.
    interpretacao: Valor maior indica mais ocorrências de disrupção. Deve ser acompanhado por duração, população, serviço e gravidade.
    usos: [Gestão de continuidade., Avaliação de resiliência., Priorização de redundância e recuperação.]
    limitacoes: [Uma unidade pode ter múltiplos serviços interrompidos., Definições de ocorrência variam., Contagem não expressa duração ou população., Quedas de qualidade são difíceis de documentar.]
    metodo_calculo: "Registrar evento_id, COBRADE, município, estabelecimento_id (CNES quando existir), serviço_id no catálogo CNES de serviços/classificações da versão adotada, início, fim, fuso, tipo total/parcial e evidência de atribuição ao desastre. Incluir apenas intervalos em que um serviço programado ficou indisponível, integralmente ou para parte da capacidade/território; a condição parcial precisa ser documentada, não inferida de queda de produção. Para cada estabelecimento–serviço–evento, unir intervalos sobrepostos ou contíguos; cada intervalo unido é um episódio. Se um episódio unido incluir interrupção total em qualquer trecho, classificá-lo como total e sinalizar mistura com trechos parciais; classificar como parcial somente quando todos os trechos forem parciais. Contar episódios pelo ano de início, mantendo os que atravessam anos uma única vez e publicando duração como medida separada. Episódio ainda em curso entra na contagem com fim ausente e flag aberto; duração permanece censurada. Publicar totais e parciais separadamente e sua soma; falta de início, identificador ou comprovação gera registro indeterminado, não zero."
    formula_calculo: "N_{m,y}=\\sum_{f,s,e}n_{f,s,e,m,y}"
    numerador: "Soma de n, o número de episódios unidos de cada estabelecimento f, serviço s e evento e, no município m, com início no ano y."
    denominador: "Não se aplica."
    unidade_medida: "Episódios de interrupção por ano, separados em total e parcial."
    variaveis_categorias_analise: "Evento_id, COBRADE, município, estabelecimento/CNES, serviço/classificação, início, fim, fuso, tipo e evidência causal."
    granularidade: "Intervalo de interrupção por estabelecimento–serviço–evento; município como agregação de episódios."
    unidade_territorial: "Município da ocorrência; conservar limite territorial e ano do registro."
    resolucao_espacial_original: "Pessoa/domicílio ou estabelecimento/serviço vinculado ao evento."
    resolucao_temporal: "Ocorrência datada; resumo anual após consolidação e revisão."
    periodo_referencia: "Ano do evento ou início da interrupção, conforme método; registrar data de corte das revisões."
    limiar_referencia: "Indisponibilidade documentada de serviço programado, com início conhecido e vínculo ao evento; sem limiar mínimo arbitrário de horas."
    fontes_dados: [{"id": "registros-locais-desastres", "papel": "Registro local datado de impactos e sua atribuição ao evento; o esquema mínimo consta do método"}, {"id": "ibge-pop-municipal", "papel": "Denominador populacional quando requerido"}]
    cobertura_geografica: "Municípios com registros locais suficientes e rotina explícita de apuração."
