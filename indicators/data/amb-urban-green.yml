  - <<: *urban_common
    codigo: AMB-URB-03
    titulo_completo: "Intensidade anual da ilha de calor de superfície — YCEO v4, diurna e noturna"
    titulo_resumido: "SUHII anual — YCEO v4"
    referencia_metodologica: "Produto YCEO Surface Urban Heat Islands, Yearly Pixel v4; contraste urbano–referência calculado pelo método publicado do produtor. Síntese municipal por área é uma adaptação deste livro."
    conceito: "Média municipal, nos pixels urbanos cobertos pelo produto, da intensidade anual de ilha de calor de superfície calculada pelo YCEO, com séries diurna e noturna separadas."
    objetivo: Quantificar o contraste térmico de superfície associado à urbanização e mapear heterogeneidade territorial.
    interpretacao: Valor positivo indica superfície urbana mais quente que a referência naquele sensor, data e horário. Não equivale à ilha de calor do ar nem à exposição térmica humana.
    usos: [Avaliar materiais e cobertura urbana., Priorizar mitigação e arborização., Contextualizar risco de calor com população e dados do ar.]
    limitacoes: [Referência rural determina o resultado., Temperatura da superfície difere da temperatura do ar., Nuvens e horário limitam amostragem., Emissividade e resolução introduzem erro., Uma cena não representa noite ou estação.]
    metodo_calculo: "Acessar YALE/YCEO/UHI/UHI_yearly_pixel/v4 e selecionar as imagens anuais 2003–2018 pelas datas do catálogo, bandas Daytime e Nighttime. As bandas já contêm SUHII em °C; não subtrair uma nova referência rural nem aplicar escala de reflectância Landsat. Construir a máscara de elegibilidade como a união dos pixels válidos da coleção no período, por banda, e conservá-la fixa. Para cada ano e banda, calcular a média dos pixels válidos ponderada pela área de interseção com o município IBGE 2022. Exigir ≥90% da área elegível municipal válida nesse ano e informar a cobertura; sem pixel elegível, não aplicável. Não misturar dia e noite numa única média. Este filtro de cobertura e a agregação municipal são escolhas operacionais do livro."
    formula_calculo: "SUHII_{m,y,k}=\\frac{\\sum_g a_{gm}SUHII^{YCEO}_{g,y,k}}{\\sum_g a_{gm}},\\qquad k\\in\\{dia,noite\\}"
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: "°C de diferença."
