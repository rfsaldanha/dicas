  codigo: RES-WAT-01
  titulo_completo: Percentual de estabelecimentos de saúde que tiveram interrupção do abastecimento de água
    na semana anterior
  titulo_resumido: Interrupção de água em estabelecimentos
  referencia_metodologica: 'OMS, Health system resilience indicators: an integrated package, edição 2024, indicador
    28. Critérios e instrumento local explicitados neste capítulo.'
  conceito: Percentual de estabelecimentos que tiveram interrupção de água corrente ou de outra fonte de água
    segura na semana anterior.
  objetivo: Monitorar falhas recentes de um serviço essencial à assistência segura e identificar estabelecimentos
    para intervenção.
  interpretacao: Quanto maior o percentual, maior a frequência de interrupção recente entre estabelecimentos
    com resposta válida.
  usos:
  - Detectar interrupções recentes de abastecimento.
  - Priorizar reservação e fontes alternativas.
  - Monitorar continuidade assistencial.
  - Comparar tipos de estabelecimento.
  limitacoes:
