    de origem.
  granularidade: País e ano.
  unidade_territorial: Brasil. Não atribuir a municípios ou estabelecimentos.
  resolucao_espacial_original: Nacional.
  resolucao_temporal: Anual.
  periodo_referencia: Ano do relatório brasileiro, com segunda edição SPAR confirmada.
  limiar_referencia: Categorias cumulativas C5.1 da segunda edição; não calcular médias ou diferenças percentuais
