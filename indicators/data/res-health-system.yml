indicators:
- tema: Capacidade de resposta, adaptação e resiliência
  capitulo: chapters/part-3/15-resposta-adaptacao-resiliencia.qmd
  capitulo_fichas: chapters/part-4/24-fichas-resposta-adaptacao-resiliencia.qmd
  dimensoes:
  - resposta
  responsabilidade_gerencial: Gestão do SUS e direção do estabelecimento, com participação da vigilância, atenção,
    engenharia clínica, infraestrutura, saúde do trabalhador e proteção e defesa civil conforme o indicador.
  disponibilidade:
  - Depende de dados locais
  qualidade_incerteza: Por indicador/componente, publicar N conforme/afetado, A com resposta válida completa,
    U elegível e NR=U−A. Cobertura=100 A/U. Percentual=100 N/A; A=0 implica ausente. Não resposta, documento
    não disponibilizado e pergunta ignorada não equivalem a ausência de problema.
  comparabilidade: Comparar apenas rodadas com critérios, território e universo compatíveis; documentar mudanças
    do CNES e não resposta. Não ponderar ou extrapolar amostras de conveniência.
  relacao_saude: Mede capacidade ou interrupção do sistema, não o efeito final na saúde; a relação com desfechos
    depende do perigo, da continuidade dos serviços e das populações atendidas.
  defasagens_temporais: Estrutura e planos podem anteceder eventos; interrupções devem ser registradas próximo
    da ocorrência; resultados em saúde e recuperação podem aparecer depois.
  aplicacao_gestao: Identificar lacunas, priorizar investimento, pactuar responsáveis e prazos, acompanhar
    preparação e verificar continuidade antes, durante e depois de emergências.
  notas: 'Definição metodológica: OMS, pacote de 2024; dados: avaliação local ainda não realizada. O instrumento
    deste livro é uma operacionalização autoral documentada, não um formulário oficial da OMS.'
  cobertura_geografica: Estabelecimentos CNES do universo municipal ou da rede declarada na rodada; não extrapolar
    para os não avaliados.
  periodo_disponivel: Somente após coleta local. Nenhuma avaliação real acompanha esta revisão.
  periodicidade_atualizacao: Por rodada de avaliação; publicar a data de cada estabelecimento e os limites
    da rodada.
  forma_acesso: Modelos vazios de universo e avaliação, dicionário de perguntas e regras na seção Instrumento
    de coleta local deste capítulo.
  url_persistente: https://cnes.datasus.gov.br/
  formatos: CSV UTF-8; documentos e registros de inspeção identificados por referência e SHA-256.
  necessidade_processamento: Validar chaves CNES/rodada, datas, respostas e evidências; aplicar os critérios
    abaixo e publicar numerador, denominador e não resposta.
  codigo: RES-GOV-01
  titulo_completo: Percentual de estabelecimentos com equipe ou pessoa focal designada para gestão de emergências
    e continuidade dos serviços
  titulo_resumido: Ponto focal de emergência e continuidade
  referencia_metodologica: 'OMS, Health system resilience indicators: an integrated package, edição 2024, indicador
    11. Critérios e instrumento local explicitados neste capítulo.'
  conceito: Percentual de estabelecimentos com equipe ou pessoa focal formalmente designada, cujos termos de
    referência incluem liderar e coordenar a gestão de emergências e a continuidade dos serviços essenciais.
  objetivo: Medir se existe responsabilidade institucional explícita para coordenar preparação, resposta e
    continuidade assistencial.
  interpretacao: Quanto maior o percentual, maior a conformidade documental entre os estabelecimentos com avaliação
    completa. Não demonstra eficácia durante uma emergência.
  usos:
  - Mapear responsabilidade institucional.
  - Identificar redes sem coordenação local.
  - Planejar capacitação e substituição.
  - Acompanhar preparação por tipo de estabelecimento.
  limitacoes:
  - Designação formal pode existir sem autoridade ou recursos.
  - Termos de referência podem estar desatualizados.
  - Auto relato requer comprovação.
  - Percentual depende do universo avaliado.
  fontes_dados:
  - id: cnes
    papel: 'Dados cadastrais: identificação e composição do universo da rodada.'
  - id: avaliacao-local-resiliencia
    papel: 'Dados a coletar: respostas, inspeção e evidências no instrumento local desta edição.'
  metodo_calculo: Aplicar o instrumento local e as regras de universo, evidência e não resposta deste capítulo.
    Conforme se todos os campos gov_designacao, gov_emergencia, gov_continuidade forem sim, com evidência verificável.
    Percentual=100 N/A. Perguntas ignoradas retiram o registro de A; informar NR. Ausência documental efetivamente
    verificada é não conformidade; documento solicitado mas não disponibilizado é ignorado.
  formula_calculo: P=100\times N/A,\qquad NR=U-A
  numerador: Estabelecimentos com equipe ou pessoa focal designada conforme a definição.
  denominador: 'A: estabelecimentos elegíveis do universo U com todos os itens exigidos válidos e evidência
    para este indicador.'
  unidade_medida: Percentual de estabelecimentos (%).
  variaveis_categorias_analise: 'Identificação, rodada, data, evidência e respostas: gov_designacao, gov_emergencia,
    gov_continuidade.'
  granularidade: Estabelecimento e rodada; agregação pelo universo declarado.
  unidade_territorial: Município do estabelecimento e rede definida no universo da rodada.
  resolucao_espacial_original: Estabelecimento identificado por CNES.
  resolucao_temporal: Data da avaliação, com janela retrospectiva somente para interrupções.
  periodo_referencia: Vigência documental na data da avaliação.
  limiar_referencia: Todos os itens especificados devem ser satisfeitos.
  analise_descritiva: Publicar N, A, U, NR, cobertura, percentual, datas e distribuição por município/tipo
    de estabelecimento; RES-WAS-01 exige cinco componentes e conformidade conjunta.
  referencias:
  - '[@who2024resilienceindicators]'
  - '[@who2023framework]'
  protocolo_versao: '2026-10-06'
  situacao_calculo: locais
  dependencia_dados_locais: 'Obrigatória: inspeção e verificação documental com o instrumento vazio e o dicionário
    publicados neste capítulo. O CNES identifica o universo; não contém estas respostas.'
  automacao: Condicionada
  condicoes_automacao: Agregação automatizável após coleta e validação humanas; não inferir respostas pelo
    CNES ou pela ausência de documento recebido.
  evidencia_verificacao: Documentação verificada
  detalhe_verificacao: Definição documental conferida no pacote OMS 2024; modelo e regras verificados, sem
    aplicação em estabelecimentos nem cálculo empírico.
