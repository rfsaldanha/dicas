  codigo: RES-RIS-01
  titulo_completo: Percentual de estabelecimentos com perfil de riscos para choques e estressores documentado
    e atualizado
  titulo_resumido: Perfil de riscos do estabelecimento
  referencia_metodologica: 'OMS, Health system resilience indicators: an integrated package, edição 2024, indicador
    20. Critérios e instrumento local explicitados neste capítulo.'
  conceito: Percentual de estabelecimentos com perfil de riscos atualizado, informado por avaliação de perigos
    e das condições estruturais, não estruturais, funcionais e de preparação.
  objetivo: Verificar se os estabelecimentos conhecem e priorizam os riscos capazes de interromper, reduzir
    ou tornar inseguros os serviços.
  interpretacao: Quanto maior o percentual, maior a conformidade documental entre os estabelecimentos com avaliação
    completa. Não demonstra eficácia durante uma emergência.
  usos:
  - Priorizar obras e redundâncias.
  - Atualizar planos de continuidade.
  - Integrar mapas de perigo e ativos críticos.
  - Direcionar inspeções.
  limitacoes:
  - Documento pode omitir perigos emergentes.
  - Atualização nominal não garante nova avaliação.
  - Conformidade documental não demonstra mitigação efetiva.
  - Autoavaliação pode favorecer respostas positivas.
  fontes_dados:
  - id: cnes
    papel: 'Dados cadastrais: identificação e composição do universo da rodada.'
  - id: avaliacao-local-resiliencia
    papel: 'Dados a coletar: respostas, inspeção e evidências no instrumento local desta edição.'
  metodo_calculo: Aplicar o instrumento local e as regras de universo, evidência e não resposta deste capítulo.
    Conforme se todos os campos ris_documento, ris_estrutural, ris_nao_estrutural, ris_funcional, ris_preparacao,
    ris_ameacas, ris_probabilidade, ris_impactos, ris_mitigacao forem sim, com evidência verificável. Exigir
    ris_data_revisao entre D menos cinco anos civis e D, inclusive; em 29 de fevereiro, usar 28 de fevereiro
    se o ano-limite não for bissexto. Data futura é inválida. O prazo de cinco anos é escolha operacional deste
    livro baseada no exemplo da OMS, não exigência universal da OMS. Percentual=100 N/A. Perguntas ignoradas
    retiram o registro de A; informar NR. Ausência documental efetivamente verificada é não conformidade; documento
    solicitado mas não disponibilizado é ignorado.
  formula_calculo: P=100\times N/A,\qquad NR=U-A
  numerador: Estabelecimentos com perfil de riscos atualizado e conforme.
  denominador: 'A: estabelecimentos elegíveis do universo U com todos os itens exigidos válidos e evidência
    para este indicador.'
  unidade_medida: Percentual de estabelecimentos (%).
  variaveis_categorias_analise: 'Identificação, rodada, data, evidência e respostas: ris_documento, ris_estrutural,
    ris_nao_estrutural, ris_funcional, ris_preparacao, ris_ameacas, ris_probabilidade, ris_impactos, ris_mitigacao.
    Inclui ris_data_revisao.'
  granularidade: Estabelecimento e rodada; agregação pelo universo declarado.
  unidade_territorial: Município do estabelecimento e rede definida no universo da rodada.
  resolucao_espacial_original: Estabelecimento identificado por CNES.
  resolucao_temporal: Data da avaliação, com janela retrospectiva somente para interrupções.
  periodo_referencia: Data da avaliação e revisão do perfil nos cinco anos civis anteriores, inclusive.
  limiar_referencia: Todos os itens especificados devem ser satisfeitos; revisão nos últimos cinco anos civis.
  analise_descritiva: Publicar N, A, U, NR, cobertura, percentual, datas e distribuição por município/tipo
    de estabelecimento; RES-WAS-01 exige cinco componentes e conformidade conjunta.
  referencias:
  - '[@who2024resilienceindicators]'
  - '[@who2023framework]'
  protocolo_versao: '2026-10-06'
  situacao_calculo: locais
  dependencia_dados_locais: 'Obrigatória: inspeção e verificação documental com o instrumento vazio e o dicionário
    publicados neste capítulo. O CNES identifica o universo; não contém estas respostas.'
  automacao: Condicionada
  condicoes_automacao: Agregação automatizável após coleta e validação humanas; não inferir respostas pelo
