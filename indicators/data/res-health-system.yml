    papel: 'Dados a coletar: respostas, inspeção e evidências no instrumento local desta edição.'
  metodo_calculo: 'Aplicar os itens was_agua, was_saneamento, was_higiene, was_residuos e was_limpeza do dicionário.
    Água: fonte melhorada, no terreno e disponível. Saneamento: sanitários melhorados e utilizáveis, com unidade
    para equipe, separação por sexo e higiene menstrual e unidade acessível à mobilidade reduzida. Higiene:
    instalação funcional nos pontos de cuidado e a até cinco metros dos sanitários, com água e sabão e/ou preparação
    alcoólica, conforme a redação do indicador 30 da OMS 2024. Resíduos: segregação em três recipientes e tratamento/destinação
    seguros de infecciosos e perfurocortantes. Limpeza: protocolo disponível e trabalhadores responsáveis treinados.
    Cada componente exige todos os seus itens sim, com inspeção/evidências registradas. Publicar 100 N/A de
    cada componente e 100 N/A conjunto; para o conjunto, exigir resposta válida em todos os itens dos cinco
    componentes. Não compensar componente ausente por outro conforme. Critérios detalhados de fonte, sanitários,
    tratamento e evidência no instrumento.'
  formula_calculo: P=100\times N/A,\qquad NR=U-A
  numerador: 'Por componente: estabelecimentos com todos os seus itens sim. Conjunto: estabelecimentos com
