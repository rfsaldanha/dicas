  titulo_completo: Nível nacional brasileiro de alerta precoce e resposta — SPAR C5.1
  titulo_resumido: Alerta precoce e resposta nacional — SPAR C5.1
  referencia_metodologica: SPAR, segunda edição, OMS 2021, indicador C5.1; reproduzido no indicador 21 do pacote
    OMS 2024.
  conceito: Nível ordinal de 1 a 5 declarado pelo Brasil para C5.1 no relatório anual SPAR, segunda edição.
  objetivo: Avaliar a capacidade institucional de detectar, comunicar, analisar e responder oportunamente a
    eventos de saúde pública.
  interpretacao: '1: diretrizes ausentes/em elaboração; 2: desenvolvidas, implementação insuficiente; 3: implementadas
    nacionalmente com notificação imediata e semanal; 4: nacional e intermediária; 5: nacional, intermediária
    e local com exercícios, revisão, avaliação e atualização. A ficha não avalia cada município.'
  usos:
  - Monitorar capacidade de alerta.
  - Identificar nível administrativo não coberto.
  - Integrar vigilância baseada em indicadores e eventos.
  - Planejar exercícios e melhoria.
  limitacoes:
  - Autoavaliação pode superestimar capacidade.
  - O nível nacional oculta desigualdades locais.
  - Existência do sistema não mede antecedência nem alcance de cada alerta.
  - C5.1 mede vigilância de saúde pública; não é indicador específico de alerta climático.
  fontes_dados:
  - id: who-espar
    papel: 'Dados: relatório anual brasileiro, C5.1, segunda edição; referência do instrumento SPAR 2021.'
  metodo_calculo: 'Obter no eSPAR o relatório do Brasil (BRA), selecionar o ano e confirmar que usa a segunda
    edição (2021) e o indicador C5.1. Transcrever o nível nacional publicado, conservando país, ano, edição,
    código, nível, URL/arquivo, data de acesso e SHA-256. Se a saída apresentar apenas escore 20, 40, 60, 80
    ou 100, converter por nível=escore/20 somente quando a legenda do próprio C5.1 confirmar essa correspondência
    e arquivar essa legenda; não usar média da capacidade C5. Não reconstruir o nível a partir de respostas
    locais. Nível ausente ou edição incompatível: não disponível, nunca zero ou nível 1.'
  formula_calculo: L_{BRA,ano}=\text{nível C5.1 publicado}\in\{1,2,3,4,5\}
  numerador: 'Não se aplica: nível ordinal publicado.'
  denominador: Não se aplica.
  unidade_medida: Nível ordinal de 1 a 5.
