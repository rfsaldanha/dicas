  titulo_completo: Percentual de estabelecimentos com serviços básicos de água, saneamento, higiene, resíduos
    e limpeza
  titulo_resumido: Serviços básicos de água, saneamento, higiene, resíduos e limpeza
  referencia_metodologica: 'OMS, Health system resilience indicators: an integrated package, edição 2024, indicador
    30. Critérios e instrumento local explicitados neste capítulo.'
  conceito: Percentuais de estabelecimentos conformes em cada um dos cinco componentes do indicador 30 da OMS
    e em todos simultaneamente.
  objetivo: Identificar ausência de serviços básicos que sustentam segurança e continuidade assistencial.
  interpretacao: Cada componente mede sua própria conformidade; o percentual conjunto exige os cinco, sem média
    ou compensação entre eles.
