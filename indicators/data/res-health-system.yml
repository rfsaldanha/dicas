    indicador com média da capacidade C5. Autoavaliação nacional não certifica cada município.
  comparabilidade: Comparar apenas anos com segunda edição SPAR, C5.1 e escala idêntica. A variável é ordinal,
    sem média entre níveis.
  relacao_saude: Mede capacidade ou interrupção do sistema, não o efeito final na saúde; a relação com desfechos
