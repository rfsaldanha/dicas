  - <<: *heat_stress_common
    codigo: CLI-EST-02
    titulo_completo: Temperatura aparente externa de Steadman adotada pelo Bureau of Meteorology
    titulo_resumido: Temperatura aparente — AT
    referencia_metodologica: Equação de temperatura aparente de Steadman usada pelo Bureau of Meteorology da Austrália para representar a ação conjunta de temperatura, pressão de vapor e vento.
    conceito: Temperatura equivalente estimada para um adulto apropriadamente vestido, caminhando ao ar livre e à sombra, dadas a temperatura, a umidade atmosférica e a velocidade do vento.
    objetivo: Resumir em uma escala térmica o efeito combinado de calor ou frio, umidade e vento nas condições de referência.
    interpretacao: A diferença entre AT e a temperatura do ar mostra quanto umidade e vento alteram a condição equivalente no modelo. AT maior que a temperatura indica condição aparente mais quente; AT menor, resfriamento aparente.
    usos: [Comunicação meteorológica de sensação térmica., Caracterização de exposição térmica externa., Estudos de saúde que especifiquem a equação de AT empregada.]
    limitacoes: [A equação operacional não incorpora radiação solar direta., Representa uma pessoa de referência, não indivíduos com diferentes atividades, roupas ou condições clínicas., Pressão de vapor, vento e temperatura precisam ser simultâneos., Existem outras equações chamadas temperatura aparente; o nome sem a fórmula é insuficiente.]
    fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly: 2m_temperature, 2m_dewpoint_temperature, 10m_u_component_of_wind e 10m_v_component_of_wind"}, {"id": "inmet", "papel": "Validação local e série observada separada, quando contiver as mesmas entradas"}]
    metodo_calculo: "Calcular RH a partir de T/Td conforme CLI-EST-01; e=(RH/100)×6,105×exp[17,27T/(237,7+T)] em hPa. Calcular a velocidade s10=sqrt(u10²+v10²), em m/s, a partir dos componentes zonal e meridional do vento. Aplicar AT=T+0,33e−0,70s10−4, com T em °C. Esta é a variante à sombra do Bureau of Meteorology; agregar os índices horários conforme a ficha."
    formula_calculo: "AT=T+0{,}33e-0{,}70s_{10}-4,\\qquad s_{10}=\\sqrt{u_{10}^2+v_{10}^2}"
    numerador: Não se aplica; combinação linear de temperatura, pressão de vapor e vento.
    denominador: Não se aplica.
    unidade_medida: Grau Celsius (°C).
    variaveis_categorias_analise: Temperatura do ar (°C); pressão de vapor (hPa); vento a 10 m (m/s); hora; local.
    granularidade: "Calcular o indicador em cada célula antes da média municipal ponderada pela área; manter produto, célula, ano e código IBGE de sete dígitos."
    resolucao_espacial_original: "ERA5-Land: grade de 0,1°; malha municipal IBGE 2022 como recorte fixo."
    resolucao_temporal: "Cálculo horário; máximo diário; média anual dos máximos diários."
    periodo_referencia: "Não usa período-base climatológico."
    limiar_referencia: "Índice contínuo; limiares de alerta sanitário exigem validação local."
    url_persistente: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land"
    periodo_disponivel: "1950–presente; publicar anos completos até 2025 e identificar 2026 como parcial. A janela inicial utilizável depende dos antecedentes exigidos pela medida."
    periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
    forma_acesso: "API do Climate Data Store, dataset reanalysis-era5-land, product_type=reanalysis, todas as 24 horas UTC; download NetCDF ou GRIB por mês e recorte espacial."
    formatos: "NetCDF ou GRIB de entrada; CSV/Parquet para séries municipais."
    necessidade_processamento: "Calcular ou obter o índice horário conforme o produto e as entradas desta ficha; obter máximo diário apenas com 24 índices horários válidos e média anual desses máximos; depois ponderar por área municipal."
    analise_descritiva: Mostrar AT e temperatura do ar lado a lado, máximos e mínimos, horas críticas, distribuição territorial e disponibilidade conjunta das entradas.
    relacao_saude: A medida representa condições externas percebidas em um corpo de referência e pode reduzir erro de exposição quando umidade e vento são relevantes, mas não substitui um índice fisiológico validado.
    aplicacao_gestao: Apoiar comunicação e análise de exposição, mantendo explícito que a versão à sombra não representa trabalho ao sol nem ambientes com fontes radiantes.
    referencias: ["[@steadman1994]", "[@bom2026apparent]"]
    unidade_territorial: "Célula de grade; município como síntese ponderada pela área de interseção."
    cobertura_geografica: "Todos os municípios brasileiros no domínio da grade. Não representa diretamente a exposição individual ou o microclima de cada bairro."
    qualidade_incerteza: "Dia com menos de 24 valores horários válidos do índice é ausente. Mais de 15 dias ausentes no ano ou mais de três no mês invalidam o ano. A média anual usa os dias válidos; publicar completude. Exigir ≥90% de área municipal com índice válido. Não usa período-base climatológico; não atribuir ponto de estação à área inteira do município."
