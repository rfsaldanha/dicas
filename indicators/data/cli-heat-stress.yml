  - <<: *heat_stress_common
    codigo: CLI-EST-05
    titulo_completo: Temperatura de Globo e Bulbo Úmido (WBGT)
    titulo_resumido: WBGT
    referencia_metodologica: "ISO 7243:2017 e NHO 06, 3ª edição, Fundacentro, 2025."
    conceito: Índice ambiental ponderado que combina temperatura de bulbo úmido natural, temperatura de globo e, sob sol direto, temperatura do ar.
    objetivo: Realizar triagem da exposição ao calor ao longo da jornada de trabalho e indicar a necessidade de avaliação e controles.
    interpretacao: WBGT maior representa maior carga ambiental. Sua interpretação ocupacional exige considerar taxa metabólica, vestimenta, aclimatação, distribuição espacial e temporal da exposição e limites adotados no protocolo.
    usos: [Avaliar ambientes ocupacionais internos e externos., Definir regimes de trabalho, descanso e controles segundo norma aplicável., Monitorar atividades físicas e eventos ao ar livre com orientação específica.]
    limitacoes: [Não interpretar o valor isolado sem esforço, vestimenta e aclimatação., A ISO 7243 se aplica à exposição total de adultos aptos ao trabalho em jornadas de até oito horas e não a exposições muito curtas., WBGT estimado de estação não substitui medição no microambiente quando há fontes radiantes., Limites ocupacionais vigentes devem ser verificados na norma e regulação aplicáveis.]
    fontes_dados: [{"id": "medicoes-ibutg", "papel": "Medições locais de Tnwb, Tg, Ta, condição solar, duração e metadados de calibração; protocolo NHO 06/2025"}]
    metodo_calculo: "Medir temperatura de bulbo úmido natural Tnwb, de globo Tg e do ar Ta, em °C, com instrumentos e posicionamento conformes à NHO 06, 3ª edição (2025). Com carga solar direta, IBUTG=0,7Tnwb+0,2Tg+0,1Ta; sem carga solar, IBUTG=0,7Tnwb+0,3Tg. Em cada condição i do período crítico de 60 minutos, registrar duração ti; IBUTG60=sum(IBUTGi×ti)/60, com soma(ti)=60. Publicar por posto de trabalho, com metabolismo e aclimatização separados."
    formula_calculo: "\\begin{aligned}IBUTG_{sol}&=0{,}7T_{nwb}+0{,}2T_g+0{,}1T_a\\\\IBUTG_{sem\\ sol}&=0{,}7T_{nwb}+0{,}3T_g\\end{aligned}"
    numerador: Não se aplica; média ponderada de temperaturas ambientais.
    denominador: Não se aplica.
    unidade_medida: Grau Celsius WBGT (°C).
    variaveis_categorias_analise: Bulbo úmido natural; globo; ar; sol ou sombra; posto e tarefa; esforço metabólico; vestimenta; aclimatação; tempo de exposição.
    granularidade: "Campanha/estabelecimento/posto/instrumento/data e intervalo; município é chave de localização."
    resolucao_espacial_original: "Ponto e altura de medição no posto de trabalho."
    resolucao_temporal: "Leituras durante ciclos de exposição e média ponderada no período de 60 minutos mais crítico."
    periodo_referencia: "Não se aplica; janela de exposição de 60 minutos da NHO 06."
    limiar_referencia: "Limites ocupacionais variam com metabolismo, aclimatização e regime de trabalho; não existe um corte municipal universal."
    url_persistente: "https://apisobrecarga.fundacentro.gov.br/doc/NHO06.pdf"
    periodo_disponivel: "Desde o início de cada campanha ou registro instrumental local; não há série municipal nacional centralizada demonstrada."
    periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
    forma_acesso: "Exportação CSV dos instrumentos ou do sistema local, contendo temperaturas, duração, condição solar, posto e identificação do equipamento."
    formatos: "CSV local com dicionário, unidades e metadados de calibração."
    necessidade_processamento: "Validar calibração, estabilização e duração; separar com/sem carga solar e calcular a média ponderada de 60 minutos."
    analise_descritiva: Mostrar WBGT por tarefa e horário, duração, esforço, vestimenta, aclimatação, controles existentes e incerteza; não publicar apenas a máxima ambiental.
    relacao_saude: O índice é consolidado para triagem de estresse térmico ocupacional, condição capaz de causar exaustão, golpe de calor, lesão renal e morte.
    aplicacao_gestao: Orientar controles de engenharia e administrativos, pausas, hidratação, aclimatação, vigilância de sintomas e resposta de emergência segundo protocolo ocupacional vigente.
    referencias: ["[@iso2017wbgt]", "[@fundacentro2025nho06]"]
    unidade_territorial: "Posto de trabalho, estabelecimento e município de localização; não atribuir a leitura a toda a área municipal."
    cobertura_geografica: "Somente postos de trabalho efetivamente medidos."
    qualidade_incerteza: "Sem Tnwb ou Tg instrumentais o IBUTG não é calculável por este protocolo. Temperatura de bulbo úmido psicrométrica não substitui Tnwb."
    comparabilidade: "Mesma edição da NHO 06, protocolo instrumental, posição, atividade e duração."
    notas: "Manter a ficha por sua relevância ocupacional; modelagens de WBGT são produtos distintos e não substituem a avaliação instrumental aqui especificada."
