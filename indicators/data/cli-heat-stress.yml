  - <<: *heat_stress_common
    codigo: CLI-EST-03
    titulo_completo: Humidex do Environment and Climate Change Canada
    titulo_resumido: Humidex
    referencia_metodologica: Fórmula padronizada pelo Environment and Climate Change Canada e método original de Masterton e Richardson.
    conceito: Índice adimensional que combina temperatura do ar e pressão de vapor, expressando quão quente e úmida a condição parece para uma pessoa média.
    objetivo: Comunicar desconforto e perigo potencial associados à combinação de temperatura elevada e umidade.
    interpretacao: Na escala operacional canadense, 20–29 indica pouco desconforto; 30–39, algum desconforto; 40–45, grande desconforto e recomendação de evitar esforço; 46 ou mais, condição perigosa com possibilidade de golpe de calor.
    usos: [Comunicação de calor úmido., Orientação de atividades ao ar livre no sistema canadense., Estudos de exposição que adotem explicitamente o Humidex.]
    limitacoes: [Não incorpora vento nem radiação solar., Categorias refletem orientação canadense e não equivalem a limiares brasileiros., Não representa atividade, vestimenta ou suscetibilidade individual., O uso de umidade relativa exige sua conversão consistente para pressão de vapor ou ponto de orvalho.]
    fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly: 2m_temperature e 2m_dewpoint_temperature"}, {"id": "inmet", "papel": "Validação local e série observada separada, quando contiver as mesmas entradas"}]
    metodo_calculo: "Usar T em °C e Td em kelvin na fórmula de Environment and Climate Change Canada desta ficha; e está em hPa. Calcular Humidex horário, máximo diário e média anual dos máximos, antes da média municipal por área. Não substituir Td por umidade relativa sem conversão termodinâmica explícita."
    formula_calculo: "\\begin{aligned}Humidex&=T_a+0{,}5555(e-10)\\\\e&=6{,}11\\exp\\left[5417{,}7530\\left(\\frac{1}{273{,}15}-\\frac{1}{T_d}\\right)\\right]\\end{aligned}"
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: Índice adimensional informado em escala semelhante a graus Celsius.
    variaveis_categorias_analise: Temperatura do ar (°C); ponto de orvalho (K) ou pressão de vapor (hPa); hora; local; faixa canadense de impacto.
    granularidade: "Calcular o indicador em cada célula antes da média municipal ponderada pela área; manter produto, célula, ano e código IBGE de sete dígitos."
    resolucao_espacial_original: "ERA5-Land: grade de 0,1°; malha municipal IBGE 2022 como recorte fixo."
    resolucao_temporal: "Cálculo horário; máximo diário; média anual dos máximos diários."
    periodo_referencia: "Não usa período-base climatológico."
    limiar_referencia: "Índice contínuo; limiares de alerta sanitário exigem validação local."
    url_persistente: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land"
    periodo_disponivel: "1950–presente; publicar anos completos até 2025 e identificar 2026 como parcial. A janela inicial utilizável depende dos antecedentes exigidos pela medida."
    periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
    forma_acesso: "API do Climate Data Store, dataset reanalysis-era5-land, product_type=reanalysis, todas as 24 horas UTC; download NetCDF ou GRIB por mês e recorte espacial."
    formatos: "NetCDF ou GRIB de entrada; CSV/Parquet para séries municipais."
    necessidade_processamento: "Calcular ou obter o índice horário conforme o produto e as entradas desta ficha; obter máximo diário apenas com 24 índices horários válidos e média anual desses máximos; depois ponderar por área municipal."
    analise_descritiva: Apresentar distribuição, máximo diário, horas em cada faixa, completude e comparação com temperatura do ar; separar a descrição das decisões de alerta.
    relacao_saude: A umidade elevada dificulta a perda de calor por evaporação; o Humidex apoia comunicação de desconforto e risco, mas não modela diretamente a termorregulação individual.
    aplicacao_gestao: Apoiar comunicação e orientação de atividades quando a autoridade adotar e validar explicitamente a escala; não converter suas faixas para Heat Index.
    referencias: ["[@canada2026humidex]", "[@canada2021humidexformula]", "[@masterton1979]"]
    unidade_territorial: "Célula de grade; município como síntese ponderada pela área de interseção."
    cobertura_geografica: "Todos os municípios brasileiros no domínio da grade. Não representa diretamente a exposição individual ou o microclima de cada bairro."
    qualidade_incerteza: "Dia com menos de 24 valores horários válidos do índice é ausente. Mais de 15 dias ausentes no ano ou mais de três no mês invalidam o ano. A média anual usa os dias válidos; publicar completude. Exigir ≥90% de área municipal com índice válido. Não usa período-base climatológico; não atribuir ponto de estação à área inteira do município."
    comparabilidade: "Fixar versão, calendário UTC, período-base e limites municipais de 2022. Não emendar estação e reanálise. Médias municipais de contagens podem ser fracionárias e não contam episódios sincrônicos do município."
    notas: "Calcular o índice a cada hora antes de obter o máximo diário; não calcular a fórmula usando médias anuais das entradas. Série municipal: média por área das médias anuais dos máximos diários. Não representa exposição individual."
