  - <<: *heat_stress_common
    codigo: CLI-EST-04
    titulo_completo: Índice Térmico Universal do Clima (UTCI)
    titulo_resumido: UTCI
    referencia_metodologica: Procedimento operacional do Universal Thermal Climate Index desenvolvido pela ação COST 730 e base ERA5-HEAT do Copernicus.
    conceito: Temperatura do ar de um ambiente externo de referência que produziria a mesma resposta fisiológica dinâmica estimada que a combinação real de temperatura do ar, temperatura radiante média, umidade e vento.
    objetivo: Classificar estresse térmico externo por meio de um modelo termofisiológico e de vestimenta com categorias comparáveis.
    interpretacao: Para calor, 26–32 °C indica estresse moderado; acima de 32 até 38 °C, forte; acima de 38 até 46 °C, muito forte; acima de 46 °C, extremo. Entre 9 e 26 °C, a escala indica ausência de estresse térmico.
    usos: [Monitorar estresse térmico externo., Mapear horas ou dias em categorias de calor., Apoiar alertas, planejamento urbano e estudos de exposição em saúde.]
    limitacoes: [A aproximação polinomial oficial restringe o vento a 0,5–17 m/s., A temperatura radiante média é difícil de observar e frequentemente modelada., A referência supõe caminhada a 4 km/h e vestimenta adaptativa modelada., Grade de reanálise não descreve sombra e geometria urbana em microescala.]
    fontes_dados: [{"id": "era5-heat", "papel": "ERA5-HEAT v1.1, derived-utci-historical: universal_thermal_climate_index"}]
    metodo_calculo: "Baixar UTCI já calculado pelo ERA5-HEAT v1.1; converter kelvin para °C subtraindo 273,15. Obter máximo diário com 24 horas válidas e média anual desses máximos; aplicar depois média municipal por área. Não recalcular o polinômio UTCI com temperatura média radiante arbitrária."
    formula_calculo: 'UTCI=T_a+Offset(T_a,T_{mrt}-T_a,v_{10},p_a)'
    numerador: "Não se aplica ao UTCI importado; na média anual, soma dos máximos diários válidos."
    denominador: "Dias válidos do ano na média dos máximos diários; área válida na agregação municipal."
    unidade_medida: Grau Celsius de temperatura equivalente UTCI (°C).
    variaveis_categorias_analise: "UTCI horário do produto, em kelvin na entrada e °C na saída; máximo diário; média anual; célula, município e cobertura."
    granularidade: "Calcular o indicador em cada célula antes da média municipal ponderada pela área; manter produto, célula, ano e código IBGE de sete dígitos."
    resolucao_espacial_original: "0,25°, nativa do ERA5-HEAT v1.1."
    resolucao_temporal: "Horária; máximo diário e média anual dos máximos diários."
    periodo_referencia: "Não usa período-base para calcular UTCI."
    limiar_referencia: Calor moderado 26–32 °C; forte >32–38 °C; muito forte >38–46 °C; extremo >46 °C.
    url_persistente: "https://cds.climate.copernicus.eu/datasets/derived-utci-historical"
    periodo_disponivel: "1940–presente; anos completos até 2025."
    periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
    forma_acesso: "API CDS, dataset derived-utci-historical, variable=universal_thermal_climate_index, version=1_1, product_type=consolidated_dataset, todas as horas disponíveis."
    formatos: "NetCDF ou GRIB de entrada; CSV/Parquet para séries municipais."
    necessidade_processamento: "Calcular ou obter o índice horário conforme o produto e as entradas desta ficha; obter máximo diário apenas com 24 índices horários válidos e média anual desses máximos; depois ponderar por área municipal."
    analise_descritiva: "Publicar a média anual dos máximos diários de UTCI em °C e a completude; categorias de estresse, se adicionadas, são saídas separadas com seus próprios tempos de exposição."
    relacao_saude: As categorias derivam de respostas termofisiológicas modeladas e o índice é aplicado a alertas e avaliação de estresse térmico humano, não a diagnóstico individual.
    aplicacao_gestao: Apoiar vigilância, comunicação e planejamento territorial de estresse térmico externo, com validação local e resolução compatível com a ação.
    referencias: ["[@brode2012utci]", "[@dinapoli2021era5heat]", "[@copernicus2026utci]"]
    unidade_territorial: "Célula de grade; município como síntese ponderada pela área de interseção."
    cobertura_geografica: "Todos os municípios brasileiros no domínio da grade. Não representa diretamente a exposição individual ou o microclima de cada bairro."
    qualidade_incerteza: "Dia com menos de 24 valores horários válidos do índice é ausente. Mais de 15 dias ausentes no ano ou mais de três no mês invalidam o ano. A média anual usa os dias válidos; publicar completude. Exigir ≥90% de área municipal com índice válido. Não usa período-base climatológico; não atribuir ponto de estação à área inteira do município."
    comparabilidade: "Fixar versão, calendário UTC, período-base e limites municipais de 2022. Não emendar estação e reanálise. Médias municipais de contagens podem ser fracionárias e não contam episódios sincrônicos do município."
    notas: "Usar o produto consolidado v1.1 e arquivar a requisição CDS. O suporte nativo de 0,25° deve acompanhar todo resultado municipal."
