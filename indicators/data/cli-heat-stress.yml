common: &heat_stress_common
  tema: Temperatura e condições térmicas
  capitulo: chapters/part-2/05-temperatura-condicoes-termicas.qmd
  dimensoes: [perigo, exposição]
  unidade_territorial: Ponto de observação, célula de grade ou território obtido por agregação explícita.
  cobertura_geografica: A da fonte meteorológica ou do levantamento microambiental selecionado.
  responsabilidade_gerencial: Serviço meteorológico ou equipe de saúde ambiental ou do trabalhador responsável pela medição, com autoridade de saúde responsável pelo protocolo de uso.
  disponibilidade: [requer processamento meteorológico]
  qualidade_incerteza: Verificar unidades, altura e abrigo dos sensores, sincronização das variáveis, dados ausentes, domínio de validade da fórmula, representatividade espacial e diferença entre valor medido e modelado.
  comparabilidade: Manter fórmula, versão, entradas, unidades, altura do vento, tratamento da radiação, resolução temporal e regra de agregação; índices diferentes não são conversíveis por uma escala comum.
  defasagens_temporais: Preservar valores horários e diários para relacionar exposições agudas a desfechos no mesmo dia e em dias subsequentes; a agregação anual não serve para estimar efeitos de curto prazo.
  notas: O valor é uma temperatura ou índice equivalente, não a temperatura corporal nem uma medição direta de risco individual. Categorias operacionais de outro país não constituem automaticamente limiares de alerta no Brasil.

indicators:
  - <<: *heat_stress_common
    codigo: CLI-EST-01
    titulo_completo: Índice de Calor do National Weather Service (Heat Index)
    titulo_resumido: Índice de Calor — HI
    referencia_metodologica: Regressão de Rothfusz adotada operacionalmente pelo National Weather Service dos Estados Unidos a partir das tabelas de Steadman.
    conceito: Temperatura aparente em graus Fahrenheit estimada pela combinação da temperatura do ar e da umidade relativa, sob condições de referência que pressupõem sombra e vento fraco.
    objetivo: Representar o efeito conjunto de calor e umidade para comunicação e triagem de condições quentes.
    interpretacao: Valores maiores indicam maior carga térmica aparente nas condições assumidas. O resultado não incorpora diretamente radiação solar, vento variável, esforço, vestimenta, aclimatação ou suscetibilidade clínica.
    usos: [Comunicar calor úmido., Caracterizar horas ou dias com Índice de Calor elevado., Apoiar estudos epidemiológicos e protocolos calor–saúde que tenham validado localmente a exposição.]
    limitacoes: [A regressão completa é aplicada quando a estimativa preliminar atinge pelo menos 80 °F., A fórmula não é válida fora da faixa de temperatura e umidade dos dados de Steadman., Sol direto pode elevar substancialmente a carga térmica., As categorias do NWS são orientação operacional estadunidense e não limiares sanitários universais.]
    fontes_dados:
      - id: inmet
        papel: temperatura do ar e umidade relativa sincronizadas
      - id: era5-land
        papel: temperatura e umidade em grade para análise retrospectiva, após avaliação de viés
    metodo_calculo: Converter a temperatura para graus Fahrenheit. Calcular primeiro a aproximação simples de Steadman e tirar sua média com a temperatura observada. Se essa média for inferior a 80 °F, usar o resultado simples. Se atingir 80 °F, aplicar a regressão de Rothfusz e os ajustes oficiais para umidade muito baixa ou muito alta nas faixas especificadas pelo NWS. Converter para graus Celsius apenas ao final, quando necessário.
    formula_calculo: 'HI=-42{,}379+2{,}04901523T+10{,}14333127RH-0{,}22475541TRH-0{,}00683783T^2-0{,}05481717RH^2+0{,}00122874T^2RH+0{,}00085282TRH^2-0{,}00000199T^2RH^2'
    numerador: Não se aplica; combinação polinomial de temperatura e umidade relativa.
    denominador: Não se aplica.
    unidade_medida: Grau Fahrenheit (°F) na fórmula original; pode ser convertido para grau Celsius (°C) após o cálculo.
    variaveis_categorias_analise: Temperatura do ar em °F; umidade relativa em %; hora; local; categoria operacional, se adotada e validada.
    granularidade: Valor por observação sincronizada; resumos por hora, dia, episódio ou território.
    resolucao_espacial_original: Ponto de estação ou célula do produto meteorológico.
    resolucao_temporal: Preferencialmente horária ou subdiária; não calcular a partir de médias mensais.
    periodo_referencia: Não exige climatologia para o cálculo; comparações temporais requerem série e método estáveis.
    limiar_referencia: Aplicar a regressão completa quando a média entre a aproximação inicial e T for pelo menos 80 °F; demais categorias devem ser identificadas com a fonte e validadas para a finalidade.
    url_persistente: https://www.weather.gov/ctp/heat
    periodo_disponivel: O período comum às séries de temperatura e umidade.
    periodicidade_atualizacao: Horária ou conforme a observação meteorológica.
    forma_acesso: Cálculo sobre observações sincronizadas, com implementação e ajustes versionados.
    formatos: Tabela horária por estação ou matriz multidimensional por célula.
    necessidade_processamento: Controle de qualidade, conversão de unidades, cálculo preliminar, escolha da equação, ajustes de umidade e agregação temporal.
    analise_descritiva: Apresentar máximos diários, horas acima das categorias adotadas, distribuição territorial, completude e comparação com temperatura do ar, sem converter categorias de outros índices.
    relacao_saude: Calor úmido reduz a eficiência da evaporação do suor; o índice é usado em comunicação e estudos de calor, mas não representa resposta fisiológica individual.
    aplicacao_gestao: Apoiar comunicação de risco e vigilância de calor úmido quando o protocolo declarar a fórmula, as hipóteses e os limiares locais de ação.
    referencias: ["[@nws2026heat]", "[@rothfusz1990]"]

  - <<: *heat_stress_common
    codigo: CLI-EST-02
    titulo_completo: Temperatura aparente externa de Steadman adotada pelo Bureau of Meteorology
    titulo_resumido: Temperatura aparente — AT
    referencia_metodologica: Equação de temperatura aparente de Steadman usada pelo Bureau of Meteorology da Austrália para representar a ação conjunta de temperatura, pressão de vapor e vento.
    conceito: Temperatura equivalente estimada para um adulto apropriadamente vestido, caminhando ao ar livre e à sombra, dadas a temperatura, a umidade atmosférica e a velocidade do vento.
    objetivo: Resumir em uma escala térmica o efeito combinado de calor ou frio, umidade e vento nas condições de referência.
    interpretacao: A diferença entre AT e a temperatura do ar mostra quanto umidade e vento alteram a condição equivalente no modelo. AT maior que a temperatura indica condição aparente mais quente; AT menor, resfriamento aparente.
    usos: [Comunicação meteorológica de sensação térmica., Caracterização de exposição térmica externa., Estudos de saúde que especifiquem a equação de AT empregada.]
    limitacoes: [A equação operacional não incorpora radiação solar direta., Representa uma pessoa de referência, não indivíduos com diferentes atividades, roupas ou condições clínicas., Pressão de vapor, vento e temperatura precisam ser simultâneos., Existem outras equações chamadas temperatura aparente; o nome sem a fórmula é insuficiente.]
    fontes_dados:
      - id: inmet
        papel: temperatura do ar, umidade ou ponto de orvalho e vento a 10 m
      - id: era5-land
        papel: variáveis meteorológicas em grade para análise retrospectiva, após validação
    metodo_calculo: Obter temperatura do ar em graus Celsius, pressão de vapor em hPa e velocidade do vento a 10 m em m/s para o mesmo instante. Aplicar a equação externa sem radiação do Bureau of Meteorology. Quando a pressão de vapor for derivada de temperatura e umidade relativa, registrar a equação de saturação empregada.
    formula_calculo: 'AT=T_a+0{,}33e-0{,}70v_{10}-4{,}00'
    numerador: Não se aplica; combinação linear de temperatura, pressão de vapor e vento.
    denominador: Não se aplica.
    unidade_medida: Grau Celsius (°C).
    variaveis_categorias_analise: Temperatura do ar (°C); pressão de vapor (hPa); vento a 10 m (m/s); hora; local.
    granularidade: Valor horário ou por observação; resumo diário ou por episódio.
    resolucao_espacial_original: Ponto de estação ou célula do produto meteorológico.
    resolucao_temporal: Horária ou subdiária.
    periodo_referencia: Não exige período-base; análises de anomalia devem declarar a climatologia.
    limiar_referencia: Não há categoria sanitária universal própria da equação; limiares de ação precisam ser relacionados a efeitos e capacidades locais.
    url_persistente: https://media.bom.gov.au/social/blog/1153/apparent-/
    periodo_disponivel: O período de interseção entre temperatura, umidade e vento.
    periodicidade_atualizacao: Horária ou conforme a fonte.
    forma_acesso: Cálculo sobre observações ou campos meteorológicos sincronizados.
    formatos: Tabela de observações ou grade horária.
    necessidade_processamento: Harmonizar unidades e horários, calcular ou obter pressão de vapor, aplicar a equação e documentar a ausência de radiação solar.
    analise_descritiva: Mostrar AT e temperatura do ar lado a lado, máximos e mínimos, horas críticas, distribuição territorial e disponibilidade conjunta das entradas.
    relacao_saude: A medida representa condições externas percebidas em um corpo de referência e pode reduzir erro de exposição quando umidade e vento são relevantes, mas não substitui um índice fisiológico validado.
    aplicacao_gestao: Apoiar comunicação e análise de exposição, mantendo explícito que a versão à sombra não representa trabalho ao sol nem ambientes com fontes radiantes.
    referencias: ["[@steadman1994]", "[@bom2026apparent]"]

  - <<: *heat_stress_common
    codigo: CLI-EST-03
    titulo_completo: Humidex do Environment and Climate Change Canada
    titulo_resumido: Humidex
    referencia_metodologica: Fórmula padronizada pelo Environment and Climate Change Canada e método original de Masterton e Richardson.
    conceito: Índice adimensional que combina temperatura do ar e pressão de vapor, expressando quão quente e úmida a condição parece para uma pessoa média.
    objetivo: Comunicar desconforto e perigo potencial associados à combinação de temperatura elevada e umidade.
    interpretacao: Na escala operacional canadense, 20–29 indica pouco desconforto; 30–39, algum desconforto; 40–45, grande desconforto e recomendação de evitar esforço; 46 ou mais, condição perigosa com possibilidade de golpe de calor.
    usos: [Comunicação de calor úmido., Orientação de atividades ao ar livre no sistema canadense., Estudos de exposição que adotem explicitamente o Humidex.]
    limitacoes: [Não incorpora vento nem radiação solar., Categorias refletem orientação canadense e não equivalem a limiares brasileiros., Não representa atividade, vestimenta ou suscetibilidade individual., O uso de umidade relativa exige sua conversão consistente para pressão de vapor ou ponto de orvalho.]
    fontes_dados:
      - id: inmet
        papel: temperatura do ar e ponto de orvalho ou umidade relativa
      - id: era5-land
        papel: temperatura e umidade em grade para análise retrospectiva, após validação
    metodo_calculo: Converter o ponto de orvalho para kelvin. Calcular a pressão de vapor e, em seguida, o incremento h; somá-lo à temperatura do ar em graus Celsius. Se a entrada disponível for umidade relativa, derivar primeiro o ponto de orvalho ou a pressão de vapor com método documentado.
    formula_calculo: 'Humidex=T_a+0{,}5555(e-10),\quad e=6{,}11\exp\left[5417{,}7530\left(\frac{1}{273{,}15}-\frac{1}{T_d}\right)\right]'
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: Índice adimensional informado em escala semelhante a graus Celsius.
    variaveis_categorias_analise: Temperatura do ar (°C); ponto de orvalho (K) ou pressão de vapor (hPa); hora; local; faixa canadense de impacto.
    granularidade: Valor horário ou por observação; resumo diário, por episódio ou território.
    resolucao_espacial_original: Ponto de estação ou célula do produto meteorológico.
    resolucao_temporal: Horária ou subdiária.
    periodo_referencia: Não exige climatologia; tendências requerem série homogênea.
    limiar_referencia: Faixas canadenses 20–29, 30–39, 40–45 e ≥46; seu emprego como gatilho fora do Canadá requer validação local.
    url_persistente: https://www.canada.ca/en/environment-climate-change/services/climate-change/canadian-centre-climate-services/display-download/technical-documentation-climate-normals.html
    periodo_disponivel: O período comum às variáveis de temperatura e umidade.
    periodicidade_atualizacao: Horária ou conforme a fonte.
    forma_acesso: Cálculo sobre observações sincronizadas de temperatura e umidade.
    formatos: Tabela horária por estação ou grade.
    necessidade_processamento: Controle de qualidade, conversão do ponto de orvalho para kelvin, cálculo de pressão de vapor e aplicação da fórmula.
    analise_descritiva: Apresentar distribuição, máximo diário, horas em cada faixa, completude e comparação com temperatura do ar; separar a descrição das decisões de alerta.
    relacao_saude: A umidade elevada dificulta a perda de calor por evaporação; o Humidex apoia comunicação de desconforto e risco, mas não modela diretamente a termorregulação individual.
    aplicacao_gestao: Apoiar comunicação e orientação de atividades quando a autoridade adotar e validar explicitamente a escala; não converter suas faixas para Heat Index.
    referencias: ["[@canada2026humidex]", "[@canada2021humidexformula]", "[@masterton1979]"]

  - <<: *heat_stress_common
    codigo: CLI-EST-04
    titulo_completo: Índice Térmico Universal do Clima (UTCI)
    titulo_resumido: UTCI
    referencia_metodologica: Procedimento operacional do Universal Thermal Climate Index desenvolvido pela ação COST 730 e base ERA5-HEAT do Copernicus.
    conceito: Temperatura do ar de um ambiente externo de referência que produziria a mesma resposta fisiológica dinâmica estimada que a combinação real de temperatura do ar, temperatura radiante média, umidade e vento.
    objetivo: Classificar estresse térmico externo por meio de um modelo termofisiológico e de vestimenta com categorias comparáveis.
    interpretacao: Para calor, 26–32 °C indica estresse moderado; acima de 32 até 38 °C, forte; acima de 38 até 46 °C, muito forte; acima de 46 °C, extremo. Entre 9 e 26 °C, a escala indica ausência de estresse térmico.
    usos: [Monitorar estresse térmico externo., Mapear horas ou dias em categorias de calor., Apoiar alertas, planejamento urbano e estudos de exposição em saúde.]
    limitacoes: [A aproximação polinomial oficial restringe o vento a 0,5–17 m/s., A temperatura radiante média é difícil de observar e frequentemente modelada., A referência supõe caminhada a 4 km/h e vestimenta adaptativa modelada., Grade de reanálise não descreve sombra e geometria urbana em microescala.]
    fontes_dados:
      - id: era5-heat
        papel: UTCI e temperatura radiante média horárias já derivadas do ERA5
      - id: inmet
        papel: observações meteorológicas para validação das entradas ou de aplicações locais
    metodo_calculo: Usar a implementação oficial do UTCI com temperatura do ar, diferença entre temperatura radiante média e temperatura do ar, pressão de vapor ou umidade relativa e vento a 10 m. Para séries globais, usar o UTCI horário do ERA5-HEAT, registrando versão. Classificar cada valor pela escala UTCI e agregar horas ou dias conforme a pergunta.
    formula_calculo: 'UTCI=T_a+Offset(T_a,T_{mrt}-T_a,v_{10},p_a)'
    numerador: Não se aplica; aproximação polinomial multivariada do modelo UTCI.
    denominador: Não se aplica.
    unidade_medida: Grau Celsius de temperatura equivalente UTCI (°C).
    variaveis_categorias_analise: Temperatura do ar; temperatura radiante média; vento a 10 m; pressão de vapor ou umidade relativa; dez categorias de estresse térmico.
    granularidade: Valor horário por ponto ou célula; resumo diário, sazonal, anual ou territorial.
    resolucao_espacial_original: 0,25° na distribuição regular do ERA5-HEAT; aplicações locais podem ter outra resolução, que deve ser declarada.
    resolucao_temporal: Horária na entrada; saída horária ou agregada.
    periodo_referencia: Não exige climatologia para a categoria; anomalias e contagens comparativas devem declarar o período-base.
    limiar_referencia: Calor moderado 26–32 °C; forte >32–38 °C; muito forte >38–46 °C; extremo >46 °C.
    url_persistente: https://doi.org/10.24381/cds.553b7518
    periodo_disponivel: Desde 1940 até próximo do presente no ERA5-HEAT, conforme a versão consultada.
    periodicidade_atualizacao: O conjunto histórico é estendido conforme o ERA5; verificar latência e versão.
    forma_acesso: Obtenção pelo Copernicus Climate Data Store ou cálculo com a implementação oficial do UTCI.
    formatos: NetCDF para grade; NetCDF ou CSV no produto de séries temporais.
    necessidade_processamento: Selecionar versão e fluxo, converter kelvin para Celsius quando necessário, classificar valores, tratar horários e agregar sem ocultar extremos.
    analise_descritiva: Apresentar máximos e mínimos, horas ou dias em cada categoria, mapas, população exposta e incerteza; comparar com temperatura do ar para evidenciar o papel de vento, umidade e radiação.
    relacao_saude: As categorias derivam de respostas termofisiológicas modeladas e o índice é aplicado a alertas e avaliação de estresse térmico humano, não a diagnóstico individual.
    aplicacao_gestao: Apoiar vigilância, comunicação e planejamento territorial de estresse térmico externo, com validação local e resolução compatível com a ação.
    referencias: ["[@brode2012utci]", "[@dinapoli2021era5heat]", "[@copernicus2026utci]"]

  - <<: *heat_stress_common
    codigo: CLI-EST-05
    titulo_completo: Temperatura de Globo e Bulbo Úmido (WBGT)
    titulo_resumido: WBGT
    referencia_metodologica: ISO 7243:2017 e critérios do NIOSH para triagem de estresse térmico ocupacional.
    conceito: Índice ambiental ponderado que combina temperatura de bulbo úmido natural, temperatura de globo e, sob sol direto, temperatura do ar.
    objetivo: Realizar triagem da exposição ao calor ao longo da jornada de trabalho e indicar a necessidade de avaliação e controles.
    interpretacao: WBGT maior representa maior carga ambiental. Sua interpretação ocupacional exige considerar taxa metabólica, vestimenta, aclimatação, distribuição espacial e temporal da exposição e limites adotados no protocolo.
    usos: [Avaliar ambientes ocupacionais internos e externos., Definir regimes de trabalho, descanso e controles segundo norma aplicável., Monitorar atividades físicas e eventos ao ar livre com orientação específica.]
    limitacoes: [Não interpretar o valor isolado sem esforço, vestimenta e aclimatação., A ISO 7243 se aplica à exposição total de adultos aptos ao trabalho em jornadas de até oito horas e não a exposições muito curtas., WBGT estimado de estação não substitui medição no microambiente quando há fontes radiantes., Limites ocupacionais vigentes devem ser verificados na norma e regulação aplicáveis.]
    fontes_dados:
      - id: inmet
        papel: dados meteorológicos auxiliares para estimativa externa e planejamento de medição
      - id: era5-land
        papel: campos meteorológicos auxiliares em avaliações retrospectivas, sem substituir medição ocupacional local
    metodo_calculo: Medir simultaneamente temperatura de bulbo úmido natural, temperatura de globo e temperatura do ar no local representativo da exposição. Para ambiente externo com carga solar, aplicar 0,7Tnwb + 0,2Tg + 0,1Ta. Para ambiente interno ou externo sem carga solar, aplicar 0,7Tnwb + 0,3Tg. Calcular média ponderada no tempo e, se necessário, no corpo conforme o protocolo técnico.
    formula_calculo: 'WBGT_{sol}=0{,}7T_{nwb}+0{,}2T_g+0{,}1T_a;\qquad WBGT_{sem\ sol}=0{,}7T_{nwb}+0{,}3T_g'
    numerador: Não se aplica; média ponderada de temperaturas ambientais.
    denominador: Não se aplica.
    unidade_medida: Grau Celsius WBGT (°C).
    variaveis_categorias_analise: Bulbo úmido natural; globo; ar; sol ou sombra; posto e tarefa; esforço metabólico; vestimenta; aclimatação; tempo de exposição.
    granularidade: Medição por ponto, tarefa e intervalo; média ponderada da exposição na jornada.
    resolucao_espacial_original: Microambiente ocupacional no ponto representativo da exposição.
    resolucao_temporal: Leituras simultâneas durante períodos representativos; média ponderada na jornada.
    periodo_referencia: Condição atual de trabalho; séries históricas são secundárias à caracterização representativa da exposição.
    limiar_referencia: Valores de ação e limites dependem de esforço, vestimenta, aclimatação e norma aplicável; não há um único limiar WBGT para toda população e atividade.
    url_persistente: https://www.iso.org/standard/67188.html
    periodo_disponivel: Períodos efetivamente medidos; estimativas meteorológicas dependem da fonte.
    periodicidade_atualizacao: Conforme programa de higiene ocupacional e mudanças de tarefa, processo, ambiente ou clima.
    forma_acesso: Medição instrumental no local; estimativa meteorológica apenas para triagem complementar com método validado.
    formatos: Planilha ou sistema de higiene ocupacional com leituras, metadados de tarefa e calibração.
    necessidade_processamento: Verificar calibração e posicionamento, sincronizar sensores, aplicar fórmula adequada, ponderar tempo e atividade e confrontar com critérios aplicáveis.
    analise_descritiva: Mostrar WBGT por tarefa e horário, duração, esforço, vestimenta, aclimatação, controles existentes e incerteza; não publicar apenas a máxima ambiental.
    relacao_saude: O índice é consolidado para triagem de estresse térmico ocupacional, condição capaz de causar exaustão, golpe de calor, lesão renal e morte.
    aplicacao_gestao: Orientar controles de engenharia e administrativos, pausas, hidratação, aclimatação, vigilância de sintomas e resposta de emergência segundo protocolo ocupacional vigente.
    referencias: ["[@iso2017wbgt]", "[@niosh2016heat]", "[@who2025workplaceheat]"]
