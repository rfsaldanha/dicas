    qualidade_incerteza: "Exigir meses completos e 30 acumulados válidos para cada mês da base; não preencher faltas com zero. Não misturar estimativas de gama, escala temporal ou base. Especificações de elegibilidade e agregação são escolhas operacionais deste livro."
