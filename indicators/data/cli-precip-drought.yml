  - <<: *precip_common
    codigo: CLI-PRC-04
    titulo_completo: Maior número de dias consecutivos secos (CDD)
    titulo_resumido: Dias consecutivos secos — CDD
    referencia_metodologica: Índice Consecutive Dry Days do conjunto ETCCDI, documentado pelo Climdex.
    conceito: Maior sequência de dias consecutivos com precipitação diária inferior a 1 mm no período.
    objetivo: Medir a duração máxima de um período sem dia úmido segundo o limiar ETCCDI.
    interpretacao: Valor maior indica intervalo seco contínuo mais longo, não necessariamente seca agrícola, hidrológica ou socioeconômica.
    usos: [Caracterizar persistência da ausência de chuva., Monitorar mudança em extremos secos., Contextualizar disponibilidade de água, poeira, fogo e vetores.]
    limitacoes: [Limiar de 1 mm é climatológico, não uma necessidade hídrica., Falhas quebram sequências., Uma sequência pode cruzar anos., Não incorpora evapotranspiração, armazenamento ou demanda.]
    metodo_calculo: "Classificar cada dia válido por PR<1 mm. Dentro de cada ano civil, identificar sequências consecutivas e selecionar a maior duração. Truncar explicitamente as sequências em 31/12: esta é a variante anual adotada neste livro, diferente de implementações que permitem a passagem entre anos. Sem dia qualificado, zero. Lacuna interrompe a sequência e exige flag de limite inferior; aplicar o filtro de completude antes da publicação. Agregar as durações das células por área."
    formula_calculo: 'CDD_p=\max_{e\subset p}\{|e|:\ PR_d<1\ mm\ \forall d\in e\}'
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: Dias.
    periodo_referencia: "Sem período-base para esta medida; exceções percentílicas são explicitadas na ficha."
    limiar_referencia: PR < 1 mm.
    url_persistente: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land"
    necessidade_processamento: "Reconstruir precipitação diária com a convenção de acumulação do produto; controlar falhas; calcular a estatística por célula e ponderar por área municipal, salvo SPI."
    analise_descritiva: Mostrar CDD, datas, recorrência, tendência e relação com SPI e indicadores setoriais sem tratá-los como equivalentes.
    referencias: ["[@climdex2024]", "[@who2026drought]"]
    fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly, total_precipitation; acumulado de 24 h às 00 UTC do dia seguinte"}, {"id": "chirps-v3", "papel": "CHIRPS v3 daily RNL final, série alternativa em grade"}, {"id": "inmet", "papel": "Pluviômetros para validação e séries observadas separadas"}]
