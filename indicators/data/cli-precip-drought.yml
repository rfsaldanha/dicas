common: &precip_common
  tema: Precipitação, secas e eventos hidrológicos
  capitulo: chapters/part-2/08-precipitacao-secas-eventos-hidrologicos.qmd
  capitulo_fichas: chapters/part-4/18-fichas-precipitacao-secas-eventos-hidrologicos.qmd
  dimensoes: [perigo, exposição]
  variaveis_categorias_analise: Precipitação diária; dia do calendário; mês; estação; ano; estação ou célula de grade.
  granularidade: Entrada diária por estação ou célula; resumo mensal, sazonal ou anual.
  unidade_territorial: Estação meteorológica, célula de grade, bacia ou território derivado.
  resolucao_espacial_original: A da fonte de precipitação; agregações territoriais exigem ponderação declarada.
  resolucao_temporal: Entrada diária; saída por período.
  fontes_dados:
    - id: inmet
      papel: observações pluviométricas diárias
    - id: cemaden
      papel: observações pluviométricas subdiárias ou diárias para monitoramento
    - id: era5-land
      papel: precipitação em reanálise condicionada à validação
  responsabilidade_gerencial: Serviço meteorológico ou hidrológico responsável pelo dado e órgão de saúde que qualifique o uso sanitário.
  cobertura_geografica: A da fonte selecionada, condicionada à densidade observacional e qualidade.
  periodo_disponivel: O da fonte, incluindo série suficiente para o período-base quando houver percentis.
  periodicidade_atualizacao: Anual para monitoramento climático; diária ou subdiária em protocolo operacional próprio.
  forma_acesso: Cálculo sobre série de precipitação controlada, com algoritmo, unidades e calendário versionados.
  formatos: Tabela por estação ou arquivo multidimensional por célula.
  disponibilidade: [requer processamento climatológico]
  qualidade_incerteza: Relatar falhas, horário de acumulação, vento e subcaptura do pluviômetro, mudança de instrumento, homogeneidade, viés de grade e cobertura espacial.
  comparabilidade: Manter limiar de dia úmido, período-base, calendário, fonte, unidade, regra de falhas e método de agregação.
  relacao_saude: Extremos e persistência de chuva ou ausência de chuva ajudam a caracterizar perigos relacionados a água, saneamento, vetores, segurança alimentar e acesso a serviços; não equivalem ao efeito sanitário.
  defasagens_temporais: Preservar série diária e datas para testar janelas compatíveis com o mecanismo e o desfecho.
  aplicacao_gestao: Caracterizar sazonalidade e extremos, apoiar vigilância de agravos sensíveis ao clima e contextualizar alertas hidrometeorológicos.
  notas: Índices ETCCDI descrevem a precipitação observada. Não substituem modelagem hidrológica, mapeamento de inundação ou registro de desastre.

indicators:
  - <<: *precip_common
    codigo: CLI-PRC-01
    titulo_completo: Maior precipitação em um dia (Rx1day)
    titulo_resumido: Máxima em um dia — Rx1day
    referencia_metodologica: Índice Rx1day do conjunto ETCCDI, documentado pelo Climdex.
    conceito: Maior total de precipitação acumulada em um dia dentro do mês, estação ou ano.
    objetivo: Representar o maior acumulado diário do período de maneira comparável.
    interpretacao: Valor maior indica um pico diário mais elevado, mas não determina sozinho inundação, enxurrada ou deslizamento.
    usos: [Monitorar extremos de chuva., Relacionar picos de precipitação a agravos e interrupções., Contextualizar episódios hidrológicos.]
    limitacoes: [Ignora os demais dias do período., Pode diluir extremos subdiários., Depende do horário de fechamento do dia., A resposta hidrológica depende de solo, bacia, drenagem e chuva antecedente.]
    metodo_calculo: "Obter PR diário pelo protocolo de acumulação. Selecionar o maior PR entre 1º de janeiro e 31 de dezembro por célula; depois aplicar média por área municipal. Publicar data do máximo na célula e fração de dias válidos."
    formula_calculo: 'Rx1day_p=\max_{d\in p}(PR_d)'
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: Milímetros (mm).
    periodo_referencia: "Sem período-base para esta medida; exceções percentílicas são explicitadas na ficha."
    limiar_referencia: Não se aplica; é um máximo.
    url_persistente: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land"
    necessidade_processamento: "Reconstruir precipitação diária com a convenção de acumulação do produto; controlar falhas; calcular a estatística por célula e ponderar por área municipal, salvo SPI."
    analise_descritiva: Apresentar valor, data, completude, localização e comparação com distribuição histórica e condições antecedentes.
    referencias: ["[@climdex2024]", "[@levy2016waterborne]"]
    fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly, total_precipitation; acumulado de 24 h às 00 UTC do dia seguinte"}, {"id": "chirps-v3", "papel": "CHIRPS v3 daily RNL final, série alternativa em grade"}, {"id": "inmet", "papel": "Pluviômetros para validação e séries observadas separadas"}]
    periodo_disponivel: "ERA5-Land: 1950–presente; CHIRPS v3: 1981–presente. Publicar anos completos até 2025 e identificar 2026 como parcial."
    resolucao_espacial_original: "ERA5-Land 0,1°; CHIRPS v3 0,05°. Não misturar produtos em uma mesma série."
    unidade_territorial: "Célula; síntese municipal pela malha IBGE 2022."
    granularidade: "Calcular o índice anual em cada célula e depois a média ponderada pela área de interseção municipal; SPI é a exceção descrita em sua ficha."
    resolucao_temporal: "Precipitação diária em UTC; saída anual por ano civil."
    cobertura_geografica: "Municípios brasileiros no domínio das grades; estações têm cobertura restrita à rede e não representam automaticamente toda a área municipal."
    forma_acesso: "API CDS, reanalysis-era5-land, variable=total_precipitation, product_type=reanalysis, time=00:00. Para o dia d usar o acumulado do registro às 00 UTC de d+1, correspondente às 24 horas anteriores, e multiplicar metros por 1000. Não somar os acumulados horários sem desacumulação. CHIRPS: download HTTP dos rasters daily RNL final v3."
    formatos: "NetCDF/GRIB ERA5-Land; GeoTIFF ou NetCDF CHIRPS; CSV/Parquet municipal."
    periodicidade_atualizacao: "Anual para os índices; mensal para SPI-3."
    qualidade_incerteza: "Precipitação negativa ou sem registro é ausente, nunca dia seco. Ano com mais de 15 dias ausentes, ou mais de três em qualquer mês, é inválido; estes critérios não eliminam o viés de lacunas restantes. Publicar fração observada e marcar índices de sequência como limite inferior se houver lacuna. Exigir ≥90% da área municipal válida. Regras de cobertura são escolhas editoriais."
    comparabilidade: "Preservar produto, versão, fechamento UTC, limiar de 1 mm e malha IBGE 2022. CHIRPS v3 RNL usa desagregação diária apoiada em ERA5 e não constitui validação inteiramente independente. Séries v2/v3 e pluviômetros permanecem separadas."
    notas: "A média municipal de extremos e durações não é o extremo ou a duração da chuva média municipal. A ficha SPI-3 especifica a ordem inversa. Não interpretar qualquer destes índices como ocorrência comprovada de inundação."
    protocolo_versao: "2026-10-03"
    situacao_calculo: "abertos"
    disponibilidade: ["Calculável com dados abertos"]
    dependencia_dados_locais: "Opcional para validação"
    automacao: "Condicionada"
    condicoes_automacao: "Credencial gratuita CDS e aceite da licença; alternativa CHIRPS por HTTP sem cadastro. Séries observadas exigem registros diários locais completos."
    evidencia_verificacao: "Documentação verificada"
    detalhe_verificacao: "Produto e método documentados; série municipal completa ainda não produzida."


  - <<: *precip_common
    codigo: CLI-PRC-02
    titulo_completo: Maior precipitação acumulada em cinco dias consecutivos (Rx5day)
    titulo_resumido: Máxima em cinco dias — Rx5day
    referencia_metodologica: Índice Rx5day do conjunto ETCCDI, documentado pelo Climdex.
    conceito: Maior soma de precipitação em qualquer janela móvel de cinco dias consecutivos do período.
    objetivo: Representar acumulação persistente de chuva em janela curta.
    interpretacao: Valor maior indica maior acumulação máxima em cinco dias. Não revela a distribuição interna da chuva nem a saturação real do solo.
    usos: [Monitorar extremos persistentes., Contextualizar inundações e movimentos de massa., Avaliar exposição em estudos de saúde.]
    limitacoes: [Janela fixa pode não coincidir com o tempo de resposta da bacia., Falhas dentro da janela afetam o máximo., Não substitui umidade do solo, vazão ou nível do rio.]
    metodo_calculo: "Para cada dia d do ano, somar PR de d−4 a d, exigindo cinco dias válidos. Carregar os quatro últimos dias do ano anterior. Atribuir a janela ao dia final d e selecionar a maior soma entre janelas cujo término pertence ao ano; agregar os máximos das células por área municipal."
    formula_calculo: 'Rx5day_p=\max_{d\in p}\left(\sum_{k=0}^{4}PR_{d-k}\right)'
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: Milímetros (mm).
    periodo_referencia: "Sem período-base para esta medida; exceções percentílicas são explicitadas na ficha."
