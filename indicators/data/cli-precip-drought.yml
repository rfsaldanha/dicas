  - <<: *precip_common
    codigo: CLI-SEC-01
    titulo_completo: "Índice Padronizado de Precipitação de três meses (SPI-3)"
    titulo_resumido: "Seca meteorológica — SPI-3"
    referencia_metodologica: "SPI recomendado pela OMM; escala fixada em três meses, distribuição gama de dois parâmetros e ajuste de máxima verossimilhança."
    conceito: "Anomalia padronizada do acumulado de precipitação de três meses da área municipal em relação à distribuição do mesmo trimestre final na base."
    objetivo: Comparar déficit ou excesso de precipitação entre períodos, escalas temporais e climas distintos.
    interpretacao: SPI igual a zero representa condição próxima da mediana ajustada; valores negativos indicam déficit e positivos, excesso. Na classificação usual, SPI ≤ −1 inicia uma condição de seca que persiste até retornar a valor positivo.
    usos: [Monitorar início, duração e intensidade de seca meteorológica., Comparar territórios em escala padronizada., Contextualizar impactos sobre água, alimento, saúde mental e serviços.]
    limitacoes: [Usa apenas precipitação., Requer série longa e relativamente consistente., Distribuição ajustada e tratamento de zeros influenciam o resultado., Escalas distintas representam processos distintos., Não mede diretamente seca hidrológica, agrícola ou impacto social.]
    metodo_calculo: "Usar a mesma máscara municipal de células válidas em toda a base e análise, com cobertura ≥90% da área. Obter a precipitação média diária municipal ponderada pela área; um mês exige todos os dias válidos. Somar o mês corrente e os dois anteriores. Para cada mês de término separadamente, usar os 30 acumulados completos de 1961–1990: q=proporção de zeros; ajustar gama de dois parâmetros por máxima verossimilhança apenas aos valores positivos. Calcular H(x)=q+(1−q)G(x) e SPI-3=Φ⁻¹(H(x)). Base sem 30 acumulados completos, menos de dois valores positivos distintos, variância nula ou falha de convergência resulta em ausente. H=0 ou 1 produz valor não finito, que deve ser sinalizado, sem truncamento arbitrário. Manter arquivo dos parâmetros por município e mês."
    formula_calculo: "\\begin{aligned}X_{m,t}&=P_{m,t}+P_{m,t-1}+P_{m,t-2}\\\\H_m(x)&=q_m+(1-q_m)G(x;\\alpha_m,\\theta_m)\\\\SPI3_{m,t}&=\\Phi^{-1}(H_m(X_{m,t}))\\end{aligned}"
    numerador: "Não se aplica."
    denominador: "Não se aplica; transformação probabilística, não razão de totais."
    unidade_medida: "Adimensional (desvios na escala normal padrão)."
