  - <<: *precip_common
    codigo: CLI-PRC-03
    titulo_completo: "Precipitação total em dias muito úmidos (R95p)"
    titulo_resumido: "Chuva em dias muito úmidos — R95p"
    referencia_metodologica: "ETCCDI/Climdex e nomenclatura Climpact: R95p é uma soma em mm; R95pTOT é a contribuição percentual em relação a PRCPTOT."
    conceito: Soma da precipitação nos dias úmidos do período em que o total diário excede o percentil 95 dos dias úmidos do período-base.
    objetivo: Quantificar o volume de chuva concentrado nos dias climatologicamente muito úmidos.
    interpretacao: Valor maior pode resultar de mais dias acima do percentil, de dias mais intensos ou de ambos; deve ser acompanhado por frequência e contribuição percentual.
    usos: [Monitorar concentração da chuva em extremos., Avaliar mudanças no regime de precipitação., Caracterizar exposições relacionadas a chuva intensa.]
    limitacoes: [Depende do período-base e do limiar de dia úmido., Soma não separa frequência e intensidade., Comparação exige implementação percentílica harmonizada.]
    metodo_calculo: "Selecionar todos os dias com PR≥1 mm na base 1961–1990. Estimar seu P95 pelo quantil tipo 8, sem janela calendário. Somar, no ano, toda a precipitação dos dias com PR estritamente maior que esse limiar. Para a série alternativa CHIRPS v3, usar 1981–2010 e identificá-la como outra série. Calcular por célula antes da média municipal."
    formula_calculo: "R95p_y=\\sum_{d\\in y}PR_d I(PR_d>P95_{wet})"
    numerador: Não se aplica; soma de precipitação qualificada.
    denominador: Não se aplica.
    unidade_medida: Milímetros (mm) por período.
    periodo_referencia: "ERA5-Land: 1961–1990; alternativa CHIRPS v3: 1981–2010, explicitamente distinta."
    limiar_referencia: Percentil 95 da precipitação em dias úmidos, definidos por PR ≥ 1 mm.
    url_persistente: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land"
    necessidade_processamento: "Reconstruir precipitação diária com a convenção de acumulação do produto; controlar falhas; calcular a estatística por célula e ponderar por área municipal, salvo SPI."
    analise_descritiva: "Publicar R95p em mm e, se calculada, sua contribuição percentual R95pTOT em coluna distinta, com a base explícita."
    referencias: ["[@climdex2024]", "[@climpact2026]"]
    fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly, total_precipitation; acumulado de 24 h às 00 UTC do dia seguinte"}, {"id": "chirps-v3", "papel": "CHIRPS v3 daily RNL final, série alternativa em grade"}, {"id": "inmet", "papel": "Pluviômetros para validação e séries observadas separadas"}]
