    granularidade: "Primeiro média diária da precipitação ponderada pela área municipal; depois somas mensais e trimestrais, ajuste e transformação do SPI. Não obter SPI municipal pela média de SPI das células."
    resolucao_temporal: "Mensal, a partir da soma dos três meses terminados no mês de referência."
    periodo_referencia: "1961–1990 para ERA5-Land; CHIRPS v3 exige outra série, com base 1982–2011. Incluir novembro/dezembro anteriores ao primeiro ano da base."
    limiar_referencia: "SPI≤−1: seca moderada ou mais intensa; ≤−1,5: severa; ≤−2: extrema. Valores positivos representam condição úmida."
    url_persistente: "https://library.wmo.int/idurl/4/39629"
    necessidade_processamento: "Agregação espacial da precipitação antes da transformação; somas mensais completas; ajuste gama estratificado por mês de término; armazenamento dos parâmetros e flags."
    analise_descritiva: Apresentar séries de SPI-1, SPI-3, SPI-6 ou SPI-12 conforme mecanismo, duração e intensidade dos episódios, área afetada e associação com indicadores sanitários.
