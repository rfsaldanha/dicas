common: &heatwave_common
  tema: Temperatura e condições térmicas
  capitulo: chapters/part-2/07-temperatura-condicoes-termicas.qmd
  capitulo_fichas: chapters/part-4/17-fichas-temperatura-condicoes-termicas.qmd
  referencia_metodologica: Estrutura multiaspecto de ondas de calor proposta por Perkins e Alexander (2013), aplicada a episódios definidos por temperatura máxima, temperatura mínima ou EHF.
  dimensoes: [perigo, exposição]
  variaveis_categorias_analise: Definição térmica; estação quente; local; estação meteorológica ou célula; faixa etária e outros estratos apenas quando combinados com dados populacionais ou de saúde.
  granularidade: Estação ou célula de grade; sínteses territoriais exigem regra explícita de agregação.
  unidade_territorial: Estação meteorológica, célula de grade ou território derivado.
  resolucao_espacial_original: A da fonte meteorológica; não atribuir automaticamente um ponto a todo o município.
  resolucao_temporal: Entrada diária; saída por estação quente ou ano, preservando o calendário do hemisfério e a regra para episódios que cruzam limites.
  periodo_referencia: Período-base usado para estimar percentis e normalizar magnitudes; deve ser fixo e comum às comparações.
  limiar_referencia: Pelo menos três dias consecutivos acima do percentil 90 de TX, acima do percentil 90 de TN ou com EHF positivo, conforme a definição escolhida; não misturar definições numa mesma série.
  fontes_dados:
    - id: inmet
      papel: observações diárias de temperatura em estação
    - id: era5-land
      papel: reanálise em grade quando validada para a finalidade
  responsabilidade_gerencial: Serviço meteorológico ou climático produtor e instituição de saúde usuária devem pactuar definição, calendário, atualização e interpretação.
  cobertura_geografica: Determinada pela rede ou produto; a cobertura analítica depende também da completude da série.
  periodo_disponivel: O da fonte selecionada, com extensão suficiente para período-base e análise.
  periodicidade_atualizacao: Sazonal ou anual para monitoramento; versões operacionais podem ser atualizadas diariamente com previsão, sob protocolo distinto.
  forma_acesso: Cálculo reprodutível sobre séries diárias de temperatura máxima, mínima ou média.
  url_persistente: https://doi.org/10.1175/JCLI-D-12-00383.1
  formatos: Tabela diária por estação ou arquivo multidimensional por célula, com códigos de qualidade e metadados.
  disponibilidade: [requer processamento climatológico]
  necessidade_processamento: Controle de qualidade, cálculo do limiar, detecção de sequências, identificação de eventos e síntese do aspecto específico.
  qualidade_incerteza: Relatar fonte, falhas que criem ou interrompam sequências, período-base, algoritmo de percentil, definição da estação, viés de grades e sensibilidade à definição.
  comparabilidade: Exige a mesma variável térmica, limiar, período-base, duração mínima, estação, calendário, completude e tratamento de eventos de fronteira.
  relacao_saude: Ondas de calor estão associadas a aumento de morbidade, mortalidade e demanda de serviços. A magnitude da associação varia com definição, clima, população, desfecho e adaptação.
  defasagens_temporais: Para efeitos agudos, conservar datas dos eventos e analisar defasagens segundo o desfecho; a síntese sazonal não substitui a exposição diária.
  aplicacao_gestao: Caracterizar episódios, comparar temporadas, apoiar planejamento calor–saúde e avaliar retrospectivamente alertas e pressão assistencial.
  notas: A estrutura multiaspecto separa propriedades que não devem ser usadas como sinônimos. A definição do episódio precede o cálculo de qualquer aspecto.
  referencias: ["[@perkins2013heatwaves]", "[@nawaro2023]", "[@wmoWho2015heat]"]

indicators:
  - <<: *heatwave_common
    codigo: CLI-CAL-02
    titulo_completo: "Ocorrência de ondas de calor TX90 e proporção da área municipal atingida"
    titulo_resumido: "Ocorrência de ondas TX90"
    conceito: Indicador binário de presença de pelo menos um episódio de onda de calor no local e período, segundo uma definição térmica publicada e integralmente declarada.
    objetivo: Identificar temporadas, meses ou territórios com ao menos um episódio qualificado.
    interpretacao: "Na célula indica presença de evento. No município expressa a parcela da área que teve ao menos um evento, mesmo que as datas sejam diferentes."
    usos: [Delimitar períodos expostos em estudos de saúde., Comparar proporção de territórios com ocorrência., Apoiar avaliação de temporadas e cobertura de alertas.]
    limitacoes: [Reduz múltiplos aspectos a presença/ausência., É sensível à definição e à falha de dados., Não expressa carga populacional.]
    metodo_calculo: "Detectar os eventos TX90 pelo protocolo desta família. Na célula, atribuir 1 se HWN ≥ 1, ou 0 em temporada válida sem evento. No município, calcular 100 vezes a soma das áreas de células com ocorrência, dividida pela área válida; exigir cobertura ≥90%."
    formula_calculo: "O_g=I(HWN_g\\geq1),\\qquad O_m=100\\frac{\\sum_g a_{gm}O_g}{\\sum_g a_{gm}}"
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: "0/1 por célula; % de área na síntese municipal."
    analise_descritiva: Apresentar ocorrência com HWN, HWF e intensidade para evitar que temporadas muito diferentes pareçam iguais.
    fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly, variável 2m_temperature; extrair TX/TN conforme o método da ficha"}, {"id": "inmet", "papel": "Validação local e séries observadas separadas da reanálise"}]
    resolucao_espacial_original: "ERA5-Land: grade de 0,1°; malha municipal IBGE 2022 como recorte fixo."
    unidade_territorial: "Célula de grade; município como síntese ponderada pela área de interseção."
    granularidade: "Calcular o indicador em cada célula antes da média municipal ponderada pela área; manter produto, célula, ano e código IBGE de sete dígitos."
    cobertura_geografica: "Todos os municípios brasileiros no domínio da grade. Não representa diretamente a exposição individual ou o microclima de cada bairro."
    periodo_disponivel: "1950–presente; publicar anos completos até 2025 e identificar 2026 como parcial. A janela inicial utilizável depende dos antecedentes exigidos pela medida."
    periodo_referencia: "1961–1990; P90 de TX por dia do calendário em janela centrada de 15 dias, quantil tipo 8."
    resolucao_temporal: "Estação quente: novembro–março no hemisfério sul; maio–setembro no norte. Identificar a temporada pelas datas de início e fim e pela latitude da célula."
    periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
    forma_acesso: "API do Climate Data Store, dataset reanalysis-era5-land, product_type=reanalysis, todas as 24 horas UTC; download NetCDF ou GRIB por mês e recorte espacial."
    url_persistente: "https://github.com/ARCCSS-extremes/climpact2/blob/master/ancillary/climpact2.etsci-functions.r"
    formatos: "NetCDF ou GRIB de entrada; CSV/Parquet para séries municipais."
    necessidade_processamento: "Converter kelvin para °C; obter TX e TN como máximo e mínimo das 24 temperaturas horárias válidas de cada dia UTC. Calcular a medida por célula e, depois, sua média municipal por área. Esta TX não é a máxima instantânea de termômetro."
    qualidade_incerteza: "Exigir 24 horas para TX diário, ≥90% dos dados da base e, na estação quente, no máximo 15 dias ausentes e no máximo três em cada mês que a compõe. Ausência que impeça decidir a continuidade de um evento de fronteira invalida a temporada. Exigir ≥90% de área municipal meteorologicamente válida, antes de avaliar se houve onda. Estas regras de cobertura são escolhas editoriais. Ausência de onda em célula válida é não aplicação para HWD/HWMD/HWM/HWA, não falha meteorológica."
    comparabilidade: "Fixar versão, calendário UTC, período-base e limites municipais de 2022. Não emendar estação e reanálise. Médias municipais de contagens podem ser fracionárias e não contam episódios sincrônicos do município."
    notas: "Reproduzir as regras de fronteira e calendário de climdex.hw/Climpact2, inclusive remoção de 29/02, eventos que alcançam a estação e extensão de até 14 dias após seu término. Baixar também os 90 dias anteriores e posteriores; arquivar o hash da implementação usada. Sem evento: HWN=HWF=0; HWD, HWMD, HWM e HWA ausentes por não aplicação. As estatísticas municipais são médias por área, exceto ocorrência (percentual de área)."
    protocolo_versao: "2026-10-03"
    situacao_calculo: "abertos"
    disponibilidade: ["Calculável com dados abertos"]
    dependencia_dados_locais: "Opcional para validação"
    automacao: "Condicionada"
    condicoes_automacao: "Cadastro gratuito e credencial CDS; download das variáveis e processamento conforme a ficha."
    evidencia_verificacao: "Documentação verificada"
    detalhe_verificacao: "Produto e método documentados; série municipal completa ainda não produzida."
    referencia_metodologica: "Perkins e Alexander (2013), família TX90, com implementação de referência climdex.hw do Climpact2. HWMD é uma medida derivada de HWF/HWN."
    limiar_referencia: "TX > P90 durante pelo menos três dias consecutivos. Não misturar TX90, TN90 e EHF."
    referencias: ["[@perkins2013heatwaves]", "[@climpact2026]"]




