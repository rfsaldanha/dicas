common: &heatwave_common
  tema: Temperatura e condições térmicas
  capitulo: chapters/part-2/05-temperatura-condicoes-termicas.qmd
  referencia_metodologica: Estrutura multiaspecto de ondas de calor proposta por Perkins e Alexander (2013), aplicada a episódios definidos por temperatura máxima, temperatura mínima ou EHF.
  dimensoes: [perigo, exposição]
  variaveis_categorias_analise: Definição térmica; estação quente; local; estação meteorológica ou célula; faixa etária e outros estratos apenas quando combinados com dados populacionais ou de saúde.
  granularidade: Estação ou célula de grade; sínteses territoriais exigem regra explícita de agregação.
  unidade_territorial: Estação meteorológica, célula de grade ou território derivado.
  resolucao_espacial_original: A da fonte meteorológica; não atribuir automaticamente um ponto a todo o município.
  resolucao_temporal: Entrada diária; saída por estação quente ou ano, preservando o calendário do hemisfério e a regra para episódios que cruzam limites.
  periodo_referencia: Período-base usado para estimar percentis e normalizar magnitudes; deve ser fixo e comum às comparações.
  limiar_referencia: Pelo menos três dias consecutivos acima do percentil 90 de TX, acima do percentil 90 de TN ou com EHF positivo, conforme a definição escolhida; não misturar definições numa mesma série.
  fontes_dados:
    - id: inmet
      papel: observações diárias de temperatura em estação
    - id: era5-land
      papel: reanálise em grade quando validada para a finalidade
  responsabilidade_gerencial: Serviço meteorológico ou climático produtor e instituição de saúde usuária devem pactuar definição, calendário, atualização e interpretação.
  cobertura_geografica: Determinada pela rede ou produto; a cobertura analítica depende também da completude da série.
  periodo_disponivel: O da fonte selecionada, com extensão suficiente para período-base e análise.
  periodicidade_atualizacao: Sazonal ou anual para monitoramento; versões operacionais podem ser atualizadas diariamente com previsão, sob protocolo distinto.
  forma_acesso: Cálculo reprodutível sobre séries diárias de temperatura máxima, mínima ou média.
  url_persistente: https://doi.org/10.1175/JCLI-D-12-00383.1
  formatos: Tabela diária por estação ou arquivo multidimensional por célula, com códigos de qualidade e metadados.
  disponibilidade: [requer processamento climatológico]
  necessidade_processamento: Controle de qualidade, cálculo do limiar, detecção de sequências, identificação de eventos e síntese do aspecto específico.
  qualidade_incerteza: Relatar fonte, falhas que criem ou interrompam sequências, período-base, algoritmo de percentil, definição da estação, viés de grades e sensibilidade à definição.
  comparabilidade: Exige a mesma variável térmica, limiar, período-base, duração mínima, estação, calendário, completude e tratamento de eventos de fronteira.
  relacao_saude: Ondas de calor estão associadas a aumento de morbidade, mortalidade e demanda de serviços. A magnitude da associação varia com definição, clima, população, desfecho e adaptação.
  defasagens_temporais: Para efeitos agudos, conservar datas dos eventos e analisar defasagens segundo o desfecho; a síntese sazonal não substitui a exposição diária.
  aplicacao_gestao: Caracterizar episódios, comparar temporadas, apoiar planejamento calor–saúde e avaliar retrospectivamente alertas e pressão assistencial.
  notas: A estrutura multiaspecto separa propriedades que não devem ser usadas como sinônimos. A definição do episódio precede o cálculo de qualquer aspecto.
  referencias: ["[@perkins2013heatwaves]", "[@nawaro2023]", "[@wmoWho2015heat]"]

indicators:
  - <<: *heatwave_common
    codigo: CLI-CAL-02
    titulo_completo: Ocorrência de onda de calor
    titulo_resumido: Ocorrência de onda de calor
    conceito: Indicador binário de presença de pelo menos um episódio de onda de calor no local e período, segundo uma definição térmica publicada e integralmente declarada.
    objetivo: Identificar temporadas, meses ou territórios com ao menos um episódio qualificado.
    interpretacao: Valor 1 indica uma ou mais ondas; valor 0 indica que nenhuma sequência atendeu à definição. O indicador não informa quantas ondas ocorreram nem sua duração ou intensidade.
    usos: [Delimitar períodos expostos em estudos de saúde., Comparar proporção de territórios com ocorrência., Apoiar avaliação de temporadas e cobertura de alertas.]
    limitacoes: [Reduz múltiplos aspectos a presença/ausência., É sensível à definição e à falha de dados., Não expressa carga populacional.]
    metodo_calculo: Detectar episódios conforme variável, limiar e duração definidos. Atribuir 1 quando o número de episódios no período for maior ou igual a um e 0 nos demais casos.
    formula_calculo: 'O_j = I(HWN_j \geq 1)'
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: Indicador binário (0 ou 1); em agregações, percentual de unidades com ocorrência.
    analise_descritiva: Apresentar ocorrência com HWN, HWF e intensidade para evitar que temporadas muito diferentes pareçam iguais.

  - <<: *heatwave_common
    codigo: CLI-CAL-03
    titulo_completo: Número de ondas de calor (HWN)
    titulo_resumido: Número de ondas — HWN
    conceito: Número de episódios distintos de onda de calor identificados no local e período.
    objetivo: Quantificar a frequência de episódios, preservando a separação entre sequências.
    interpretacao: Valor maior indica mais episódios; não implica maior número total de dias nem maior intensidade.
    usos: [Comparar frequência entre temporadas., Avaliar recorrência de ativações operacionais., Descrever exposição repetida em análises de saúde.]
    limitacoes: [Uma falha pode dividir um episódio em dois., Eventos de fronteira exigem regra de atribuição., Não distingue ondas curtas e longas.]
    metodo_calculo: Identificar todas as sequências que atendem à definição e contar seus inícios dentro da estação ou período, aplicando regra documentada para eventos que cruzam fronteiras.
    formula_calculo: 'HWN_j = \sum_{e \in j} 1(e \text{ atende à definição})'
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: Episódios por período.
    analise_descritiva: Mostrar HWN junto da distribuição das durações, HWF, HWM e HWA.

  - <<: *heatwave_common
    codigo: CLI-CAL-04
    titulo_completo: Número total de dias em ondas de calor ou frequência de ondas de calor (HWF)
    titulo_resumido: Dias em ondas — HWF
    conceito: Número total de dias do período que pertencem a qualquer episódio de onda de calor.
    objetivo: Quantificar a carga temporal total de dias sob condições de onda de calor.
    interpretacao: Valor maior indica mais dias participantes, independentemente de estarem concentrados em uma ou várias ondas.
    usos: [Medir carga sazonal de exposição., Calcular pessoas-dia expostas., Comparar temporadas com a mesma definição.]
    limitacoes: [Não informa número de eventos., Pode ser igual para uma onda longa e várias curtas., Depende da regra para dias e eventos de fronteira.]
    metodo_calculo: Após detectar episódios, marcar cada dia participante uma única vez e somar as marcas no período.
    formula_calculo: 'HWF_j = \sum_{d \in j} I(d \text{ pertence a uma onda})'
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: Dias por período.
    analise_descritiva: Apresentar HWF com HWN e HWD; ao combinar com população, identificar a nova medida como exposição populacional.

  - <<: *heatwave_common
    codigo: CLI-CAL-05
    titulo_completo: Duração máxima das ondas de calor (HWD)
    titulo_resumido: Duração máxima — HWD
    conceito: Maior número de dias consecutivos entre os episódios de onda de calor identificados no período.
    objetivo: Representar a persistência do episódio mais longo.
    interpretacao: Valor maior indica uma sequência máxima mais longa; não informa duração das demais ondas nem intensidade.
    usos: [Avaliar capacidade de resposta a episódios prolongados., Estudar efeitos cumulativos e continuidade assistencial., Comparar a maior persistência entre temporadas.]
    limitacoes: [Ignora todos os eventos exceto o mais longo., Falhas quebram sequências., Temporadas sem onda exigem convenção explícita.]
    metodo_calculo: Calcular a duração em dias de cada episódio e selecionar o máximo; atribuir zero quando não houver episódio, distinguindo zero de dado ausente.
    formula_calculo: 'HWD_j = \max_{e \in j}(D_e)'
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: Dias.
    analise_descritiva: Apresentar o evento correspondente, datas, HWM/HWA e distribuição das demais durações.

  - <<: *heatwave_common
    codigo: CLI-CAL-06
    titulo_completo: Duração média das ondas de calor (HWMD)
    titulo_resumido: Duração média — HWMD
    conceito: Média aritmética da duração dos episódios de onda de calor no período.
    objetivo: Resumir a duração típica dos episódios identificados.
    interpretacao: Valor maior indica episódios em média mais longos. A média pode ocultar distribuição assimétrica.
    usos: [Comparar duração típica entre temporadas., Complementar HWD e HWN., Planejar duração média de ações quando validado operacionalmente.]
    limitacoes: [Indefinido quando HWN é zero., Instável com poucos episódios., Não mostra extremos nem intensidade.]
    metodo_calculo: Somar as durações dos episódios e dividir por HWN. Quando não houver episódios, apresentar “não se aplica” e HWN igual a zero, não duração zero.
    formula_calculo: 'HWMD_j = \frac{\sum_{e=1}^{HWN_j}D_e}{HWN_j}, \quad HWN_j>0'
    numerador: Soma da duração de todos os episódios.
    denominador: Número de ondas de calor (HWN).
    unidade_medida: Dias por episódio.
    analise_descritiva: Apresentar média, mediana, intervalo e número de eventos; não divulgar média sem HWN.

  - <<: *heatwave_common
    codigo: CLI-CAL-07
    titulo_completo: Magnitude ou intensidade média das ondas de calor (HWM/HWI)
    titulo_resumido: Magnitude média — HWM
    conceito: Média da medida térmica ou da magnitude normalizada nos dias pertencentes às ondas de calor, segundo a estrutura e a definição adotadas.
    objetivo: Quantificar o nível médio do calor durante os episódios.
    interpretacao: Valor maior indica maior magnitude média segundo a escala escolhida. Temperatura absoluta, excesso ao limiar e magnitude normalizada não são intercambiáveis.
    usos: [Comparar intensidade média de temporadas., Caracterizar exposição térmica nos dias de onda., Relacionar gradiente de intensidade a desfechos.]
    limitacoes: [O nome HWM/HWI é usado com fórmulas distintas., A média atenua picos., Unidade depende da medida de magnitude.]
    metodo_calculo: Definir a magnitude diária — temperatura, excesso ao limiar, EHF ou escala normalizada — e calcular a média em todos os dias participantes, mantendo a especificação original.
    formula_calculo: 'HWM_j = \frac{1}{HWF_j}\sum_{d \in HW_j} M_d'
    numerador: Soma das magnitudes diárias nos dias de onda.
    denominador: Número total de dias em ondas (HWF).
    unidade_medida: A da magnitude diária; frequentemente °C, °C acima do limiar ou unidade normalizada.
    analise_descritiva: Declarar a variante de HWM/HWI, apresentar distribuição diária e nunca comparar unidades diferentes.

  - <<: *heatwave_common
    codigo: CLI-CAL-08
    titulo_completo: Amplitude ou intensidade máxima das ondas de calor (HWA)
    titulo_resumido: Amplitude máxima — HWA
    conceito: Maior magnitude diária observada no episódio mais intenso ou, conforme a especificação, em qualquer dia de onda do período.
    objetivo: Representar o pico térmico das ondas de calor.
    interpretacao: Valor maior indica pico mais intenso; não representa persistência nem carga acumulada.
    usos: [Caracterizar o pior momento da temporada., Avaliar demanda de pico e comunicação., Comparar máximos sob método comum.]
    limitacoes: [Muito sensível a erro isolado., Há variantes quanto ao evento de referência., Não descreve duração.]
    metodo_calculo: Calcular magnitude diária segundo a definição e selecionar o máximo, declarando se HWA corresponde ao maior dia de qualquer onda ou ao pico da onda de maior magnitude média.
    formula_calculo: 'HWA_j = \max_{d \in HW_j}(M_d)'
    numerador: Não se aplica.
    denominador: Não se aplica.
    unidade_medida: A da magnitude diária.
    analise_descritiva: Informar data, evento, qualidade do dado, HWD e HWM; validar o pico antes da publicação.
