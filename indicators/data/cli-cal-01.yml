codigo: CLI-CAL-01
titulo_completo: Ocorrência de onda de calor
titulo_resumido: Onda de calor
tema: Temperatura e condições térmicas
conceito: Episódio com temperatura persistentemente elevada em relação a um limiar e durante uma duração mínima previamente definidos.
objetivo: Identificar períodos de calor persistente relevantes para vigilância, preparação dos serviços e comunicação de risco.
interpretacao: A ocorrência indica que o limiar térmico adotado foi superado pelo número mínimo de dias consecutivos. Resultados dependem integralmente da definição operacional.
usos:
  - Ativar rotinas de monitoramento e preparação.
  - Comparar frequência, duração e intensidade de episódios ao longo do tempo.
  - Delimitar janelas de exposição em análises de saúde.
limitacoes:
  - Não existe uma única definição universal de onda de calor.
  - Limiares absolutos e relativos respondem a perguntas diferentes.
  - A exposição real também depende de moradia, trabalho, mobilidade, umidade e acesso a proteção.
dimensoes:
  - perigo
  - exposição
metodo_calculo: Aplicar um limiar térmico previamente documentado a uma série diária e identificar sequências que atendam à duração mínima. Relatar separadamente ocorrência, duração e intensidade.
formula_calculo: 'I_d = 1(T_d > L); \quad OC = 1\left(\sum_{j=d}^{d+k-1} I_j = k\right)'
numerador: Número de episódios, dias em episódio ou população exposta, conforme a medida derivada.
denominador: Não se aplica à ocorrência; pode ser população residente nas medidas de exposição.
unidade_medida: Episódio, dia, grau-dia ou pessoa, conforme a medida apresentada.
variaveis_categorias_analise: Tipo de limiar; duração; intensidade; estação; território; grupos populacionais.
granularidade: Ponto de estação ou célula de grade; agregações territoriais dependem da regra de exposição.
unidade_territorial: Ponto, célula de grade ou território agregado.
resolucao_espacial_original: Depende da fonte térmica utilizada.
resolucao_temporal: Diária para detecção; síntese por evento, mês, estação ou ano.
periodo_referencia: Declarar o período climatológico quando o limiar for percentílico.
limiar_referencia: Deve ser escolhido e justificado para o contexto; não usar um valor universal sem validação.
fontes_dados:
  - id: inmet
    papel: observação primária
  - id: era5-land
    papel: fonte secundária modelada
responsabilidade_gerencial: A definir no protocolo operacional pela instituição que adotar o indicador.
cobertura_geografica: Depende da fonte e da rede de monitoramento.
