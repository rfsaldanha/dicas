formatos: Depende da fonte.
disponibilidade:
  - requer modelagem
necessidade_processamento: Requer controle de qualidade, definição de limiar, detecção de sequências e, em análises territoriais, regras de agregação espacial.
qualidade_incerteza: A incerteza provém da fonte térmica, da escolha do limiar, do período de referência, da cobertura espacial e da classificação da exposição.
comparabilidade: Só comparar estimativas produzidas com a mesma definição ou apresentar análise de sensibilidade entre definições.
relacao_saude: Ondas de calor podem ser usadas como janelas de exposição; a atribuição de efeitos exige desenho epidemiológico e controle de confundimento.
defasagens_temporais: Avaliar efeitos no mesmo dia e defasagens curtas conforme o desfecho e a literatura específica.
aplicacao_gestao: Apoiar níveis de alerta, planos de contingência, comunicação direcionada e preparação assistencial.
notas: A ficha qualifica a definição operacional; intensidade, duração e população exposta devem ser registradas como medidas relacionadas, não confundidas.
