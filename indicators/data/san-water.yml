common: &wash_common
  tema: Água, saneamento e qualidade ambiental
  capitulo: chapters/part-2/10-agua-saneamento-qualidade-ambiental.qmd
  capitulo_fichas: chapters/part-4/20-fichas-agua-saneamento-qualidade-ambiental.qmd
  dimensoes: [exposição, vulnerabilidade, resposta]
  responsabilidade_gerencial: Titulares e prestadores de saneamento, autoridades reguladoras e setor saúde, conforme a competência de cada indicador.
  qualidade_incerteza: Relatar fonte, cobertura, população de referência, dados ausentes, plano amostral, qualidade laboratorial, regras de classificação e revisão.
  comparabilidade: Manter definição de serviço, população, forma de abastecimento, ponto de coleta, parâmetro, padrão vigente, período e método.
  relacao_saude: Água segura, saneamento e higiene reduzem exposição a patógenos e substâncias químicas e sustentam alimentação, cuidado, dignidade e funcionamento dos serviços de saúde.
  defasagens_temporais: Distinguir condição do serviço, resultado de amostra e desfecho; surtos e agravos podem ocorrer com defasagens e múltiplas vias.
  aplicacao_gestao: Identificar lacunas de serviço e qualidade, priorizar inspeção e resposta, acompanhar desigualdades e avaliar políticas.
  notas: Indicadores de cobertura, qualidade da água e desempenho da vigilância respondem a perguntas diferentes e devem ser apresentados em conjunto.

indicators:
  - <<: *wash_common
    codigo: SAN-AGU-01
    titulo_completo: Proporção da população que utiliza serviços de água potável geridos de forma segura (ODS 6.1.1)
    titulo_resumido: Água gerida de forma segura — ODS 6.1.1
    referencia_metodologica: Indicador ODS 6.1.1, sob custódia do Programa Conjunto OMS/UNICEF de Monitoramento de Água, Saneamento e Higiene.
    conceito: Proporção da população que usa fonte melhorada de água localizada no domicílio ou terreno, disponível quando necessária e livre de contaminação fecal e química prioritária.
    objetivo: Monitorar acesso universal e equitativo a serviço de água que reúna acessibilidade, disponibilidade e qualidade.
    interpretacao: "Estimativa agregada pela menor cobertura dos três componentes JMP. Não é a proporção diretamente observada da interseção dos domicílios que cumprem simultaneamente os três critérios."
    usos: [Monitorar o ODS 6.1.1., Comparar desigualdades urbano-rurais e sociais., Planejar expansão e melhoria do abastecimento.]
    limitacoes: [Nem todos os países dispõem de todos os componentes., A estimativa nacional pode ocultar intermitência local., Qualidade costuma usar E. coli e químicos prioritários, não todo o padrão de potabilidade., Fonte principal declarada não mede consumo individual.]
    metodo_calculo: "Para cada domicílio h, registrar peso wh, residentes nh, tipo de fonte, localização, insuficiência de água nos últimos 30 dias, E. coli em 100 mL, arsênio em µg/L e fluoreto em mg/L. Fontes melhoradas incluem rede, poço tubular/perfurado, poço escavado protegido, nascente protegida, chuva e água envasada/entregue, segundo a classificação JMP. Calcular três proporções sobre a mesma população total ponderada: (1) fonte melhorada no domicílio ou terreno; (2) fonte melhorada disponível quando necessária, sem episódio declarado de quantidade insuficiente no período perguntado; (3) fonte melhorada sem E. coli em 100 mL e com arsênio≤10 µg/L e fluoreto≤1,5 mg/L em amostragem representativa. Para cada componente j, pj=sum(wh×nh×Ihj)/sum(wh×nh). O indicador municipal é 100×min(p1,p2,p3). Este protocolo exige os três componentes completos e comparáveis; se algum não puder ser estimado, publicar ausente e apresentar somente os componentes disponíveis. Não substituir p3 pela fração de amostras de rotina conformes do Sisagua."
    formula_calculo: "p_j=\\frac{\\sum_h w_h n_h I_{h,j}}{\\sum_h w_h n_h},\\qquad W_m=100\\min(p_1,p_2,p_3)"
    numerador: "Em cada componente, população ponderada que usa fonte melhorada e cumpre o requisito; o resultado final é o mínimo das coberturas, não uma contagem de interseção."
    denominador: "A mesma população municipal total ponderada nos três componentes."
    unidade_medida: Percentual (%).
    variaveis_categorias_analise: "Município, rodada, domicílio, peso, residentes, fonte, localização, insuficiência nos últimos 30 dias, E. coli, arsênio e fluoreto."
    granularidade: "Domicílio/residente em levantamento representativo do município, com pesos amostrais e ano explícitos."
    unidade_territorial: "Município no limite territorial vigente no levantamento; não presumir representatividade municipal de pesquisa nacional."
    resolucao_espacial_original: "Domicílio e área de atendimento vinculados ao município."
    resolucao_temporal: "Rodada de levantamento; publicar série somente nos anos efetivamente observados."
    periodo_referencia: "Rodada do levantamento; disponibilidade referida aos últimos 30 dias; qualidade e acesso medidos no período da rodada."
    limiar_referencia: "Fonte melhorada no local; disponibilidade quando necessária; E. coli ausente/100 mL, arsênio≤10 µg/L e fluoreto≤1,5 mg/L. Os três componentes são obrigatórios neste protocolo municipal."
    fontes_dados: [{"id": "jmp", "papel": "Definição e instrumentos de monitoramento; não fornece automaticamente microdados representativos de cada município"}, {"id": "ibge", "papel": "População municipal e desenho amostral; o Censo isolado não contém todos os componentes"}]
    cobertura_geografica: "Somente municípios com levantamento representativo e componentes compatíveis no tempo e na população-alvo."
    periodo_disponivel: "A partir dos levantamentos locais com os componentes requeridos. Não há série municipal nacional completa demonstrada para esta definição."
    periodicidade_atualizacao: "Por levantamento local; não interpolar automaticamente entre rodadas."
    forma_acesso: "Exportação tabular de levantamento domiciliar e registros locais vinculados, com dicionário, período, pesos e município. Microdados identificáveis não devem integrar a base pública de indicadores."
    url_persistente: "https://unstats.un.org/sdgs/metadata/files/Metadata-06-01-01.pdf"
    formatos: "CSV/Parquet local com identificadores pseudonimizados, peso domiciliar, residentes e variáveis especificadas no método; saída pública agregada."
    disponibilidade: ["Depende de dados locais"]
    necessidade_processamento: "Validar componentes, pesos e vinculação entre domicílios, população e serviços; calcular estimativa por município e rodada com incerteza."
    analise_descritiva: Mostrar valor total, componentes, urbano/rural, grupos sociais, fonte dos dados e intervalo entre anos observados e estimados.
    referencias: ["[@un2026sdg611]", "[@jmp2026water]"]
    qualidade_incerteza: "Sem variável indispensável, sem peso amostral quando exigido ou sem representatividade municipal, o indicador é ausente. Publicar tamanho amostral, não resposta e intervalo de confiança pelo desenho da pesquisa; não tratar desconhecido como não atendimento."
    comparabilidade: "Mesma população-alvo, instrumento, definição de serviço e período; preservar separadamente as rodadas de coleta. A metodologia internacional orienta a definição, mas não cria os dados municipais inexistentes."
    notas: "Manter como indicador dependente de dados locais. Indicadores de rede do SINISA e conformidade de amostras do Sisagua são medidas distintas, não substituições equivalentes dos ODS."
    protocolo_versao: "2026-10-03"
    situacao_calculo: "locais"
    dependencia_dados_locais: "Necessária"
    automacao: "Não demonstrada"
    condicoes_automacao: "Levantamento local representativo contendo todas as variáveis do método; a fórmula está definida, mas não foi demonstrada uma base aberta municipal com esses componentes."
    evidencia_verificacao: "Documentação verificada"
    detalhe_verificacao: "Produto e método documentados; série municipal completa ainda não produzida."


  - <<: *wash_common
    codigo: SAN-ESG-01
    titulo_completo: Proporção da população que utiliza serviços de saneamento geridos de forma segura (ODS 6.2.1a)
    titulo_resumido: Saneamento gerido de forma segura — ODS 6.2.1a
    referencia_metodologica: Componente de saneamento do indicador ODS 6.2.1, sob custódia do Programa Conjunto OMS/UNICEF.
    conceito: Proporção da população que usa instalação sanitária melhorada não compartilhada, da qual excretas são tratadas e dispostas com segurança no local ou removidas e tratadas fora dele.
    objetivo: Monitorar acesso a saneamento que inclua contenção, esvaziamento, transporte e tratamento seguro das excretas.
    interpretacao: "Conexão à rede não basta: o indicador considera o destino e tratamento. Soluções no local podem qualificar-se quando manejadas com segurança."
    usos: [Monitorar ODS 6.2.1a., Planejar coleta e tratamento de esgoto e lodo fecal., Avaliar desigualdades e risco sanitário.]
    limitacoes: [Dados sobre toda a cadeia são incompletos., Taxas de tratamento podem ser estimadas., Não mede diretamente exposição em cada domicílio., Instalação compartilhada é excluída do nível básico no método global.]
    metodo_calculo: "No levantamento municipal, registrar peso domiciliar wh, residentes nh, tipo de instalação, compartilhamento com outros domicílios e destino verificado das excretas. Considerar instalações melhoradas não compartilhadas. Classificar cada domicílio em exatamente uma categoria segura: excretas tratadas/dispostas com segurança in situ; excretas transportadas pela rede e efetivamente tratadas; ou lodo removido e efetivamente tratado fora do local. A classificação exige evidência de toda a cadeia segundo JMP, incluindo tratamento/disposição final, não apenas ligação à rede ou existência de fossa. Somar wh×nh em cada uma das três categorias mutuamente exclusivas, dividir pela população total ponderada e multiplicar por 100. Categorias de destino desconhecido impedem a estimativa completa; publicar os componentes conhecidos e a lacuna, sem convertê-la em zero."
    formula_calculo: "S_m=100\\frac{\\sum_h w_hn_h(I_{in\\ situ,h}+I_{rede,h}+I_{lodo,h})}{\\sum_h w_hn_h}"
    numerador: População que usa instalação melhorada não compartilhada com excretas manejadas com segurança.
    denominador: População total.
    unidade_medida: Percentual (%).
