  - <<: *wash_common
    codigo: SAN-AGU-02
    titulo_completo: "Proporção de amostras de rotina de SAA na distribuição com ausência de E. coli"
    titulo_resumido: Amostras sem E. coli
    referencia_metodologica: Indicador de qualidade bacteriológica utilizado no Sisagua e no Vigiagua, conforme a norma brasileira de potabilidade.
    conceito: Percentual de amostras válidas de água para consumo humano nas quais E. coli está ausente em 100 mL, no universo e período definidos.
    objetivo: Detectar evidência de contaminação fecal e acompanhar a conformidade microbiológica da água distribuída ou consumida.
    interpretacao: Valor próximo de 100% indica maior proporção de resultados conformes. Uma amostra positiva exige avaliação e ação conforme ponto, forma de abastecimento e protocolo; a proporção não elimina o significado de eventos isolados.
    usos: [Vigilância da qualidade da água., Identificação de formas de abastecimento e pontos críticos., Investigação de surtos e avaliação de intervenções.]
    limitacoes: [Resultado representa local e momento da coleta., Plano de amostragem pode não cobrir áreas vulneráveis., Ausência do indicador não garante ausência de todos os patógenos., Agregar controle e vigilância pode ocultar diferenças.]
    metodo_calculo: "Aplicar o recorte e a desduplicação descritos nesta ficha. Selecionar PARAMETRO correspondente a Escherichia coli no dicionário. Contar como conforme somente resultado qualitativo de ausência em 100 mL; presença é não conforme. Valores quantitativos somente entram quando unidade, método e volume de 100 mL permitirem conversão inequívoca a presença/ausência; resultado ambíguo ou sem volume sai do denominador e tem contagem separada. Calcular 100×n_ausentes/n_resultados_classificáveis, por município e ano de coleta. Sem resultado classificável, ausente."
    formula_calculo: 'P_{E.coli\ ausente}=100\times\frac{N_{amostras\ sem\ E.coli}}{N_{amostras\ válidas\ analisadas}}'
    numerador: "Amostras classificáveis sem E. coli em 100 mL no recorte."
    denominador: "Amostras com resultado de E. coli classificável no mesmo recorte."
    unidade_medida: Percentual (%).
    variaveis_categorias_analise: "Campos de identificação, DT_COLETA, PARAMETRO, RESULTADO, método/volume e filtros de amostragem."
    granularidade: "Resultado de parâmetro por amostra; soma de numeradores e denominadores por município e ano de DT_COLETA."
    unidade_territorial: "Município da coleta, com código IBGE de sete dígitos após correspondência oficial."
    resolucao_espacial_original: "Ponto de coleta; não representa aleatoriamente todos os domicílios ou habitantes."
    resolucao_temporal: "Amostra datada; síntese anual, com contagens mensais auxiliares."
    periodo_referencia: "Ano de DT_COLETA; limites fixados da Portaria GM/MS 888/2021 para comparação retrospectiva, explicitamente identificada."
    limiar_referencia: "Ausência de E. coli em 100 mL."
    fontes_dados: [{"id": "sisagua-vigilancia", "papel": "Sisagua — Vigilância de parâmetros básicos; CSV anual e dicionário oficial"}]
    cobertura_geografica: "Municípios com amostras de rotina informadas ao Sisagua; cobertura depende da vigilância local."
    periodo_disponivel: "2014–2025 completos no catálogo; 2026 parcial na data da verificação."
    periodicidade_atualizacao: "Anual, mantendo data de extração porque registros podem ser incluídos ou retificados posteriormente."
    forma_acesso: "Download HTTP dos ZIP CSV anuais listados em sisagua-vigilancia-parametros-basicos; exemplo 2014: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SISAGUA/vigilancia_parametros_basicos_2014_csv.zip. Ler separador ponto e vírgula, codificação Latin-1 nos arquivos testados e vírgula decimal; confirmar o esquema em cada edição."
    url_persistente: "https://dadosabertos.saude.gov.br/dataset/sisagua-vigilancia-parametros-basicos"
    formatos: "CSV em ZIP; dicionário ODT; preservar campos originais e códigos."
    disponibilidade: ["Calculável com dados locais centralizados"]
    necessidade_processamento: "Descompactar, padronizar codificação e números; filtrar o recorte; usar chave município/solução/NU_AMOSTRA/DT_COLETA/HR_COLETA/PARAMETRO. Remover duplicatas exatas; em revisões, manter maior DT_INCLUSAO_REGISTRO; empate conflitante é ausente. Classificar resultados válidos e somar contagens, sem média simples de percentuais mensais."
