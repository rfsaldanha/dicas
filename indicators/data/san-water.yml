common: &wash_common
  tema: Água, saneamento e qualidade ambiental
  capitulo: chapters/part-2/08-agua-saneamento-qualidade-ambiental.qmd
  dimensoes: [exposição, vulnerabilidade, resposta]
  responsabilidade_gerencial: Titulares e prestadores de saneamento, autoridades reguladoras e setor saúde, conforme a competência de cada indicador.
  qualidade_incerteza: Relatar fonte, cobertura, população de referência, dados ausentes, plano amostral, qualidade laboratorial, regras de classificação e revisão.
  comparabilidade: Manter definição de serviço, população, forma de abastecimento, ponto de coleta, parâmetro, padrão vigente, período e método.
  relacao_saude: Água segura, saneamento e higiene reduzem exposição a patógenos e substâncias químicas e sustentam alimentação, cuidado, dignidade e funcionamento dos serviços de saúde.
  defasagens_temporais: Distinguir condição do serviço, resultado de amostra e desfecho; surtos e agravos podem ocorrer com defasagens e múltiplas vias.
  aplicacao_gestao: Identificar lacunas de serviço e qualidade, priorizar inspeção e resposta, acompanhar desigualdades e avaliar políticas.
  notas: Indicadores de cobertura, qualidade da água e desempenho da vigilância respondem a perguntas diferentes e devem ser apresentados em conjunto.

indicators:
  - <<: *wash_common
    codigo: SAN-AGU-01
    titulo_completo: Proporção da população que utiliza serviços de água potável geridos de forma segura (ODS 6.1.1)
    titulo_resumido: Água gerida de forma segura — ODS 6.1.1
    referencia_metodologica: Indicador ODS 6.1.1, sob custódia do Programa Conjunto OMS/UNICEF de Monitoramento de Água, Saneamento e Higiene.
    conceito: Proporção da população que usa fonte melhorada de água localizada no domicílio ou terreno, disponível quando necessária e livre de contaminação fecal e química prioritária.
    objetivo: Monitorar acesso universal e equitativo a serviço de água que reúna acessibilidade, disponibilidade e qualidade.
    interpretacao: O serviço é classificado como gerido de forma segura apenas quando atende simultaneamente aos três critérios. O valor global é estimado de maneira conservadora a partir dos componentes disponíveis.
    usos: [Monitorar o ODS 6.1.1., Comparar desigualdades urbano-rurais e sociais., Planejar expansão e melhoria do abastecimento.]
    limitacoes: [Nem todos os países dispõem de todos os componentes., A estimativa nacional pode ocultar intermitência local., Qualidade costuma usar E. coli e químicos prioritários, não todo o padrão de potabilidade., Fonte principal declarada não mede consumo individual.]
    metodo_calculo: Estimar a proporção que usa fonte melhorada e, entre usuários, as proporções com fonte no local, água disponível quando necessária e livre de contaminação. Multiplicar cada componente pela cobertura de fonte melhorada e usar o menor valor disponível conforme o método JMP.
    formula_calculo: 'ODS6.1.1=100\times\min(P_{local},P_{disponível},P_{sem\ contaminação})'
    numerador: População estimada que usa fonte melhorada e atende simultaneamente aos componentes de serviço seguro.
    denominador: População total do território.
    unidade_medida: Percentual (%).
    variaveis_categorias_analise: Fonte melhorada; localização; disponibilidade; E. coli; arsênio e fluoreto quando disponíveis; urbano/rural; grupo socioeconômico.
    granularidade: Estimativa nacional, urbana e rural; outras desagregações conforme dados.
    unidade_territorial: País; desagregações subnacionais quando metodologicamente suportadas.
    resolucao_espacial_original: A das pesquisas, censos e dados administrativos integrados.
    resolucao_temporal: Anual estimada.
    periodo_referencia: Ano da estimativa e fontes subjacentes documentadas.
    limiar_referencia: Atender aos três critérios de serviço gerido de forma segura.
    fontes_dados:
      - id: jmp
        papel: estimativa internacional oficial e metadado ODS
      - id: sinisa
        papel: informação administrativa nacional complementar sobre serviços
      - id: ibge
        papel: censos e pesquisas domiciliares usados em análises nacionais
    cobertura_geografica: Global no JMP; detalhamento nacional depende das fontes brasileiras.
    periodo_disponivel: Estimativas JMP desde 2000, conforme disponibilidade.
    periodicidade_atualizacao: Periódica.
    forma_acesso: Portal WASH Data e fontes nacionais.
    url_persistente: https://washdata.org/topics/drinking-water
    formatos: Tabelas, arquivos de estimativas e relatórios.
    disponibilidade: [disponível em estimativa oficial]
    necessidade_processamento: Para o valor oficial, selecionar edição. Para análise local, harmonizar fonte, população, disponibilidade e qualidade sem rotular como ODS oficial indevidamente.
    analise_descritiva: Mostrar valor total, componentes, urbano/rural, grupos sociais, fonte dos dados e intervalo entre anos observados e estimados.
    referencias: ["[@un2026sdg611]", "[@jmp2026water]"]

  - <<: *wash_common
    codigo: SAN-ESG-01
    titulo_completo: Proporção da população que utiliza serviços de saneamento geridos de forma segura (ODS 6.2.1a)
    titulo_resumido: Saneamento gerido de forma segura — ODS 6.2.1a
    referencia_metodologica: Componente de saneamento do indicador ODS 6.2.1, sob custódia do Programa Conjunto OMS/UNICEF.
    conceito: Proporção da população que usa instalação sanitária melhorada não compartilhada, da qual excretas são tratadas e dispostas com segurança no local ou removidas e tratadas fora dele.
    objetivo: Monitorar acesso a saneamento que inclua contenção, esvaziamento, transporte e tratamento seguro das excretas.
    interpretacao: "Conexão à rede não basta: o indicador considera o destino e tratamento. Soluções no local podem qualificar-se quando manejadas com segurança."
    usos: [Monitorar ODS 6.2.1a., Planejar coleta e tratamento de esgoto e lodo fecal., Avaliar desigualdades e risco sanitário.]
    limitacoes: [Dados sobre toda a cadeia são incompletos., Taxas de tratamento podem ser estimadas., Não mede diretamente exposição em cada domicílio., Instalação compartilhada é excluída do nível básico no método global.]
    metodo_calculo: Estimar usuários de instalações melhoradas não compartilhadas e somar as parcelas cujas excretas são dispostas com segurança no local, transportadas por rede e tratadas ou removidas de sistemas não conectados e tratadas.
    formula_calculo: 'ODS6.2.1a=100\times\frac{Pop_{in\ situ\ seguro}+Pop_{rede\ tratado}+Pop_{lodo\ tratado}}{Pop_{total}}'
    numerador: População que usa instalação melhorada não compartilhada com excretas manejadas com segurança.
    denominador: População total.
    unidade_medida: Percentual (%).
    variaveis_categorias_analise: Tipo de instalação; compartilhamento; contenção; esvaziamento; transporte; tratamento; urbano/rural.
    granularidade: Nacional, urbana e rural no JMP; local conforme sistemas administrativos.
    unidade_territorial: País ou território subnacional qualificado.
    resolucao_espacial_original: A das pesquisas e registros administrativos.
    resolucao_temporal: Anual estimada.
    periodo_referencia: Ano da estimativa e fontes subjacentes.
    limiar_referencia: Instalação melhorada não compartilhada e manejo seguro de excretas.
    fontes_dados:
      - id: jmp
        papel: estimativa internacional e metadado ODS
      - id: sinisa
        papel: informação nacional sobre esgotamento e tratamento
      - id: ibge
        papel: censos e pesquisas domiciliares
    cobertura_geografica: Global; detalhe nacional conforme fontes.
    periodo_disponivel: Conforme série JMP e fontes nacionais.
    periodicidade_atualizacao: Periódica.
    forma_acesso: Portal WASH Data e sistemas nacionais.
    url_persistente: https://unstats.un.org/sdgs/metadata/?Goal=6&Target=6.2
    formatos: Tabelas e relatórios.
    disponibilidade: [disponível em estimativa oficial]
    necessidade_processamento: Integrar tipo de instalação e destino de excretas; não inferir tratamento a partir de conexão.
    analise_descritiva: Apresentar cobertura e componentes por urbano/rural, renda e território, distinguindo rede, soluções locais e tratamento.
    referencias: ["[@un2026sdg621]"]

  - <<: *wash_common
    codigo: SAN-HIG-01
    titulo_completo: Proporção da população com instalação básica para lavagem das mãos com água e sabão (ODS 6.2.1b)
    titulo_resumido: Instalação para higiene — ODS 6.2.1b
    referencia_metodologica: Componente de higiene do indicador ODS 6.2.1, sob custódia do Programa Conjunto OMS/UNICEF.
    conceito: Proporção da população que vive em domicílio com instalação para lavagem das mãos onde água e sabão são observados no momento da pesquisa.
    objetivo: Monitorar disponibilidade doméstica dos meios básicos para higiene das mãos.
    interpretacao: Valor maior indica maior cobertura de instalações com insumos no momento observado. Não mede frequência nem técnica de lavagem.
    usos: [Monitorar ODS 6.2.1b., Planejar políticas de água e higiene., Avaliar desigualdades e preparação para surtos.]
    limitacoes: [Observação pontual pode variar no tempo., Não mede comportamento., Produtos de limpeza alternativos exigem classificação do protocolo., Valor domiciliar não representa escolas ou serviços de saúde.]
    metodo_calculo: Em pesquisa representativa, observar a presença de instalação no domicílio e verificar água e sabão; ponderar pessoas residentes nos domicílios qualificados.
    formula_calculo: 'ODS6.2.1b=100\times\frac{Pop_{domicílios\ com\ instalação,\ água\ e\ sabão}}{Pop_{total}}'
    numerador: População em domicílios com instalação observada, água e sabão.
    denominador: População total pesquisada e ponderada.
    unidade_medida: Percentual (%).
    variaveis_categorias_analise: Instalação; água; sabão; urbano/rural; renda; região.
    granularidade: Domicílio na coleta e população/território na estimativa.
    unidade_territorial: País ou domínio amostral.
    resolucao_espacial_original: A do desenho da pesquisa.
    resolucao_temporal: Inquérito periódico e estimativa anual quando modelada.
    periodo_referencia: Data da coleta ou ano da estimativa.
    limiar_referencia: Presença simultânea de instalação, água e sabão.
    fontes_dados:
      - id: jmp
        papel: estimativa internacional e metadado ODS
      - id: ibge
        papel: pesquisas domiciliares nacionais quando incluírem os componentes
    cobertura_geografica: Global com disponibilidade desigual; nacional conforme pesquisa.
    periodo_disponivel: Conforme ciclos de inquérito.
    periodicidade_atualizacao: Periódica.
    forma_acesso: Portal WASH Data e microdados/pesquisas nacionais.
    url_persistente: https://unstats.un.org/sdgs/metadata/?Goal=6&Target=6.2
    formatos: Tabelas e microdados sob regras da pesquisa.
    disponibilidade: [disponível onde há pesquisa compatível]
    necessidade_processamento: Aplicar desenho amostral e ponderar população; preservar componentes separados.
    analise_descritiva: Desagregar por urbano/rural, renda, região e presença de cada componente, com intervalos amostrais.
    referencias: ["[@un2026sdg621]"]

  - <<: *wash_common
    codigo: SAN-AGU-02
    titulo_completo: Proporção de amostras de água para consumo humano com ausência de Escherichia coli
    titulo_resumido: Amostras sem E. coli
    referencia_metodologica: Indicador de qualidade bacteriológica utilizado no Sisagua e no Vigiagua, conforme a norma brasileira de potabilidade.
    conceito: Percentual de amostras válidas de água para consumo humano nas quais E. coli está ausente em 100 mL, no universo e período definidos.
    objetivo: Detectar evidência de contaminação fecal e acompanhar a conformidade microbiológica da água distribuída ou consumida.
    interpretacao: Valor próximo de 100% indica maior proporção de resultados conformes. Uma amostra positiva exige avaliação e ação conforme ponto, forma de abastecimento e protocolo; a proporção não elimina o significado de eventos isolados.
    usos: [Vigilância da qualidade da água., Identificação de formas de abastecimento e pontos críticos., Investigação de surtos e avaliação de intervenções.]
    limitacoes: [Resultado representa local e momento da coleta., Plano de amostragem pode não cobrir áreas vulneráveis., Ausência do indicador não garante ausência de todos os patógenos., Agregar controle e vigilância pode ocultar diferenças.]
    metodo_calculo: Selecionar amostras válidas no período, forma de abastecimento, origem institucional e ponto de coleta definidos; contar as com ausência de E. coli em 100 mL e dividir pelo total analisado.
    formula_calculo: 'P_{E.coli\ ausente}=100\times\frac{N_{amostras\ sem\ E.coli}}{N_{amostras\ válidas\ analisadas}}'
    numerador: Número de amostras válidas com ausência de E. coli em 100 mL.
    denominador: Total de amostras válidas analisadas para E. coli no universo.
    unidade_medida: Percentual (%).
    variaveis_categorias_analise: Resultado; ponto; SAA, SAC ou SAI; vigilância ou controle; município; mês; laboratório.
    granularidade: Amostra e resumo por forma de abastecimento, município e período.
    unidade_territorial: Ponto de coleta, forma de abastecimento e município.
    resolucao_espacial_original: Coordenada/endereço do ponto quando disponível.
    resolucao_temporal: Data da coleta; resumo mensal, trimestral ou anual.
    periodo_referencia: Período de monitoramento e norma de potabilidade vigente.
    limiar_referencia: Ausência de E. coli em 100 mL.
    fontes_dados:
      - id: vigiagua
        papel: registros de vigilância e controle no Sisagua
    cobertura_geografica: Brasil, condicionada à alimentação e execução dos planos.
    periodo_disponivel: Bases públicas de vigilância a partir de 2014 no conjunto consultado.
    periodicidade_atualizacao: Contínua no sistema; arquivos públicos por competência.
    forma_acesso: Sisagua, painéis Vigiagua e Portal de Dados Abertos do SUS.
    url_persistente: https://dadosabertos.saude.gov.br/dataset/sisagua-vigilancia-parametros-basicos
    formatos: CSV e painéis.
    disponibilidade: [disponível em dados administrativos]
    necessidade_processamento: Deduplicar, filtrar resultados válidos, harmonizar categorias e calcular com denominador explícito.
    analise_descritiva: Mostrar número de amostras, proporção conforme, positivos por ponto e forma, cobertura do plano e tendência.
    referencias: ["[@brasil2021portaria888]", "[@brasil2024agua]", "[@oliveira2019sisagua]"]

  - <<: *wash_common
    codigo: SAN-AGU-03
    titulo_completo: Proporção de amostras com residual de agente desinfetante em conformidade
    titulo_resumido: Residual de desinfetante conforme
    referencia_metodologica: Indicador sentinela do Vigiagua e grupo de indicador do Sisagua para residual de desinfetante.
    conceito: Percentual de amostras válidas cujo residual do desinfetante medido se encontra na faixa exigida pela norma para o agente e ponto correspondentes.
    objetivo: Acompanhar manutenção da barreira de desinfecção na distribuição e nos pontos de consumo.
    interpretacao: Valor maior indica maior conformidade dos resultados amostrados. Residual abaixo do mínimo pode sinalizar perda de proteção; valor alto pode exigir avaliação de operação, subprodutos e aceitabilidade.
    usos: [Vigilância sentinela da distribuição., Priorização de inspeção e recoleta., Avaliação de integridade e operação do abastecimento.]
    limitacoes: [Faixas variam com agente e situação., Um resultado conforme não garante qualidade microbiológica., Horário, temperatura e técnica de campo afetam a medição., Agregação pode ocultar trechos críticos.]
    metodo_calculo: Para cada amostra válida, identificar agente desinfetante e limite aplicável na norma vigente, classificar o resultado e dividir o número conforme pelo total analisado no mesmo universo.
    formula_calculo: 'P_{RAD\ conforme}=100\times\frac{N_{amostras\ RAD\ conforme}}{N_{amostras\ RAD\ válidas}}'
    numerador: Amostras válidas com residual de agente desinfetante dentro dos limites aplicáveis.
    denominador: Amostras válidas analisadas para o agente no universo.
    unidade_medida: Percentual (%); concentração original em mg/L.
    variaveis_categorias_analise: Agente; concentração; ponto; forma de abastecimento; vigilância/controle; data; município.
    granularidade: Amostra e resumo por sistema/solução, município e período.
    unidade_territorial: Ponto de coleta, forma de abastecimento e município.
    resolucao_espacial_original: Ponto de coleta.
    resolucao_temporal: Momento da coleta; resumo periódico.
    periodo_referencia: Período e norma vigente.
    limiar_referencia: A norma exige, no mínimo, 0,2 mg/L de cloro residual livre, 2 mg/L de cloro residual combinado ou 0,2 mg/L de dióxido de cloro na distribuição e pontos de consumo; verificar também limites máximos e condições específicas.
    fontes_dados:
      - id: vigiagua
        papel: resultados de parâmetros básicos no Sisagua
    cobertura_geografica: Brasil, condicionada ao monitoramento.
    periodo_disponivel: Conforme Sisagua e arquivos públicos.
    periodicidade_atualizacao: Contínua e por publicação de arquivos.
    forma_acesso: Sisagua, painéis e dados abertos.
    url_persistente: https://www.gov.br/saude/pt-br/composicao/svsa/saude-ambiental/vigiagua/monitoramento-da-qualidade-da-agua
    formatos: CSV, painel e relatórios.
    disponibilidade: [disponível em dados administrativos]
    necessidade_processamento: Identificar agente e norma, validar unidade, classificar resultados e calcular cobertura e conformidade separadamente.
    analise_descritiva: Apresentar concentração, conformidade, distribuição de valores, pontos baixos/altos, forma e execução do plano.
    referencias: ["[@brasil2021portaria888]", "[@brasil2024agua]", "[@oliveira2019sisagua]"]

  - <<: *wash_common
    codigo: SAN-AGU-04
    titulo_completo: Proporção de amostras de turbidez em conformidade com o padrão de potabilidade
    titulo_resumido: Turbidez conforme
    referencia_metodologica: Indicador sentinela do Vigiagua e grupo de indicador do Sisagua para turbidez.
    conceito: Percentual de resultados válidos de turbidez que atendem ao valor máximo permitido aplicável à etapa, tecnologia de tratamento e ponto de coleta.
    objetivo: Acompanhar desempenho do tratamento e integridade do abastecimento por um parâmetro que também interfere na eficácia da desinfecção.
    interpretacao: Valor maior indica maior conformidade entre amostras. A interpretação deve separar saída do tratamento e distribuição e considerar a tecnologia.
    usos: [Avaliar tratamento e distribuição., Priorizar inspeção e ações corretivas., Acompanhar risco após chuva, inundação ou alteração do manancial.]
    limitacoes: [Não é medida direta de patógenos., Limites variam por tecnologia e ponto., Agregação entre etapas é inadequada., Falta de amostragem pode produzir falsa aparência de conformidade.]
    metodo_calculo: Classificar cada resultado válido segundo o valor máximo permitido aplicável à tecnologia e ao ponto na norma vigente; dividir resultados conformes pelo total analisado no universo homogêneo.
    formula_calculo: 'P_{turbidez\ conforme}=100\times\frac{N_{resultados\leq VMP_{aplicável}}}{N_{resultados\ válidos}}'
    numerador: Resultados válidos de turbidez iguais ou inferiores ao valor máximo aplicável.
    denominador: Total de resultados válidos no mesmo universo tecnológico e operacional.
    unidade_medida: Percentual (%); valor original em unidade de turbidez.
    variaveis_categorias_analise: Turbidez; etapa; tecnologia; ponto; forma de abastecimento; data; município.
    granularidade: Amostra e resumo por etapa, sistema/solução, município e período.
    unidade_territorial: Ponto de coleta e forma de abastecimento.
    resolucao_espacial_original: Ponto de coleta.
    resolucao_temporal: Momento da coleta; resumo periódico.
    periodo_referencia: Período de monitoramento e norma vigente.
    limiar_referencia: Valor máximo permitido correspondente à tecnologia, etapa e ponto segundo a Portaria GM/MS nº 888/2021; não aplicar um único limiar a todos os registros.
    fontes_dados:
      - id: vigiagua
        papel: resultados de turbidez no Sisagua
    cobertura_geografica: Brasil, condicionada ao monitoramento.
    periodo_disponivel: Conforme Sisagua e arquivos públicos.
    periodicidade_atualizacao: Contínua e por publicação de arquivos.
    forma_acesso: Sisagua, painéis e dados abertos.
    url_persistente: https://dadosabertos.saude.gov.br/dataset/sisagua-vigilancia-parametros-basicos
    formatos: CSV, painel e relatórios.
    disponibilidade: [disponível em dados administrativos]
    necessidade_processamento: Harmonizar etapa, tecnologia e unidade, aplicar VMP correspondente e calcular execução do plano e conformidade.
    analise_descritiva: Apresentar conformidade por etapa e tecnologia, distribuição dos valores, extremos, cobertura amostral e relação temporal com eventos.
    referencias: ["[@brasil2021portaria888]", "[@brasil2024agua]", "[@oliveira2019sisagua]"]
