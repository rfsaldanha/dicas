codigo: "CLI-TEM-02"
titulo_completo: "Máxima anual da temperatura máxima diária (TXx)"
titulo_resumido: "Máxima anual da temperatura máxima diária (TXx)"
tema: "Temperatura e condições térmicas"
capitulo: "chapters/part-2/05-temperatura-condicoes-termicas.qmd"
referencia_metodologica: "Definição ETCCDI/Climdex; extração horária de TX/TN e média municipal são adaptações operacionais do livro."
conceito: "Máxima anual da temperatura máxima diária (TXx) na célula, com síntese municipal por área."
objetivo: "Complementar a descrição municipal dos extremos térmicos com uma definição internacional ETCCDI."
interpretacao: "Valores maiores representam maior extremo absoluto de calor."
usos: ["Monitorar a intensidade do maior extremo térmico de cada ano.", "Comparar máximos anuais com a mesma fonte, calendário e suporte espacial.", "Contextualizar extremos de calor em análises de saúde."]
limitacoes: ["Lacunas podem ocultar o maior extremo do ano.", "A máxima das temperaturas horárias modeladas não equivale ao máximo instantâneo observado por termômetro.", "A média municipal dos máximos das células pode reunir extremos ocorridos em datas diferentes.", "Não incorpora umidade, vento, radiação ou duração do calor."]
dimensoes: ["perigo", "exposição"]
metodo_calculo: "Obter TX como máximo das 24 temperaturas horárias válidas de cada dia UTC. Selecionar a maior TX do ano em cada célula; depois calcular a média municipal por área. Não selecionar o máximo da temperatura municipal previamente agregada."
formula_calculo: "TXx_y=\\max_{d\\in y}TX_d"
numerador: "Não se aplica."
denominador: "Não se aplica."
unidade_medida: "°C."
variaveis_categorias_analise: "Temperatura máxima diária TX; máximo anual TXx; célula; município; ano e data do extremo."
granularidade: "Calcular o indicador em cada célula antes da média municipal ponderada pela área; manter produto, célula, ano e código IBGE de sete dígitos."
unidade_territorial: "Célula de grade; município como síntese ponderada pela área de interseção."
resolucao_espacial_original: "ERA5-Land: grade de 0,1°; malha municipal IBGE 2022 como recorte fixo."
resolucao_temporal: "Entradas horárias; extremos diários em 00–23 UTC; saída anual, salvo estação quente ou produto explicitados."
periodo_referencia: "Não utiliza período-base."
limiar_referencia: "Máximo anual; sem limiar."
fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly, variável 2m_temperature; extrair TX/TN conforme o método da ficha"}, {"id": "inmet", "papel": "Validação local e séries observadas separadas da reanálise"}]
responsabilidade_gerencial: "Instituição responsável pelo serviço climático ou pela vigilância que adotar o protocolo, com governança compartilhada entre meteorologia e saúde quando usado operacionalmente."
cobertura_geografica: "Todos os municípios brasileiros no domínio da grade. Não representa diretamente a exposição individual ou o microclima de cada bairro."
periodo_disponivel: "1950–presente; publicar anos completos até 2025 e identificar 2026 como parcial. A janela inicial utilizável depende dos antecedentes exigidos pela medida."
periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
forma_acesso: "API do Climate Data Store, dataset reanalysis-era5-land, product_type=reanalysis, todas as 24 horas UTC; download NetCDF ou GRIB por mês e recorte espacial."
url_persistente: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land"
formatos: "NetCDF ou GRIB de entrada; CSV/Parquet para séries municipais."
disponibilidade: ["Calculável com dados abertos"]
necessidade_processamento: "Converter kelvin para °C; obter TX e TN como máximo e mínimo das 24 temperaturas horárias válidas de cada dia UTC. Calcular a medida por célula e, depois, sua média municipal por área. Esta TX não é a máxima instantânea de termômetro."
qualidade_incerteza: "Exigir 24 horas válidas para TX diário. Mais de 15 dias ausentes no ano ou mais de três em qualquer mês invalidam o ano; faltas restantes podem subestimar o máximo. Exigir ≥90% de área municipal com ano válido e publicar essa fração. TXx não usa período-base."
comparabilidade: "Fixar produto, versão, calendário UTC, controle de falhas e limites municipais 2022. Não usa período-base e não deve ser comparado como frequência percentual."
relacao_saude: "TXx caracteriza o maior extremo absoluto da temperatura máxima diária; o resumo anual não identifica por si só duração, exposição individual ou efeitos de saúde."
defasagens_temporais: "Em estudos de saúde, definir a priori defasagens e médias móveis conforme desfecho e literatura; o índice anual não deve substituir a série diária em análises de efeitos agudos."
aplicacao_gestao: "Monitorar tendência de extremos, apoiar avaliação sazonal e selecionar períodos para análise de pressão assistencial; para alertas, combinar com previsão e protocolo calor–saúde validado."
notas: "Protocolo municipal do livro. Reproduzir o método internacional na célula; a agregação municipal por área é uma adaptação explícita. A série nacional ainda não foi produzida."
analise_descritiva: "Apresentar TXx em °C, sua data na célula, a média municipal por área e a cobertura válida; não expressar como percentual."
