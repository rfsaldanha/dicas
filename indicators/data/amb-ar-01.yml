codigo: AMB-AR-01
denominacao: Concentração média diária de PM2,5
tema: Qualidade do ar, queimadas e fumaça
definicao: Média das concentrações de partículas com diâmetro aerodinâmico igual ou inferior a 2,5 micrômetros em uma janela diária declarada.
objetivo: Descrever a exposição ambiental diária a material particulado fino e apoiar o monitoramento da qualidade do ar.
interpretacao: Valores maiores indicam maior concentração ambiental estimada ou observada. A interpretação depende da cobertura do monitoramento, do método de medição e do valor de referência adotado.
usos:
  - Monitorar episódios de poluição e fumaça.
  - Construir séries para análises epidemiológicas.
  - Apoiar comunicação de risco e avaliação de ações.
limitacoes:
  - Uma estação pode não representar a exposição de todo o município.
  - Produtos modelados e observações de superfície têm incertezas diferentes.
  - A média diária não descreve picos intradiários.
dimensoes:
  - perigo
  - exposição
metodo_calculo: Calcular a média aritmética das concentrações válidas na janela diária, aplicando o critério mínimo de completude definido pelo protocolo ou pela rede de monitoramento.
formula: '\overline{PM}_{2,5,d} = \frac{1}{n_d}\sum_{i=1}^{n_d} PM_{2,5,d,i}'
numerador: Soma das concentrações válidas de PM2,5 na janela diária.
denominador: Número de observações válidas na janela diária.
unidade_medida: Micrograma por metro cúbico (µg/m³), quando adotada pela fonte.
categorias_analise: Faixa de concentração; estação; território; origem do dado; episódio de fumaça.
unidade_territorial: Ponto de monitoramento, célula de grade ou território agregado.
resolucao_espacial_original: Depende da rede ou do produto atmosférico.
resolucao_temporal: Diária, derivada de valores intradiários.
periodo_referencia: Declarar fuso, janela diária e critério de completude.
