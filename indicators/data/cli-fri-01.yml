codigo: "CLI-FRI-01"
titulo_completo: "Dias em períodos de frio (CSDI)"
titulo_resumido: "Dias em períodos de frio (CSDI)"
tema: "Temperatura e condições térmicas"
capitulo: "chapters/part-2/05-temperatura-condicoes-termicas.qmd"
capitulo_fichas: chapters/part-4/16-fichas-temperatura-condicoes-termicas.qmd
referencia_metodologica: "Definição ETCCDI/Climdex; extração horária de TX/TN e média municipal são adaptações operacionais do livro."
conceito: "Dias em períodos de frio (CSDI) na célula, com síntese municipal por área."
objetivo: "Complementar a descrição municipal dos extremos térmicos com uma definição internacional ETCCDI."
interpretacao: "Valores maiores representam mais dias de frio persistente relativo à climatologia local."
usos: ["Monitorar persistência de extremos frios.", "Contextualizar exposição ao frio em análises de saúde."]
limitacoes: ["Reanálise suaviza extremos e representa uma área, não um termômetro.", "Frio relativo não equivale a temperatura absoluta baixa nem a risco clínico universal."]
dimensoes: ["perigo", "exposição"]
metodo_calculo: "Estimar P10 de TN por dia calendário em janela de cinco dias, base 1961–1990, quantil tipo 8 e bootstrap Zhang dentro da base. Interpolar o limiar de 29/02. Detectar sequências de pelo menos seis dias com TN<P10 na série contínua, incluindo cinco dias de cada ano vizinho; contar apenas os dias pertencentes ao ano de saída. Sem evento em ano válido, zero; agregar por área depois do cálculo por célula."
formula_calculo: "CSDI_y=\\sum_{d\\in y}I(d\\in C),\\qquad C=\\bigcup_{e:\\,|e|\\geq6}e"
numerador: "Dias pertencentes a sequências frias qualificadas."
denominador: "Não se aplica."
unidade_medida: "Dias por ano; média por área na síntese municipal."
variaveis_categorias_analise: "Temperatura mínima diária TN; P10 calendário; sequências de seis dias ou mais; célula; município e ano."
granularidade: "Calcular o indicador em cada célula antes da média municipal ponderada pela área; manter produto, célula, ano e código IBGE de sete dígitos."
unidade_territorial: "Célula de grade; município como síntese ponderada pela área de interseção."
resolucao_espacial_original: "ERA5-Land: grade de 0,1°; malha municipal IBGE 2022 como recorte fixo."
resolucao_temporal: "Entradas horárias; extremos diários em 00–23 UTC; saída anual, salvo estação quente ou produto explicitados."
periodo_referencia: "1961–1990."
limiar_referencia: "TN<P10 calendário durante pelo menos seis dias consecutivos."
fontes_dados: [{"id": "era5-land", "papel": "ERA5-Land hourly, variável 2m_temperature; extrair TX/TN conforme o método da ficha"}, {"id": "inmet", "papel": "Validação local e séries observadas separadas da reanálise"}]
responsabilidade_gerencial: "Instituição responsável pelo serviço climático ou pela vigilância que adotar o protocolo, com governança compartilhada entre meteorologia e saúde quando usado operacionalmente."
cobertura_geografica: "Todos os municípios brasileiros no domínio da grade. Não representa diretamente a exposição individual ou o microclima de cada bairro."
periodo_disponivel: "1950–presente; publicar anos completos até 2025 e identificar 2026 como parcial. A janela inicial utilizável depende dos antecedentes exigidos pela medida."
periodicidade_atualizacao: "Anual, após completar e verificar o último ano de entrada."
forma_acesso: "API do Climate Data Store, dataset reanalysis-era5-land, product_type=reanalysis, todas as 24 horas UTC; download NetCDF ou GRIB por mês e recorte espacial."
url_persistente: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land"
formatos: "NetCDF ou GRIB de entrada; CSV/Parquet para séries municipais."
disponibilidade: ["Calculável com dados abertos"]
necessidade_processamento: "Converter kelvin para °C; obter TX e TN como máximo e mínimo das 24 temperaturas horárias válidas de cada dia UTC. Calcular a medida por célula e, depois, sua média municipal por área. Esta TX não é a máxima instantânea de termômetro."
qualidade_incerteza: "Dia com menos de 24 horas válidas na grade é ausente. Nas sínteses anuais, mais de 15 dias ausentes, ou mais de três em qualquer mês, invalidam o ano; falhas não recebem zero e não unem sequências. Exigir 90% dos dados do período-base e registrar a cobertura. Sínteses municipais exigem ao menos 90% de área válida; informar essa fração. Critérios de cobertura são escolhas editoriais deste protocolo."
comparabilidade: "Fixar versão, calendário UTC, período-base e limites municipais de 2022. Não emendar estação e reanálise. Médias municipais de contagens podem ser fracionárias e não contam episódios sincrônicos do município."
relacao_saude: "Descreve frio persistente relativo à climatologia local; não substitui limiares de exposição individual ou efeitos clínicos."
defasagens_temporais: "Em estudos de saúde, definir a priori defasagens e médias móveis conforme desfecho e literatura; o índice anual não deve substituir a série diária em análises de efeitos agudos."
aplicacao_gestao: "Monitorar persistência do frio e selecionar períodos para análise de agravos e preparação dos serviços; alertas exigem validação local com temperaturas absolutas e desfechos."
notas: "Na fórmula, e representa uma sequência consecutiva de dias TN<P10 e C reúne os dias das sequências qualificadas. A média municipal por área pode ser fracionária."
analise_descritiva: "Apresentar dias em períodos de frio, datas das sequências, cobertura e distribuição espacial; não apresentar a contagem como percentual."
referencias: ["[@climdex2024]", "[@zhang2005]"]
protocolo_versao: "2026-10-03"
situacao_calculo: "abertos"
dependencia_dados_locais: "Opcional para validação"
automacao: "Condicionada"
condicoes_automacao: "Cadastro gratuito e credencial CDS; download das variáveis e processamento conforme a ficha."
evidencia_verificacao: "Documentação verificada"
detalhe_verificacao: "Produto e método documentados; série municipal completa ainda não produzida."
