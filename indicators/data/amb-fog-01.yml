qualidade_incerteza: "Fogo pequeno, oculto ou não detectado pode ficar no fundo sem cicatriz. Zero é ausência de cicatriz mapeada, não comprovação de observação perfeita. Ano sem arquivo ou fora do domínio é ausente."
