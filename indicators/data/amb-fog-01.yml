codigo: "AMB-FOG-01"
titulo_completo: "Percentual da área municipal queimada no ano"
titulo_resumido: "Área municipal queimada — MapBiomas Fogo 5"
tema: "Qualidade do ar, queimadas e fumaça"
capitulo: "chapters/part-2/07-qualidade-ar-queimadas-fumaca.qmd"
capitulo_fichas: chapters/part-4/18-fichas-qualidade-ar-queimadas-fumaca.qmd
referencia_metodologica: "MapBiomas Fogo Coleção 5, annual_burned_v1; percentual municipal como derivação explícita."
conceito: "Proporção da área territorial municipal que apresenta cicatriz de fogo mapeada em um ano."
objetivo: "Descrever a extensão territorial anual do fogo sem confundi-la com exposição à fumaça."
interpretacao: "Maior percentual indica maior área mapeada como queimada no ano, não maior dose ou concentração de fumaça."
usos: ["Caracterizar extensão do fogo.", "Contextualizar episódios de fumaça sem substituir modelagem atmosférica."]
limitacoes: ["Área queimada não estima PM2,5 de fogo.", "Não conta quantas vezes a mesma área queimou dentro do ano."]
dimensoes: ["perigo", "exposição"]
metodo_calculo: "No asset annual_burned_v1 da Coleção 5, selecionar burned_area_AAAA, de 1985 a 2025. No domínio brasileiro do produto, classe 1 representa cicatriz mapeada e o fundo sem cicatriz é convertido em 0; máscara exterior ao domínio ou arquivo anual indisponível não recebe zero. Somar as áreas geodésicas das interseções município–pixels de classe 1, uma única vez por pixel e ano. Dividir pela área geodésica total do polígono municipal IBGE 2022 e multiplicar por 100. Publicar zero apenas quando a banda anual estiver disponível e não houver cicatriz mapeada no município; isso não comprova ausência real de incêndio."
formula_calculo: "F_{m,y}=100\\frac{area(m\\cap\\{B_y=1\\})}{area(m)}"
numerador: "Área da união das cicatrizes mapeadas no ano dentro do município, em km²."
denominador: "Área total do mesmo município IBGE 2022, em km²."
unidade_medida: "%."
variaveis_categorias_analise: "Ano, classe de queima, área geodésica, município, coleção e versão."
granularidade: "Pixel anual; soma de área por município."
unidade_territorial: "Município IBGE 2022."
resolucao_espacial_original: "30 m nominal."
resolucao_temporal: "Anual."
periodo_referencia: "Ano civil; sem período-base climatológico."
limiar_referencia: "Classe 1 no raster anual, segundo legenda oficial; não somar contagens mensais."
fontes_dados: [{"id": "mapbiomas-fogo-v5", "papel": "Bandas burned_area_AAAA, classe 1=área queimada"}, {"id": "ibge", "papel": "Malha municipal 2022"}]
