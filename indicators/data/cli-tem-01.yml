necessidade_processamento: Requer agregação máxima em janela diária quando a fonte é subdiária; dados em grade requerem decisão explícita de agregação territorial.
qualidade_incerteza: Documentar falhas, mudanças de estação, controle de qualidade, viés do produto e incerteza introduzida pela agregação espacial.
comparabilidade: Comparar séries apenas após harmonizar fonte, unidade, janela diária, fuso, suporte espacial e versão do produto.
relacao_saude: Pode integrar avaliações de exposição térmica, mas não demonstra, isoladamente, efeito sobre a saúde.
defasagens_temporais: Devem ser definidas conforme o desfecho, o desenho analítico e a hipótese substantiva.
aplicacao_gestao: Subsidiar boletins, vigilância sazonal, preparação de serviços e avaliação de limiares locais.
observacoes: Variável meteorológica transformada em indicador somente quando vinculada a finalidade, método, território e interpretação explícitos.
