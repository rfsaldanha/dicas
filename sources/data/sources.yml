- id: mapbiomas
  tipo_registro: plataforma
  nome: MapBiomas Brasil
  sigla: MapBiomas
  instituicao: Rede MapBiomas
  descricao: Plataforma de mapas e estatísticas de cobertura e uso da terra e outros temas ambientais.
