  resolucao_espacial: "0,25°"
  resolucao_temporal: "Horária"
  periodo_disponivel: "1940–presente, versão 1.1."
  atualizacao: Extensão regular conforme disponibilidade do ERA5; o produto de séries temporais informa atualização diária com cerca de cinco dias de latência.
