- id: inmet
  tipo_registro: instituição
  nome: Instituto Nacional de Meteorologia
  sigla: INMET
  instituicao: Ministério da Agricultura e Pecuária
  descricao: Portal institucional com monitoramento, estações, avisos e produtos meteorológicos.
  recursos_relacionados: [Portal INMET — plataforma de acesso; estações e produtos meteorológicos — recursos a selecionar]
  temas: [temperatura, precipitação, eventos meteorológicos]
  variaveis: [temperatura do ar, precipitação, umidade, vento, pressão]
  cobertura_geografica: Brasil, segundo a distribuição e os períodos de operação das estações convencionais e automáticas.
  resolucao_espacial: Ponto de estação; latitude, longitude, altitude, tipo e histórico devem ser obtidos no catálogo de estações.
  resolucao_temporal: Horária nas estações automáticas; horários sinóticos, resumos diários e mensais em produtos convencionais e climatológicos.
  periodo_disponivel: O banco digital contém informações diárias desde 1961; os arquivos anuais de estações automáticas são divulgados a partir de 2000, com início variável por estação.
  atualizacao: Contínua no Banco de Dados Meteorológicos e operacional nos produtos de tempo; arquivos históricos são publicados e podem ser revistos.
  acesso: Portal, Banco de Dados Meteorológicos, catálogo de estações e arquivos históricos anuais.
  url: https://portal.inmet.gov.br/
  api: Não há uma API pública única documentada para todo o acervo; usar os mecanismos oficiais de consulta e obtenção de arquivos.
  formatos: [CSV nos históricos de estações automáticas, tabelas e gráficos web, documentos e mapas]
  licenca: Dados públicos federais; citar INMET, estação, produto, período e data de acesso e observar os termos apresentados no serviço utilizado.
  cadastro: O BDMEP pode exigir credenciamento; arquivos históricos e visualizações do portal têm acesso público.
  custos: Consulta e downloads públicos sem cobrança.
  limitacoes: Cobertura e continuidade variam entre estações; verificar controle de qualidade e mudanças instrumentais.
  ultima_verificacao: 2026-07-28
  indicadores: [CLI-TEM-01, CLI-CAL-01]

- id: cptec
  tipo_registro: unidade institucional
  nome: Centro de Previsão de Tempo e Estudos Climáticos
  sigla: CPTEC/INPE
  instituicao: Instituto Nacional de Pesquisas Espaciais
  descricao: Produtos e serviços de previsão do tempo, clima e modelagem numérica.
  recursos_relacionados: [Portal CPTEC — plataforma de acesso; serviço XML — API]
  temas: [tempo, clima, previsão]
  variaveis: [condição do tempo, temperatura mínima e máxima, precipitação prevista, vento, umidade, índice ultravioleta, ondas]
  cobertura_geografica: Municípios brasileiros e localidades adicionais nos serviços por cidade; outros domínios dependem do produto numérico.
  resolucao_espacial: Localidade ou município nos serviços XML; grade e domínio específicos nos produtos de modelagem.
  resolucao_temporal: Diária na previsão de sete dias e na estendida; outras frequências dependem do produto.
  periodo_disponivel: Serviço operacional de previsão, sem compromisso de série histórica na interface XML.
  atualizacao: Operacional; a previsão pode mudar entre rodadas e horários de consulta.
  acesso: Portal e serviços de dados.
  url: https://www.cptec.inpe.br/
  api: https://servicos.cptec.inpe.br/XML/
  formatos: [XML]
  licenca: A página do serviço XML não declara licença específica; a reutilização deve reconhecer CPTEC/INPE e preservar data, rodada e produto.
  cadastro: Não exigido para consultas públicas ao serviço XML.
  custos: Acesso público sem cobrança.
  limitacoes: Previsões não devem ser tratadas como observações; registrar modelo, rodada e horizonte.
  ultima_verificacao: 2026-07-28
  indicadores: []

- id: cemaden
  tipo_registro: instituição
  nome: Centro Nacional de Monitoramento e Alertas de Desastres Naturais
  sigla: CEMADEN
  instituicao: Ministério da Ciência, Tecnologia e Inovação
  descricao: Rede observacional e produtos voltados ao monitoramento e a alertas de riscos de desastres.
  recursos_relacionados: [Mapa interativo — painel; rede de pluviômetros — base observacional]
  temas: [precipitação, hidrologia, desastres]
  variaveis: [precipitação acumulada, nível de rios em estações hidrológicas, umidade do solo em redes específicas, localização e estado operacional]
  cobertura_geografica: Brasil; cobertura efetiva depende da rede.
  resolucao_espacial: Ponto de estação para pluviômetros.
  resolucao_temporal: Dez minutos para a descrição consultada dos pluviômetros automáticos.
  periodo_disponivel: Varia por estação desde sua instalação; a interface permite selecionar período e baixar a série disponível.
  atualizacao: Próxima do tempo real para pluviômetros automáticos; confirmar no uso.
  acesso: Mapa interativo e obtenção de arquivos.
  url: https://www2.cemaden.gov.br/mapainterativo/
  api: Não há API pública estável documentada na página do Mapa Interativo; o acesso oficial é por visualização e obtenção de arquivos.
  formatos: [arquivo tabular de dados pluviométricos, gráficos web]
  licenca: Uso público com citação obrigatória da Rede de Monitoramento de Desastres Naturais do Cemaden/MCTI.
  cadastro: Não exigido; a obtenção de arquivos pode solicitar confirmação de segurança.
  custos: Acesso público sem cobrança.
  limitacoes: A página consultada informa que os dados pluviométricos disponibilizados são brutos e em UTC.
  ultima_verificacao: 2026-07-28
  indicadores: [CLI-PRC-01, CLI-PRC-02, CLI-PRC-03, CLI-PRC-04, CLI-PRC-05, CLI-SEC-01]

- id: cds
  tipo_registro: plataforma
  nome: Copernicus Climate Data Store
  sigla: CDS
  instituicao: Copernicus Climate Change Service
  descricao: Catálogo e serviço de acesso a conjuntos de dados climáticos.
  recursos_relacionados: [Catálogo CDS — plataforma; conjuntos de dados — bases e produtos selecionados separadamente]
  temas: [clima, reanálise, projeção]
  variaveis: [atmosfera, superfície terrestre, oceano, criosfera, índices climáticos, projeções e observações, conforme o conjunto]
  cobertura_geografica: Global, regional ou local conforme o conjunto selecionado.
  resolucao_espacial: Definida por conjunto; o catálogo reúne pontos, grades e agregações com resoluções diferentes.
  resolucao_temporal: Definida por conjunto, de subdiária a climatológica.
  periodo_disponivel: Definido por conjunto; reanálises, observações, previsões sazonais e projeções têm coberturas distintas.
  atualizacao: Definida nos metadados de cada conjunto.
  acesso: Catálogo, obtenção de arquivos e API.
  url: https://cds.climate.copernicus.eu/
  api: Climate Data Store API e catálogo STAC, conforme disponibilidade do conjunto.
  formatos: [GRIB, NetCDF, CSV e outros formatos indicados pelo conjunto]
  licenca: Cada conjunto declara sua licença; produtos Copernicus frequentemente usam licença Copernicus ou CC BY, que deve ser registrada no processamento.
  cadastro: Conta e aceitação dos termos do conjunto podem ser exigidas para downloads e API.
  custos: Consulta e conjuntos públicos sem cobrança; custos locais de processamento e armazenamento permanecem com o usuário.
  limitacoes: Observação, reanálise, previsão e projeção devem permanecer claramente diferenciadas.
  ultima_verificacao: 2026-07-28
  indicadores: []

- id: era5-land
  tipo_registro: produto
  nome: ERA5-Land
  sigla: ERA5-Land
  instituicao: Copernicus Climate Change Service
  descricao: Reanálise de variáveis terrestres; não corresponde a observação direta de estação.
  recursos_relacionados: [ERA5-Land — produto de reanálise; Climate Data Store — plataforma de acesso]
  temas: [temperatura, precipitação, reanálise]
  variaveis: [temperatura do ar a 2 m, temperatura do ponto de orvalho a 2 m, precipitação total, vento a 10 m, radiação, pressão, temperatura e umidade do solo, escoamento]
  cobertura_geografica: Global.
  resolucao_espacial: Grade regular de 0,1° por 0,1°; resolução nativa aproximada de 9 km.
  resolucao_temporal: Horária no conjunto consultado.
  periodo_disponivel: "1950–presente; distinguir ERA5-Land consolidado e atualizações preliminares."
  atualizacao: Diária.
  acesso: Climate Data Store.
  url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land
  api: "https://cds.climate.copernicus.eu/api"
  formatos: [GRIB no produto em grade, NetCDF e CSV no produto de séries por ponto]
  licenca: "CC BY 4.0, conforme termos atuais do produto; arquivar a licença aceita no CDS."
  cadastro: "Cadastro gratuito no CDS, aceite da licença e credencial da API."
  custos: A documentação consultada descreve acesso gratuito ao ERA5.
  limitacoes: Reanálise modelada; documentar viés, versão, agregação e diferença em relação a estações.
  ultima_verificacao: "2026-10-03"
  indicadores: [CLI-TEM-01, CLI-CAL-01]


