- id: inmet
  tipo_registro: instituição
  nome: Instituto Nacional de Meteorologia
  sigla: INMET
  instituicao: Ministério da Agricultura e Pecuária
  descricao: Portal institucional com monitoramento, estações, avisos e produtos meteorológicos.
  recursos_relacionados:
  - Portal INMET — plataforma de acesso; estações e produtos meteorológicos — recursos a selecionar
  temas:
  - temperatura
  - precipitação
  - eventos meteorológicos
  variaveis:
  - temperatura do ar
  - precipitação
  - umidade
  - vento
  - pressão
  cobertura_geografica: Brasil, segundo a distribuição e os períodos de operação das estações convencionais
    e automáticas.
  resolucao_espacial: Ponto de estação; latitude, longitude, altitude, tipo e histórico devem ser obtidos no
    catálogo de estações.
  resolucao_temporal: Horária nas estações automáticas; horários sinóticos, resumos diários e mensais em produtos
    convencionais e climatológicos.
  periodo_disponivel: O banco digital contém informações diárias desde 1961; os arquivos anuais de estações
    automáticas são divulgados a partir de 2000, com início variável por estação.
  atualizacao: Contínua no Banco de Dados Meteorológicos e operacional nos produtos de tempo; arquivos históricos
    são publicados e podem ser revistos.
  acesso: Portal, Banco de Dados Meteorológicos, catálogo de estações e arquivos históricos anuais.
  url: https://portal.inmet.gov.br/
  api: Não há uma API pública única documentada para todo o acervo; usar os mecanismos oficiais de consulta
    e obtenção de arquivos.
  formatos:
  - CSV nos históricos de estações automáticas
  - tabelas e gráficos web
  - documentos e mapas
  licenca: Dados públicos federais; citar INMET, estação, produto, período e data de acesso e observar os termos
    apresentados no serviço utilizado.
  cadastro: O BDMEP pode exigir credenciamento; arquivos históricos e visualizações do portal têm acesso público.
  custos: Consulta e downloads públicos sem cobrança.
  limitacoes: Cobertura e continuidade variam entre estações; verificar controle de qualidade e mudanças instrumentais.
  ultima_verificacao: 2026-07-28
  indicadores:
  - CLI-TEM-01
  - CLI-CAL-01
