  ultima_verificacao: 2026-07-28
  indicadores: [AMB-VEG-01, AMB-URB-02, AMB-URB-03]

- id: queimadas-inpe
  tipo_registro: programa
  nome: Programa Queimadas do INPE
  sigla: Programa Queimadas
  instituicao: Instituto Nacional de Pesquisas Espaciais
  descricao: Monitoramento por satélite de fogo ativo, risco, extensão e severidade do fogo na vegetação.
  recursos_relacionados: [Portal do Programa Queimadas — plataforma; focos e demais produtos — bases e produtos a selecionar]
  temas: [queimadas, incêndios florestais, fumaça]
  variaveis: [coordenadas e horário de focos de fogo ativo, satélite e sensor, município e bioma, risco de fogo, área queimada, extensão e severidade]
  cobertura_geografica: Brasil e América do Sul para arquivos de focos; outros domínios dependem do produto.
  resolucao_espacial: Coordenada do pixel detectado, com tamanho dependente do sensor; área queimada possui produtos em grade, inclusive produto diário de 30 m para o Cerrado.
  resolucao_temporal: Passagem do satélite para focos; arquivos de 24 e 48 horas e produtos diários ou mensais conforme o tema.
  periodo_disponivel: Séries variam por satélite e produto; a base histórica deve ser filtrada com um satélite de referência consistente.
  atualizacao: Arquivos de focos em tempo quase real podem ser atualizados a cada dez minutos; a página de serviço informa atualização periódica de até três horas para produtos regulares.
  acesso: Portal de serviço, consultas e downloads.
  url: https://www.gov.br/pt-br/servicos/obter-dados-de-queimadas
  api: Serviços OGC WMS e WFS e acesso HTTP a arquivos de focos; consulta histórica pela base do Programa Queimadas.
  formatos: [CSV, KML, GeoTIFF e serviços WMS/WFS]
  licenca: Dados públicos do INPE; citar Programa Queimadas, produto, satélite, período e data de acesso e observar os termos da interface.
  cadastro: Consulta e arquivos recentes são públicos; solicitações extensas podem pedir endereço eletrônico para entrega.
  custos: Produtos regulares disponibilizados sem cobrança.
  limitacoes: Foco detectado por satélite não equivale a incêndio individual nem diretamente a área queimada.
  ultima_verificacao: 2026-07-28
  indicadores: [AMB-FUM-01]

