  nome: "ERA5-HEAT v1.1 — UTCI histórico"
  sigla: ERA5-HEAT
  instituicao: Copernicus Climate Change Service
  descricao: Produto global horário de temperatura radiante média e Índice Térmico Universal do Clima, calculado com variáveis do ERA5 e modelos de termorregulação e vestimenta.
  recursos_relacionados: [Produto em grade — Thermal comfort indices derived from ERA5 reanalysis; produto de séries temporais — extração por ponto ou pequena área]
