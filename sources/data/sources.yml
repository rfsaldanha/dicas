  indicadores: [CLI-EST-04]


- id: cams
  tipo_registro: serviço
  nome: Copernicus Atmosphere Monitoring Service
  sigla: CAMS
  instituicao: Copernicus / ECMWF
  descricao: Serviço de dados e produtos sobre composição atmosférica.
  recursos_relacionados: [Catálogo CAMS — plataforma de acesso; conjuntos atmosféricos — bases e produtos a selecionar]
  temas: [qualidade do ar, composição atmosférica, fumaça]
  variaveis: [PM2,5, PM10, ozônio, dióxido de nitrogênio, monóxido de carbono, dióxido de enxofre, poeira, sal marinho, carbono negro, matéria orgânica e variáveis meteorológicas]
  cobertura_geografica: Global nos produtos globais; produtos regionais possuem domínios próprios.
