<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Duas finalidades para escolher a referência climática</title>
  <desc id="desc">Séries climáticas documentadas podem apoiar a comparação com um passado definido ou a caracterização de um período recente. A primeira finalidade mantém uma base fixa; a segunda usa uma normal recente. Ambas exigem documentar período e método e avaliar exposição, vulnerabilidade e capacidade de resposta. A referência estatística não é um limite de segurança. Não são representados dados observados.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34454d"/>
    </marker>
    <style>
      .title{font:600 30px Arial,Helvetica,sans-serif;fill:#223039;text-anchor:middle}
      .label{font:600 27px Arial,Helvetica,sans-serif;fill:#223039;text-anchor:middle}
      .body{font:400 25px Arial,Helvetica,sans-serif;fill:#34454d;text-anchor:middle}
      .small{font:400 23px Arial,Helvetica,sans-serif;fill:#46555c;text-anchor:middle}
      .box{stroke:#34454d;stroke-width:2}
      .link{fill:none;stroke:#34454d;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="840" fill="#fff"/>
  <rect class="box" x="260" y="26" width="680" height="88" rx="12" fill="#eef0ef"/>
  <text class="title" x="600" y="79">Séries climáticas documentadas</text>
  <path class="link" d="M460 114 V154 H300 V193"/>
  <path class="link" d="M740 114 V154 H900 V193"/>
  <rect class="box" x="44" y="202" width="512" height="287" rx="12" fill="#e7eeed"/>
  <rect class="box" x="644" y="202" width="512" height="287" rx="12" fill="#f0ebe3"/>
  <text class="label" x="300" y="250">Comparar com o passado</text>
  <text class="body" x="300" y="294">Como as condições mudaram</text>
  <text class="body" x="300" y="328">em relação à mesma referência?</text>
  <path d="M90 353 H510" stroke="#34454d" stroke-width="1.5"/>
  <text class="label" x="300" y="393">Base histórica mantida fixa</text>
  <text class="small" x="300" y="434">Conservar a referência durante</text>
  <text class="small" x="300" y="464">a comparação entre períodos</text>
  <text class="label" x="900" y="250">Caracterizar um período recente</text>
  <text class="body" x="900" y="294">Quais condições descrevem</text>
  <text class="body" x="900" y="328">o período usado no planejamento?</text>
  <path d="M690 353 H1110" stroke="#34454d" stroke-width="1.5"/>
  <text class="label" x="900" y="393">Normal climatológica recente</text>
  <text class="small" x="900" y="434">Explicitar o período escolhido</text>
  <text class="small" x="900" y="464">e acompanhar tendências em curso</text>
  <path class="link" d="M300 489 V548 H440 V584"/>
  <path class="link" d="M900 489 V548 H760 V584"/>
  <rect class="box" x="124" y="594" width="952" height="111" rx="12" fill="#eef0ef"/>
  <text class="label" x="600" y="635">Documentar período e método</text>
  <text class="body" x="600" y="678">Avaliar exposição, vulnerabilidade e capacidade de resposta</text>
  <text class="label" x="600" y="762">Referência estatística não é limite de segurança</text>
  <text class="small" x="600" y="804">Finalidades complementares. Esquema conceitual, sem dados observados.</text>
</svg>
