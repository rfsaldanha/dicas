<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cadeia de representação do fenômeno à decisão</title>
  <desc id="desc">Funil de sete etapas que liga fenômeno, conceito, variável, registro, medida derivada, indicador e informação para decisão. Uma faixa indica o acúmulo de escolhas, perdas e incertezas, e uma seta retorna da decisão à pergunta inicial.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#34454d"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3e38"/>
    </marker>
    <style>
      .label{font:600 28px Arial,Helvetica,sans-serif;fill:#223039;text-anchor:middle}
      .small{font:400 22px Arial,Helvetica,sans-serif;fill:#46555c;text-anchor:middle}
      .side{font:600 25px Arial,Helvetica,sans-serif;fill:#223039}
      .note{font:400 22px Arial,Helvetica,sans-serif;fill:#46555c}
      .band{stroke:#34454d;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <g aria-label="Funil conceitual">
    <path class="band" d="M205 50 H885 L855 122 H235 Z" fill="#eef0ef"/>
    <text class="label" x="545" y="91">Fenômeno</text>

    <path class="band" d="M235 136 H855 L825 208 H265 Z" fill="#e7ebea"/>
    <text class="label" x="545" y="177">Conceito</text>

    <path class="band" d="M265 222 H825 L795 294 H295 Z" fill="#dfe6e5"/>
    <text class="label" x="545" y="263">Variável</text>

    <path class="band" d="M295 308 H795 L765 380 H325 Z" fill="#d6e0df"/>
    <text class="label" x="545" y="349">Registro</text>

    <path class="band" d="M325 394 H765 L735 466 H355 Z" fill="#ccd9d8"/>
    <text class="label" x="545" y="435">Medida derivada</text>

    <path class="band" d="M355 480 H735 L705 552 H385 Z" fill="#becfce"/>
    <text class="label" x="545" y="521">Indicador</text>

    <path class="band" d="M385 566 H705 L675 654 H415 Z" fill="#a9c0c0"/>
    <text class="label" x="545" y="602">Informação para</text>
    <text class="label" x="545" y="632">decisão</text>
  </g>

  <g aria-label="Acúmulo de escolhas, perdas e incertezas">
    <path d="M920 54 H1070 V626 H1130 L995 714 L860 626 H920 Z" fill="#f1e5e3" stroke="#9a3e38" stroke-width="2"/>
    <text class="side" x="995" y="102" text-anchor="middle">Escolhas</text>
    <text class="side" x="995" y="135" text-anchor="middle">perdas</text>
    <text class="side" x="995" y="168" text-anchor="middle">incertezas</text>
    <path d="M995 212 V617" fill="none" stroke="#9a3e38" stroke-width="4" marker-end="url(#arrow-accent)"/>
    <text class="note" x="1020" y="416" transform="rotate(90 1020 416)" text-anchor="middle">acumulam-se e devem ser documentadas</text>
  </g>

  <g aria-label="Retorno da decisão à pergunta inicial">
    <path d="M405 694 C215 716 104 612 104 445 V152 C104 88 132 72 188 72" fill="none" stroke="#34454d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
    <text class="small" x="238" y="724">revisão da pergunta e do método</text>
  </g>
</svg>
