reference-section-title: "Referências"

project:
  output-dir: _output/print
  post-render:
    - sh scripts/optimize_pdf.sh
    - sh scripts/check_pdf.sh

book:
  output-file: dados-indicadores-clima-ambiente-saude
  chapters:
    - index.qmd
    - frontmatter/ficha-tecnica.qmd
    - frontmatter/apresentacao.qmd
    - frontmatter/prefacio.qmd
    - frontmatter/agradecimentos.qmd
    - frontmatter/siglas.qmd
    - backmatter/lista-figuras.qmd
    - backmatter/lista-tabelas.qmd
    - frontmatter/sumario.qmd
    - frontmatter/como-usar.qmd
    - part: "Parte I — Fundamentos, métodos e decisão em saúde"
      chapters:
        - chapters/part-1/01-clima-ambiente-saude.qmd
        - chapters/part-1/02-mudanca-climatica-resposta-sus.qmd
        - chapters/part-1/03-dados-variaveis-indices-indicadores.qmd
        - chapters/part-1/04-espaco-tempo-qualidade.qmd
        - chapters/part-1/05-fontes-fichas.qmd
        - chapters/part-1/06-indicador-decisao.qmd
    - part: "Parte II — Fenômenos e indicadores de clima e ambiente"
      chapters:
        - chapters/part-2/07-temperatura-condicoes-termicas.qmd
        - chapters/part-2/08-precipitacao-secas-eventos-hidrologicos.qmd
        - chapters/part-2/09-qualidade-ar-queimadas-fumaca.qmd
        - chapters/part-2/10-agua-saneamento-qualidade-ambiental.qmd
        - chapters/part-2/11-uso-cobertura-terra-ambiente-urbano.qmd
        - chapters/part-2/12-eventos-severos-desastres.qmd
    - part: "Parte III — Exposição, vulnerabilidade, efeitos e resposta em saúde"
      chapters:
        - chapters/part-3/13-exposicao-vulnerabilidade.qmd
        - chapters/part-3/14-efeitos-saude.qmd
        - chapters/part-3/15-resposta-adaptacao-resiliencia.qmd
    - part: "Parte IV — Fichas de indicadores e fontes de dados"
      chapters:
        - backmatter/lista-fichas.qmd
        - backmatter/indice-indicadores.qmd
        - chapters/part-4/16-fichas-temperatura-condicoes-termicas.qmd
        - chapters/part-4/17-fichas-precipitacao-secas-eventos-hidrologicos.qmd
        - chapters/part-4/18-fichas-qualidade-ar-queimadas-fumaca.qmd
        - chapters/part-4/19-fichas-agua-saneamento-qualidade-ambiental.qmd
        - chapters/part-4/20-fichas-uso-cobertura-terra-ambiente-urbano.qmd
        - chapters/part-4/21-fichas-eventos-severos-desastres.qmd
        - chapters/part-4/22-fichas-exposicao-vulnerabilidade.qmd
        - chapters/part-4/23-fichas-efeitos-saude.qmd
        - chapters/part-4/24-fichas-resposta-adaptacao-resiliencia.qmd
        - backmatter/indice-fontes.qmd
    - backmatter/glossario.qmd
    - backmatter/referencias.qmd
  appendices:
    - backmatter/apendice-metodologico.qmd
    - backmatter/apendice-estacoes.qmd

format:
  dicas-print-typst:
    citeproc: true
    filters:
      - scripts/remove_empty_print_chapter.lua
    toc: false
    toc-depth: 1
    number-sections: true
    section-numbering: "1.1"
    page-numbering: "1"
    mainfont: "Libertinus Serif"
    font-paths: [assets/fonts]
    fontsize: 10.5pt
    linestretch: 1.333333
    syntax-highlighting: monochrome
    mermaid-format: svg
    mermaid:
      theme: neutral
    linkcolor: "000000"
    citecolor: "000000"
    include-after-body: includes/uiclap-after-body.typ
