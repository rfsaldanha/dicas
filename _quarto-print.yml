project:
  output-dir: _output/print
  post-render:
    - sh scripts/check_pdf.sh

book:
  output-file: dados-indicadores-clima-ambiente-saude
  date: "2026-08-04"

format:
  dicas-print-typst:
    toc: false
    toc-depth: 1
    number-sections: true
    section-numbering: "1.1"
    page-numbering: "1"
    mainfont: "Libertinus Serif"
    fontsize: 10.5pt
    linestretch: 1.08
    syntax-highlighting: monochrome
    mermaid-format: svg
    mermaid:
      theme: neutral
    linkcolor: "000000"
    citecolor: "000000"
    include-after-body: includes/uiclap-after-body.typ
