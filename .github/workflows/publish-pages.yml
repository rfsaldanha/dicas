name: Publicar edição preliminar

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - name: Instalar dependência R
        run: Rscript -e 'install.packages("yaml")'
      - name: Compilar e validar edição preliminar
        run: make preliminar
      - name: Testar referências e proteção do artefato
        run: python3 scripts/test_preliminar.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _output/preliminar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
